<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agent Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#07080e;--s1:#0d0f18;--s2:#12141f;--s3:#181b28;--s4:#1e2133;
  --b1:#1a1d2e;--b2:#252840;--b3:#333658;
  --t1:#e8eaf4;--t2:#8b8fa8;--t3:#4e5270;
  --ac:#6c5ce7;--ac2:#a29bfe;--ac3:#3d32a8;--acbg:rgba(108,92,231,.08);
  --ok:#00b894;--warn:#fdcb6e;--err:#e17055;--info:#74b9ff;
  --cs:#74b9ff;--ca:#00b894;--cd:#a29bfe;--cc:#e17055;--cm:#fdcb6e;--cy:#fd79a8;
  --ease:cubic-bezier(.16,1,.3,1);--fast:.12s;--med:.22s;--slow:.4s;
  --glass:rgba(13,15,24,.65);--glass-b:rgba(255,255,255,.04);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
:focus{outline:none}:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.05ms!important}}

/* ═══ AMBIENT BACKGROUND ═══ */
body::before{content:'';position:fixed;top:-30%;left:-20%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(108,92,231,.06) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-20%;right:-15%;width:50%;height:60%;background:radial-gradient(ellipse,rgba(0,184,148,.04) 0%,transparent 70%);pointer-events:none;z-index:0}

/* ═══ NOISE OVERLAY ═══ */
.noise{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ═══ BOOT ═══ */
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s var(--ease),visibility .8s}
#boot.off{opacity:0;visibility:hidden;pointer-events:none}
.bk-title{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;letter-spacing:.08em;color:var(--t3);margin-bottom:48px;text-align:center}
.bk-title b{color:var(--ac);text-shadow:0 0 40px rgba(108,92,231,.3)}
.bk-bar{width:200px;height:2px;background:var(--b1);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bk-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px;transition:width .5s var(--ease)}
.bk-msg{font:400 .58rem/1 'Geist Mono',monospace;color:var(--t3);letter-spacing:.2em;text-transform:uppercase}

/* ═══ TOPBAR ═══ */
#top{position:fixed;top:12px;left:16px;right:16px;height:52px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-b);border-radius:14px;z-index:100;display:flex;align-items:center;padding:0 6px 0 20px;gap:8px;box-shadow:0 4px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.logo{font:800 .62rem/1 'Outfit',sans-serif;letter-spacing:.14em;color:var(--t3);white-space:nowrap;user-select:none}
.logo b{color:var(--ac)}
.stats{display:flex;gap:2px;flex:1;justify-content:center}
.st{display:flex;align-items:center;gap:4px;padding:6px 16px;border-radius:10px;transition:background var(--fast) var(--ease);cursor:default}
.st:hover{background:rgba(255,255,255,.03)}
.st-n{font:700 .95rem/1 'Geist Mono',monospace}
.st-l{font:500 .5rem/1 'Outfit',sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.vt{display:inline-flex;background:rgba(255,255,255,.04);border-radius:10px;padding:3px;gap:2px}
.vt button{padding:5px 12px;font:600 .52rem/1 'Outfit',sans-serif;letter-spacing:.05em;background:0;color:var(--t3);border:0;cursor:pointer;border-radius:8px;transition:all var(--fast) var(--ease);min-height:28px}
.vt button:hover{color:var(--t2)}.vt button:active{transform:scale(.95)}
.vt button.on{background:var(--ac);color:#fff;box-shadow:0 2px 12px rgba(108,92,231,.35)}
.dot-live{display:flex;align-items:center;gap:4px;font:600 .5rem/1 'Geist Mono',monospace;color:var(--ok);letter-spacing:.03em;padding:0 8px}
.dot-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pls 2s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.25}}
.tbtn{padding:5px 14px;font:600 .52rem/1 'Outfit',sans-serif;background:rgba(255,255,255,.04);color:var(--t2);border:1px solid rgba(255,255,255,.06);border-radius:10px;cursor:pointer;transition:all var(--fast) var(--ease);min-height:28px;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{border-color:var(--ac);color:var(--t1);background:rgba(108,92,231,.08)}.tbtn:active{transform:scale(.95)}

/* ═══ SIDEBAR — glass panels, no cards ═══ */
#side{position:fixed;top:76px;right:16px;width:300px;bottom:58px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--glass-b);border-radius:16px;z-index:90;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.03)}
.tabs{display:flex;padding:6px;gap:3px;flex-shrink:0}
.tab{flex:1;padding:8px 0;text-align:center;font:600 .52rem/1 'Outfit',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);cursor:pointer;border-radius:8px;transition:all var(--fast) var(--ease)}
.tab:hover{color:var(--t2);background:rgba(255,255,255,.03)}.tab:active{transform:scale(.96)}
.tab.on{color:var(--ac);background:var(--acbg)}
.sb{flex:1;overflow-y:auto;padding:4px 0}

/* Agent rows */
.ag{padding:10px 14px;cursor:pointer;transition:background var(--fast) var(--ease);position:relative}
.ag:hover{background:rgba(255,255,255,.02)}.ag:active{background:rgba(255,255,255,.04)}
.ag+.ag::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--b1)}
.ag-r{display:flex;align-items:center;gap:10px}
.ag-d{width:8px;height:8px;border-radius:50%;flex-shrink:0;position:relative}
.ag-d.on::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid currentColor;opacity:.3;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.3}100%{transform:scale(1.8);opacity:0}}
.ag-i{flex:1;min-width:0}
.ag-nm{font:600 .7rem/1.3 'Outfit',sans-serif}
.ag-sub{font:400 .52rem/1.3 'Geist Mono',monospace;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-s{font:700 .44rem/1 'Geist Mono',monospace;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;flex-shrink:0}
.ag-s.live{background:rgba(0,184,148,.1);color:var(--ok)}.ag-s.lim{background:rgba(253,203,110,.1);color:var(--warn)}.ag-s.err{background:rgba(225,112,85,.1);color:var(--err)}.ag-s.off{background:rgba(78,82,112,.1);color:var(--t3)}
.ag-x{max-height:0;overflow:hidden;transition:max-height var(--slow) var(--ease)}
.ag.open .ag-x{max-height:180px}
.ag-det{padding-top:10px;margin-top:8px;border-top:1px solid var(--b1);font-size:.57rem;color:var(--t2)}
.ag-dr{display:flex;justify-content:space-between;margin-bottom:3px}.ag-dr span:first-child{color:var(--t3)}
.pips{display:flex;gap:2px;margin-top:6px}
.pip{height:4px;flex:1;border-radius:2px;background:var(--b1);transition:background var(--fast) var(--ease)}
.pip.f{background:var(--ac)}

/* Feed */
.fi{display:flex;gap:8px;padding:8px 14px;animation:slideIn var(--slow) var(--ease) both}
.fi+.fi{border-top:1px solid rgba(255,255,255,.02)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.fi-d{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.fi-b{flex:1}.fi-t{font:.57rem/1.5 'Outfit',sans-serif;color:var(--t2)}.fi-t strong{font-weight:600}
.fi-tm{font:.44rem/1 'Geist Mono',monospace;color:var(--t3);margin-top:2px}

/* Insights */
.ins{padding:12px 14px;cursor:pointer;transition:all var(--fast) var(--ease);position:relative}
.ins:hover{background:rgba(255,255,255,.02)}.ins:active{transform:scale(.998)}
.ins+.ins::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--b1)}
.ins-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.nv{font:700 .44rem/1 'Geist Mono',monospace;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.nv.h{background:rgba(0,184,148,.1);color:var(--ok)}.nv.m{background:rgba(253,203,110,.1);color:var(--warn)}.nv.l{background:rgba(78,82,112,.1);color:var(--t3)}
.ins-dt{font:.44rem/1 'Geist Mono',monospace;color:var(--t3)}
.ins-p{font:.57rem/1.6 'Outfit',sans-serif;color:var(--t2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--t3);padding:48px 20px;font:.6rem/1.7 'Outfit',sans-serif}

/* ═══ CANVAS ═══ */
#wrap{position:fixed;top:76px;left:16px;right:328px;bottom:58px;border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid rgba(255,255,255,.03)}
#cv{display:block;width:100%;height:100%}
#gv{position:absolute;inset:0;display:none;background:var(--bg)}
#gv svg{width:100%;height:100%}
#gs{position:absolute;top:14px;left:14px;padding:8px 14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:10px;color:var(--t1);font:.68rem/1 'Outfit',sans-serif;outline:0;width:220px;transition:border-color var(--fast) var(--ease)}
#gs::placeholder{color:var(--t3)}#gs:focus-visible{border-color:var(--ac);outline:0}

/* ═══ BOTTOM BAR ═══ */
#bar{position:fixed;bottom:12px;left:16px;right:16px;height:38px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--glass-b);border-radius:12px;z-index:100;display:flex;align-items:center;padding:0 6px 0 16px;gap:3px;box-shadow:0 4px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.03)}
.fl{font:700 .46rem/1 'Geist Mono',monospace;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.fb{padding:5px 10px;font:500 .54rem/1 'Outfit',sans-serif;background:0;color:var(--t3);border:0;border-radius:8px;cursor:pointer;transition:all var(--fast) var(--ease);min-height:26px}
.fb:hover{color:var(--t2);background:rgba(255,255,255,.03)}.fb:active{transform:scale(.93)}
.fb.on{background:var(--acbg);color:var(--ac);font-weight:600}
.bc{margin-left:auto;font:.44rem/1 'Geist Mono',monospace;color:var(--t3);padding-right:10px}

/* ═══ POPUP ═══ */
#pop{position:fixed;z-index:200;width:440px;max-height:540px;background:var(--s2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--b2);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.04);display:none;opacity:0;transform:scale(.88) translateY(12px);transition:opacity var(--med) var(--ease),transform var(--med) var(--ease);overflow:hidden;flex-direction:column}
#pop.vis{display:flex;opacity:1;transform:scale(1) translateY(0)}
#pop.cls{opacity:0;transform:scale(.93) translateY(6px)}
.ph{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.pa{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font:700 .6rem/1 'Outfit',sans-serif;border:1px solid rgba(255,255,255,.06)}
.px{width:30px;height:30px;border-radius:8px;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--t3);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--fast) var(--ease);flex-shrink:0}
.px:hover{background:var(--err);color:#fff;border-color:var(--err);box-shadow:0 0 16px rgba(225,112,85,.3)}.px:active{transform:scale(.88)}
.pt{padding:0 18px 8px;font:700 1rem/1.3 'Outfit',sans-serif;text-wrap:balance}
.pm{padding:0 18px 12px;display:flex;gap:8px;align-items:center}
.pd{font:.52rem/1 'Geist Mono',monospace;color:var(--t3)}
.ps{font:700 .46rem/1 'Geist Mono',monospace;padding:3px 8px;border-radius:6px}
.pbod{padding:0 18px 16px;flex:1;overflow-y:auto;font:.68rem/1.85 'Outfit',sans-serif;color:var(--t2);white-space:pre-wrap;word-break:break-word;max-width:65ch}
.pft{padding:10px 18px 14px;border-top:1px solid var(--b1);display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0}
.ptg{font:.46rem/1 'Outfit',sans-serif;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.04);color:var(--t2);border:1px solid rgba(255,255,255,.04)}
</style>
</head>
<body>
<div class="noise"></div>

<!-- BOOT -->
<div id="boot">
  <div class="bk-title">// <b>AGENT RESEARCH HUB</b></div>
  <div class="bk-bar"><div class="bk-fill" id="bf"></div></div>
  <div class="bk-msg" id="bm">Initializing</div>
</div>

<!-- TOPBAR — floating glass pill -->
<header id="top" role="banner">
  <div class="logo">// <b>AGENT HUB</b></div>
  <div class="stats">
    <div class="st"><div><div class="st-n mono" id="xR" style="color:var(--ac2)">--</div><div class="st-l">Results</div></div></div>
    <div class="st"><div><div class="st-n mono" id="xA" style="color:var(--ok)">--</div><div class="st-l">Active</div></div></div>
    <div class="st"><div><div class="st-n mono" id="xQ" style="color:var(--warn)">--</div><div class="st-l">Score 7+</div></div></div>
    <div class="st"><div><div class="st-n mono" id="xC" style="color:var(--info)">00:00:00</div><div class="st-l">Uptime</div></div></div>
  </div>
  <div class="right">
    <div class="vt" role="tablist"><button class="on" data-v="robots" onclick="setView('robots')" role="tab">Robots</button><button data-v="graph" onclick="setView('graph')" role="tab">Graph</button></div>
    <div class="dot-live">Live</div>
    <button class="tbtn" onclick="window.open('/api/export','_blank')" aria-label="Export data">Export</button>
  </div>
</header>

<!-- CANVAS -->
<main id="wrap" role="main">
  <canvas id="cv" aria-label="Agent visualization"></canvas>
  <div id="gv"><input id="gs" type="search" placeholder="Search topics..." aria-label="Search topics" oninput="buildGraph()"></div>
</main>

<!-- SIDEBAR — glass panel -->
<aside id="side" role="complementary">
  <div class="tabs" role="tablist">
    <div class="tab on" data-t="agents" onclick="setTab('agents')" role="tab">Agents</div>
    <div class="tab" data-t="feed" onclick="setTab('feed')" role="tab">Activity</div>
    <div class="tab" data-t="insights" onclick="setTab('insights')" role="tab">Insights</div>
  </div>
  <div class="sb" id="sb" role="tabpanel"></div>
</aside>

<!-- BOTTOM BAR — floating glass -->
<nav id="bar" role="navigation" aria-label="Filters">
  <span class="fl">Filter</span>
  <button class="fb on" data-f="all" onclick="setFilter('all')">All</button>
  <span class="bc" id="bc" aria-live="polite">0 results</span>
</nav>

<!-- POPUP -->
<div id="pop" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="ph"><div class="pa" id="pag"></div><button class="px" onclick="closePop()" aria-label="Close">&#x2715;</button></div>
  <div class="pt" id="ptitle"></div>
  <div class="pm"><span class="pd" id="pdt"></span><span class="ps" id="psc"></span></div>
  <div class="pbod" id="pbody"></div>
  <div class="pft" id="pfoot"></div>
</div>

<script>
const AG={
  market_scout:  {n:'Scout',  h:'#74b9ff',m:'Gemini Flash', p:'Google'},
  trend_analyst: {n:'Analyst',h:'#00b894',m:'Groq Llama',   p:'Groq'},
  deep_diver:    {n:'Diver',  h:'#a29bfe',m:'Nemotron',     p:'OpenRouter'},
  critic:        {n:'Critic', h:'#e17055',m:'DeepSeek R1',  p:'OpenRouter'},
  memory:        {n:'Memory', h:'#fdcb6e',m:'Gemini Flash', p:'Google'},
  synthesis:     {n:'Synth',  h:'#fd79a8',m:'Groq Llama',   p:'Groq'}
};
const PIPES=[['market_scout','critic'],['trend_analyst','critic'],['deep_diver','critic'],['critic','memory'],['critic','synthesis'],['memory','market_scout']];
const S={stats:null,res:[],ins:[],view:'robots',filt:'all',tab:'agents',t0:Date.now()};
let bbl=[],rob={},cv,cx,W,H,feed=[],prc=0,particles=[];

// Boot
(function(){
  const b=document.getElementById('bf'),m=document.getElementById('bm');
  const steps=[{p:20,t:'Initializing',d:0},{p:50,t:'Connecting to database',d:500},{p:80,t:'Loading agent data',d:1100},{p:100,t:'System online',d:1700}];
  steps.forEach(s=>setTimeout(()=>{b.style.width=s.p+'%';m.textContent=s.t},s.d));
  setTimeout(()=>{document.getElementById('boot').classList.add('off');init()},2500);
})();

function init(){
  setupCv();buildFB();initRob();poll();
  setInterval(fetchS,5000);setInterval(fetchR,10000);setInterval(fetchI,15000);setInterval(tick,1000);
  requestAnimationFrame(frame);renderSb();
  window.addEventListener('resize',()=>{szCv();if(S.view==='graph')buildGraph()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
}

async function fetchS(){try{const r=await fetch('/api/stats');if(!r.ok)throw 0;S.stats=await r.json();updTop();if(S.tab==='agents')renderSb()}catch(e){}}
async function fetchR(){try{const r=await fetch('/api/results');if(!r.ok)throw 0;const d=await r.json();if(d.length!==prc){const o=new Set(S.res.map(x=>x.id));d.filter(x=>!o.has(x.id)).forEach(x=>addFi(x.agent,'researched '+trn(x.topic,28),x.created_at));S.res=d;prc=d.length;seedBbl();if(S.view==='graph')buildGraph()}}catch(e){}}
async function fetchI(){try{const r=await fetch('/api/insights');if(!r.ok)throw 0;S.ins=await r.json();if(S.tab==='insights')renderSb()}catch(e){}}
function poll(){fetchS();fetchR();fetchI()}

function updTop(){if(!S.stats)return;document.getElementById('xR').textContent=S.stats.total_results||0;document.getElementById('xA').textContent=S.stats.active_agents||0;document.getElementById('xQ').textContent=S.stats.high_quality_results||0}
function tick(){const d=Math.floor((Date.now()-S.t0)/1000);document.getElementById('xC').textContent=`${String(d/3600|0).padStart(2,'0')}:${String((d%3600)/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`}
function setView(v){S.view=v;document.querySelectorAll('.vt button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.getElementById('gv').style.display=v==='graph'?'block':'none';document.getElementById('cv').style.display=v==='robots'?'block':'none';if(v==='graph')buildGraph()}
function setTab(t){S.tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));renderSb()}
function renderSb(){const e=document.getElementById('sb');e.innerHTML=S.tab==='agents'?rAg():S.tab==='feed'?rFd():rIn()}

function rAg(){let h='';for(const[k,a]of Object.entries(AG)){const s=S.stats?.agents?.[k],st=s?.status||'offline';const c=st==='active'?'live':(st==='rate_limited'?'lim':(st==='error'?'err':'off'));const l=st==='active'?'Live':(st==='rate_limited'?'Limited':(st==='error'?'Error':'Offline'));const tk=s?.tasks_completed||0,lr=s?.last_run?fmt(s.last_run):'--',on=st==='active';let rl='';if(s?.rate_limit_until){try{const m=Math.max(0,Math.round((new Date(s.rate_limit_until)-new Date())/6e4));if(m>0)rl=m+'m'}catch(e){}}const avg=s?.total_score&&tk?Math.round(s.total_score/tk):0;let pp='';for(let i=0;i<10;i++)pp+=`<div class="pip${i<avg?' f':''}"></div>`;
h+=`<div class="ag" onclick="this.classList.toggle('open')" tabindex="0"><div class="ag-r"><div class="ag-d${on?' on':''}" style="background:${a.h};color:${a.h}"></div><div class="ag-i"><div class="ag-nm" style="color:${a.h}">${a.n}</div><div class="ag-sub">${a.m} / ${a.p}</div></div><span class="ag-s ${c}">${l}</span></div><div class="ag-x"><div class="ag-det"><div class="ag-dr"><span>Tasks</span><span class="mono">${tk}</span></div><div class="ag-dr"><span>Last run</span><span>${lr}</span></div><div class="ag-dr"><span>Key</span><span class="mono">${k}</span></div>${rl?`<div class="ag-dr"><span>Reset</span><span style="color:var(--warn)">${rl}</span></div>`:''}<div class="ag-dr"><span>Avg score</span><span class="mono">${avg}/10</span></div><div class="pips">${pp}</div></div></div></div>`}return h}

function rFd(){if(!feed.length)return'<div class="empty">Waiting for agent activity.<br>Results appear as agents complete research.</div>';return feed.slice(-50).reverse().map(f=>{const a=AG[f.ag]||{h:'#888',n:f.ag};return`<div class="fi"><div class="fi-d" style="background:${a.h}"></div><div class="fi-b"><div class="fi-t"><strong style="color:${a.h}">${a.n}</strong> ${esc(f.msg)}</div><div class="fi-tm">${fmt(f.t)}</div></div></div>`}).join('')}

function rIn(){if(!S.ins.length)return'<div class="empty">No insights yet.<br>Memory agent synthesizes patterns from research.</div>';return S.ins.map((x,i)=>{const ns=x.novelty_score||0,c=ns>=7?'h':(ns>=4?'m':'l'),l=ns>=7?'High':(ns>=4?'Mid':'Low');return`<div class="ins" onclick="openIns(${i})" tabindex="0"><div class="ins-h"><span class="nv ${c}">${l} ${ns}/10</span><span class="ins-dt">${fmt(x.created_at)}</span></div><div class="ins-p">${esc(x.content||'')}</div></div>`}).join('')}

function addFi(ag,msg,t){feed.push({ag,msg,t:t||new Date().toISOString()});if(feed.length>80)feed.shift();if(S.tab==='feed')renderSb()}
function openIns(i){const x=S.ins[i];if(!x)return;showPop({agent:'memory',topic:'Research Insight',content:x.content,score:x.novelty_score,created_at:x.created_at},innerWidth/2-220,innerHeight/2-220)}

function buildFB(){const b=document.getElementById('bar');Object.entries(AG).forEach(([k,a])=>{const btn=document.createElement('button');btn.className='fb';btn.dataset.f=k;btn.textContent=a.n;btn.onclick=()=>setFilter(k);b.insertBefore(btn,document.getElementById('bc'))})}
function setFilter(f){S.filt=f;document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.dataset.f===f));updBc();if(S.view==='graph')buildGraph()}
function updBc(){document.getElementById('bc').textContent=(S.filt==='all'?bbl.length:bbl.filter(b=>b.ag===S.filt).length)+' results'}

function setupCv(){cv=document.getElementById('cv');cx=cv.getContext('2d');szCv()}
function szCv(){const w=document.getElementById('wrap');W=w.clientWidth;H=w.clientHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);reposRob()}

function initRob(){const ks=Object.keys(AG),ps=[{x:.12,y:.34},{x:.32,y:.64},{x:.55,y:.26},{x:.76,y:.58},{x:.46,y:.78},{x:.88,y:.34}];ks.forEach((k,i)=>{const p=ps[i]||{x:.2+Math.random()*.6,y:.3+Math.random()*.4};rob[k]={k,d:AG[k],xr:p.x,yr:p.y,x:0,y:0,ph:Math.random()*Math.PI*2}});reposRob()}
function reposRob(){Object.values(rob).forEach(r=>{r.x=r.xr*W;r.y=r.yr*H})}

function seedBbl(){bbl=[];const g={};S.res.forEach(r=>{if(!g[r.agent])g[r.agent]=[];g[r.agent].push(r)});Object.entries(g).forEach(([ag,rs])=>{rs.slice(0,22).forEach(r=>{const a=Math.random()*Math.PI*2,d=45+Math.random()*130,rb=rob[ag];const bx=rb?rb.x+Math.cos(a)*d:Math.random()*W,by=rb?rb.y+Math.sin(a)*d:Math.random()*H;bbl.push({res:r,ag:r.agent,x:cl(bx,16,W-16),y:cl(by,16,H-16),vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,rad:Math.max(4,Math.min(14,(r.score||3)*1.4)),hex:AG[ag]?.h||'#888'})})});updBc()}
function cl(v,a,b){return Math.max(a,Math.min(b,v))}

let lt=0;
function frame(ts){const dt=Math.min((ts-lt)/16.67,3);lt=ts;if(S.view==='robots')draw(dt,ts);requestAnimationFrame(frame)}

function draw(dt,ts){
  cx.clearRect(0,0,W,H);
  // Subtle grid
  cx.fillStyle='rgba(100,105,160,.04)';for(let x=18;x<W;x+=24)for(let y=18;y<H;y+=24)cx.fillRect(x,y,1,1);

  const vis=S.filt==='all'?bbl:bbl.filter(b=>b.ag===S.filt);

  // Pipeline
  PIPES.forEach(([a,b])=>{const ra=rob[a],rb=rob[b];if(!ra||!rb)return;const on=S.stats?.agents?.[a]?.status==='active';cx.beginPath();cx.moveTo(ra.x,ra.y);cx.lineTo(rb.x,rb.y);cx.strokeStyle=on?'rgba(162,155,254,.08)':'rgba(50,53,80,.05)';cx.lineWidth=on?1:.6;cx.setLineDash([3,6]);cx.stroke();cx.setLineDash([])});

  // Cross-topic links
  const bt={};vis.forEach(b=>{const t=b.res.topic;if(!bt[t])bt[t]=[];bt[t].push(b)});
  Object.values(bt).forEach(g=>{if(g.length<2)return;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){if(g[i].ag===g[j].ag)continue;cx.beginPath();cx.moveTo(g[i].x,g[i].y);cx.lineTo(g[j].x,g[j].y);cx.strokeStyle='rgba(162,155,254,.04)';cx.lineWidth=.4;cx.stroke();const mx=(g[i].x+g[j].x)/2,my=(g[i].y+g[j].y)/2;cx.beginPath();cx.arc(mx,my,1.2,0,Math.PI*2);cx.fillStyle='rgba(162,155,254,.1)';cx.fill()}});

  // Bubbles
  vis.forEach(b=>{
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-b.rad<0){b.x=b.rad;b.vx=Math.abs(b.vx)}if(b.x+b.rad>W){b.x=W-b.rad;b.vx=-Math.abs(b.vx)}
    if(b.y-b.rad<0){b.y=b.rad;b.vy=Math.abs(b.vy)}if(b.y+b.rad>H){b.y=H-b.rad;b.vy=-Math.abs(b.vy)}
    const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.rad*2.8);g.addColorStop(0,ha(b.hex,.06));g.addColorStop(1,ha(b.hex,0));
    cx.beginPath();cx.arc(b.x,b.y,b.rad*2.8,0,Math.PI*2);cx.fillStyle=g;cx.fill();
    cx.beginPath();cx.arc(b.x,b.y,b.rad,0,Math.PI*2);cx.fillStyle=ha(b.hex,.12);cx.strokeStyle=ha(b.hex,.3);cx.lineWidth=.6;cx.fill();cx.stroke();
    cx.beginPath();cx.arc(b.x,b.y,.8,0,Math.PI*2);cx.fillStyle=ha(b.hex,.5);cx.fill();
  });

  // Particles
  if(Math.random()<.025){const ap=PIPES.filter(([a])=>S.stats?.agents?.[a]?.status==='active');if(ap.length){const[a,b]=ap[Math.random()*ap.length|0];const ra=rob[a],rb=rob[b];if(ra&&rb)particles.push({ox:ra.x,oy:ra.y,tx:rb.x,ty:rb.y,t:0,sp:.005+Math.random()*.008,c:ra.d.h})}}
  particles=particles.filter(p=>{p.t+=p.sp*dt;if(p.t>=1)return false;const px=p.ox+(p.tx-p.ox)*p.t,py=p.oy+(p.ty-p.oy)*p.t;cx.beginPath();cx.arc(px,py,1.4,0,Math.PI*2);cx.fillStyle=p.c;cx.globalAlpha=.45*(1-p.t);cx.fill();cx.globalAlpha=1;return true});

  // Robots
  Object.values(rob).forEach(r=>{
    const st=S.stats?.agents?.[r.k]?.status,on=st==='active',op=on?1:.18;
    const bob=on?Math.sin(ts/750+r.ph)*2:0,x=r.x,y=r.y+bob,c=r.d.h;
    cx.save();cx.globalAlpha=op;
    if(on){const h=cx.createRadialGradient(x,y-4,0,x,y-4,44);h.addColorStop(0,ha(c,.045));h.addColorStop(1,ha(c,0));cx.beginPath();cx.arc(x,y-4,44,0,Math.PI*2);cx.fillStyle=h;cx.fill()}
    cx.fillStyle=ha(c,.06);cx.beginPath();cx.ellipse(x,y+24,17,3.5,0,0,Math.PI*2);cx.fill();
    cx.fillStyle=ha(c,.16);cx.strokeStyle=ha(c,.4);cx.lineWidth=1;rr(x-9,y-2,18,16,3);cx.fill();cx.stroke();
    cx.fillStyle=ha(c,.22);rr(x-7,y-16,14,13,2.5);cx.fill();cx.stroke();
    cx.fillStyle=ha('#fff',on?.8:.15);if(on){cx.shadowColor=c;cx.shadowBlur=4}
    cx.beginPath();cx.arc(x-2.5,y-10,1.4,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(x+2.5,y-10,1.4,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
    cx.strokeStyle=ha(c,.35);cx.lineWidth=.7;cx.beginPath();cx.moveTo(x,y-16);cx.lineTo(x,y-23);cx.stroke();
    const ap=on?.3+.7*Math.sin(ts/180+r.ph):.1;cx.beginPath();cx.arc(x,y-23,2,0,Math.PI*2);cx.fillStyle=ha(c,ap);cx.fill();
    cx.globalAlpha=op*.75;cx.fillStyle=c;cx.font='600 7.5px "Geist Mono"';cx.textAlign='center';cx.fillText(r.d.n,x,y+34);
    if(st==='rate_limited'){cx.fillStyle=ha('#fdcb6e',.5);cx.font='500 5.5px "Geist Mono"';cx.fillText('LIMITED',x,y+42)}
    cx.restore();
  });
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.quadraticCurveTo(x+w,y,x+w,y+r);cx.lineTo(x+w,y+h-r);cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);cx.quadraticCurveTo(x,y+h,x,y+h-r);cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);cx.closePath()}

cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const vis=S.filt==='all'?bbl:bbl.filter(b=>b.ag===S.filt);for(let i=vis.length-1;i>=0;i--)if(Math.hypot(mx-vis[i].x,my-vis[i].y)<vis[i].rad+5){showPop(vis[i].res,e.clientX,e.clientY);return}});

function buildGraph(){const c=document.getElementById('gv');c.querySelectorAll('svg').forEach(s=>s.remove());const w=c.clientWidth,h=c.clientHeight,svg=d3.select(c).append('svg').attr('width',w).attr('height',h);const df=svg.append('defs'),pt=df.append('pattern').attr('id','gd').attr('width',24).attr('height',24).attr('patternUnits','userSpaceOnUse');pt.append('circle').attr('cx',12).attr('cy',12).attr('r',.4).attr('fill','rgba(100,105,160,.06)');svg.append('rect').attr('width',w).attr('height',h).attr('fill','url(#gd)');let fl=S.filt==='all'?S.res:S.res.filter(r=>r.agent===S.filt);const q=(document.getElementById('gs').value||'').toLowerCase();if(q)fl=fl.filter(r=>(r.topic||'').toLowerCase().includes(q));if(!fl.length){svg.append('text').attr('x',w/2).attr('y',h/2).attr('text-anchor','middle').attr('fill','#4e5270').attr('font-size',11).attr('font-family','Outfit').text('No results');return}const tops=[...new Set(fl.map(r=>r.topic))],nodes=[],links=[];tops.forEach(t=>nodes.push({id:'t_'+t,type:'topic',label:t,r:12}));fl.forEach(r=>{const a=AG[r.agent]||{h:'#888'};nodes.push({id:'r_'+r.id,type:'res',data:r,color:a.h,r:Math.max(3,Math.min(10,(r.score||3)*1))});links.push({source:'r_'+r.id,target:'t_'+r.topic})});const g=svg.append('g');svg.call(d3.zoom().scaleExtent([.2,5]).on('zoom',e=>g.attr('transform',e.transform)));const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(40)).force('charge',d3.forceManyBody().strength(-45)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide(d=>d.r+2));g.selectAll('.l').data(links).enter().append('line').attr('stroke','rgba(162,155,254,.08)').attr('stroke-width',.4);const node=g.selectAll('.n').data(nodes).enter().append('g').attr('cursor','pointer').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));node.append('circle').attr('r',d=>d.r).attr('fill',d=>d.type==='topic'?'rgba(255,255,255,.03)':ha(d.color,.15)).attr('stroke',d=>d.type==='topic'?'rgba(255,255,255,.06)':ha(d.color,.35)).attr('stroke-width',d=>d.type==='topic'?.7:.4);node.filter(d=>d.type==='topic').append('text').text(d=>(d.label||'').substring(0,13)).attr('text-anchor','middle').attr('dy',d=>d.r+8).attr('fill','rgba(140,142,175,.35)').attr('font-size',6).attr('font-family','Outfit');node.on('click',(e,d)=>{if(d.type==='res'&&d.data)showPop(d.data,e.clientX,e.clientY)});const lk=g.selectAll('line');sim.on('tick',()=>{lk.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`)})}

function showPop(res,mx,my){const p=document.getElementById('pop'),a=AG[res.agent]||{n:res.agent||'Unknown',h:'#888'};document.getElementById('pag').innerHTML=a.n;document.getElementById('pag').style.cssText=`background:${ha(a.h,.08)};color:${a.h};border-color:${ha(a.h,.15)}`;document.getElementById('ptitle').textContent=res.topic||'Research Result';document.getElementById('pdt').textContent=fmt(res.created_at);const sc=res.score||0,se=document.getElementById('psc');se.textContent=sc+'/10';se.style.cssText=sc>=7?'background:rgba(0,184,148,.1);color:var(--ok)':(sc>=4?'background:rgba(253,203,110,.1);color:var(--warn)':'background:rgba(78,82,112,.1);color:var(--t3)');document.getElementById('pbody').textContent=res.content||'No content available.';document.getElementById('pfoot').innerHTML=[res.agent,...(res.topic||'').split(' ').slice(0,2)].map(t=>`<span class="ptg">${esc(t)}</span>`).join('');let l=mx+14,t=my-50;if(l+460>innerWidth)l=mx-454;if(t+560>innerHeight)t=innerHeight-570;if(t<52)t=52;if(l<8)l=8;p.style.left=l+'px';p.style.top=t+'px';p.classList.remove('cls');p.style.display='flex';requestAnimationFrame(()=>p.classList.add('vis'))}
function closePop(){const p=document.getElementById('pop');p.classList.add('cls');p.classList.remove('vis');setTimeout(()=>{p.style.display='none';p.classList.remove('cls')},200)}

function ha(hex,a){if(!hex||hex.startsWith('var')||hex.startsWith('rgba'))return hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function fmt(t){if(!t)return'--';try{const d=new Date(t);return isNaN(d)?t:d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch(e){return t}}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function trn(s,n){return s&&s.length>n?s.slice(0,n)+'...':s||''}
</script>
</body>
