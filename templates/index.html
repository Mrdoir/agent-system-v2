<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f17;--panel:#161622;--panel2:#1a1a2a;--border:#1e1e2e;--border2:#282840;
  --purple:#7c6fcd;--teal:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--pink:#ec4899;--red:#ef4444;--cyan:#06b6d4;
  --text:#e2e2ef;--text2:#8888a8;--text3:#555570;--text4:#3a3a52;
}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── LOADING ── */
#loadScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#loadScreen.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{font-size:26px;font-weight:900;letter-spacing:4px;margin-bottom:36px}
.ld-logo i{font-style:normal;color:var(--purple);text-shadow:0 0 30px rgba(124,111,205,.4)}
.ld-bar-o{width:260px;height:3px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px}
.ld-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--blue));border-radius:6px;transition:width .5s ease}
.ld-txt{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase}

/* ── TOPBAR ── */
#topbar{position:fixed;top:0;left:0;right:0;height:46px;background:var(--panel);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;padding:0 14px;gap:10px}
.tb-logo{font-weight:900;font-size:12px;letter-spacing:2.5px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.tb-logo i{font-style:normal;color:var(--purple)}
.tb-center{display:flex;gap:6px;flex:1;justify-content:center}
.st-card{display:flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:6px}
.st-v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;line-height:1}
.st-l{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;line-height:1;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.vt{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.vt button{padding:4px 9px;font-size:9px;font-weight:700;letter-spacing:1px;background:transparent;color:var(--text3);border:none;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.vt button.on{background:var(--purple);color:#fff}
.live-i{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--teal);font-weight:700;letter-spacing:.5px}
.live-i::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pls 2s infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.3}}
.tb-btn{padding:4px 10px;font-size:9px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px}
.tb-btn:hover{border-color:var(--purple);color:var(--text);background:rgba(124,111,205,.08)}
.tb-btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.tb-btn.pri:hover{background:#6b5ebc}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:46px;right:0;width:260px;bottom:30px;background:var(--panel);border-left:1px solid var(--border);z-index:90;display:flex;flex-direction:column}
.sb-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-tab{flex:1;padding:8px 0;text-align:center;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.sb-tab.on{color:var(--purple);border-bottom-color:var(--purple)}
.sb-body{flex:1;overflow-y:auto;padding:8px}

/* Agent cards */
.ag-card{padding:10px;margin-bottom:5px;background:rgba(255,255,255,.018);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .25s}
.ag-card:hover{background:rgba(255,255,255,.035)}
.ag-card.alive{border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
.ag-hdr{display:flex;align-items:center;gap:7px}
.ag-ico{font-size:17px;line-height:1}
.ag-inf{flex:1;min-width:0}
.ag-nm{font-size:11px;font-weight:700;line-height:1.2}
.ag-prov{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-badge{font-size:7px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;text-transform:uppercase;flex-shrink:0}
.ag-badge.live{background:rgba(34,197,94,.12);color:var(--teal)}
.ag-badge.limited{background:rgba(245,158,11,.12);color:var(--amber)}
.ag-badge.offline{background:rgba(85,85,112,.12);color:var(--text3)}
.ag-badge.error{background:rgba(239,68,68,.12);color:var(--red)}
.ag-exp{max-height:0;overflow:hidden;transition:max-height .3s ease}
.ag-card.open .ag-exp{max-height:140px}
.ag-exp-in{padding-top:8px;margin-top:8px;border-top:1px solid var(--border);font-size:10px;color:var(--text2)}
.ag-row{display:flex;justify-content:space-between;margin-bottom:2px}
.ag-row span:first-child{color:var(--text3)}

/* Activity feed */
.act-it{display:flex;gap:7px;padding:7px 3px;border-bottom:1px solid rgba(30,30,46,.4);align-items:flex-start}
.act-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.act-msg{font-size:10px;line-height:1.45;flex:1}
.act-msg b{font-weight:600}
.act-t{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px}

/* Insight cards */
.ins-card{padding:10px;margin-bottom:5px;background:rgba(255,255,255,.018);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.ins-card:hover{background:rgba(255,255,255,.035)}
.ins-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.nov-b{font-size:7px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.nov-hi{background:rgba(34,197,94,.12);color:var(--teal)}
.nov-mi{background:rgba(245,158,11,.12);color:var(--amber)}
.nov-lo{background:rgba(85,85,112,.12);color:var(--text3)}
.ins-dt{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.ins-tx{font-size:10px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── CANVAS AREA ── */
#canvasWrap{position:fixed;top:46px;left:0;right:260px;bottom:30px;background:var(--bg);overflow:hidden}
#mainCanvas{display:block;width:100%;height:100%}
#graphView{position:absolute;inset:0;display:none}
#graphView svg{width:100%;height:100%}
#graphSearch{position:absolute;top:12px;left:12px;padding:6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;font-family:'Inter',sans-serif;outline:none;width:200px;transition:border-color .2s}
#graphSearch:focus{border-color:var(--purple)}

/* ── BOTTOM BAR ── */
#bottomBar{position:fixed;bottom:0;left:0;right:0;height:30px;background:var(--panel);border-top:1px solid var(--border);z-index:100;display:flex;align-items:center;padding:0 12px;gap:5px}
.fl-lbl{font-size:8px;color:var(--text3);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-right:3px}
.fl-btn{padding:2px 8px;font-size:8px;font-weight:600;letter-spacing:.4px;background:transparent;color:var(--text3);border:1px solid transparent;border-radius:4px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.fl-btn:hover{color:var(--text)}
.fl-btn.on{background:rgba(124,111,205,.12);color:var(--purple);border-color:rgba(124,111,205,.25)}
.bbl-ct{margin-left:auto;font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* ── POPUP ── */
#popup{position:fixed;z-index:200;width:400px;max-height:500px;background:var(--panel);border:1px solid var(--border2);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 40px rgba(124,111,205,.06);display:none;opacity:0;transform:scale(.9) translateY(8px);transition:opacity .22s,transform .22s;overflow:hidden;flex-direction:column}
#popup.vis{display:flex;opacity:1;transform:scale(1) translateY(0)}
#popup.cls{opacity:0;transform:scale(.92) translateY(4px)}
.pp-hdr{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.pp-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.pp-x{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;flex-shrink:0}
.pp-x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.pp-title{padding:0 16px 6px;font-size:15px;font-weight:700;line-height:1.35}
.pp-meta{padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.pp-dt{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.pp-sc{font-size:8px;font-weight:800;padding:2px 8px;border-radius:4px}
.pp-body{padding:0 16px 14px;flex:1;overflow-y:auto;font-size:11px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.pp-tags{padding:8px 16px 14px;display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0;border-top:1px solid var(--border)}
.pp-tag{font-size:8px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.04);color:var(--text2)}

/* ── MODAL ── */
#modalOv{position:fixed;inset:0;z-index:300;background:rgba(15,15,23,.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
#modalOv.vis{display:flex;opacity:1}
#addModal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;width:400px;max-width:92vw;transform:translateY(16px);transition:transform .3s}
#modalOv.vis #addModal{transform:translateY(0)}
.md-title{font-size:15px;font-weight:700;margin-bottom:16px}
.md-f{margin-bottom:12px}
.md-f label{display:block;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.md-f input,.md-f select{width:100%;padding:8px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.md-f input:focus,.md-f select:focus{border-color:var(--purple)}
.md-f select option{background:var(--panel)}
.sw-row{display:flex;gap:7px}
.sw{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.sw.sel{border-color:#fff;transform:scale(1.18)}
.md-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.md-acts button{padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid var(--border);font-family:'Inter',sans-serif}
.md-cancel{background:transparent;color:var(--text2)}
.md-cancel:hover{color:var(--text)}
.md-save{background:var(--purple);color:#fff;border-color:var(--purple)}
.md-save:hover{background:#6b5ebc}

.empty-state{text-align:center;color:var(--text3);padding:30px 16px;font-size:10px;line-height:1.6}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadScreen">
  <div class="ld-logo">// <i>AGENT RESEARCH HUB</i></div>
  <div class="ld-bar-o"><div class="ld-bar" id="ldBar"></div></div>
  <div class="ld-txt" id="ldTxt">INITIALIZING</div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="tb-logo">// <i>AGENT RESEARCH HUB</i></div>
  <div class="tb-center">
    <div class="st-card"><div><div class="st-v" id="sResults" style="color:var(--purple)">—</div><div class="st-l">Results</div></div></div>
    <div class="st-card"><div><div class="st-v" id="sActive" style="color:var(--teal)">—</div><div class="st-l">Active</div></div></div>
    <div class="st-card"><div><div class="st-v" id="sTopics" style="color:var(--amber)">—</div><div class="st-l">Topics</div></div></div>
    <div class="st-card"><div><div class="st-v mono" id="sClock" style="color:var(--blue)">00:00:00</div><div class="st-l">Uptime</div></div></div>
  </div>
  <div class="tb-right">
    <div class="vt">
      <button class="on" data-v="robots" onclick="setView('robots')">ROBOTS</button>
      <button data-v="graph" onclick="setView('graph')">GRAPH</button>
    </div>
    <div class="live-i">LIVE</div>
    <button class="tb-btn" onclick="window.open('/api/export','_blank')">↓ EXPORT</button>
    <button class="tb-btn pri" onclick="openModal()">+ ADD AGENT</button>
  </div>
</div>

<!-- CANVAS -->
<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
  <div id="graphView">
    <input id="graphSearch" type="text" placeholder="Search topics..." oninput="rebuildGraph()">
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sb-tabs">
    <div class="sb-tab on" data-t="agents" onclick="setTab('agents')">Agents</div>
    <div class="sb-tab" data-t="activity" onclick="setTab('activity')">Activity</div>
    <div class="sb-tab" data-t="insights" onclick="setTab('insights')">Insights</div>
  </div>
  <div class="sb-body" id="sbBody"></div>
</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <span class="fl-lbl">Filter</span>
  <button class="fl-btn on" data-f="all" onclick="setFilter('all')">All</button>
  <span class="bbl-ct" id="bblCt">0 bubbles</span>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="pp-hdr">
    <div class="pp-badge" id="ppBadge"></div>
    <button class="pp-x" id="ppX" onclick="closePopup()">✕</button>
  </div>
  <div class="pp-title" id="ppTitle"></div>
  <div class="pp-meta">
    <span class="pp-dt" id="ppDt"></span>
    <span class="pp-sc" id="ppSc"></span>
  </div>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-tags" id="ppTags"></div>
</div>

<!-- ADD AGENT MODAL -->
<div id="modalOv" onclick="closeModalOv(event)">
  <div id="addModal" onclick="event.stopPropagation()">
    <div class="md-title">+ Add New Agent</div>
    <div class="md-f"><label>Agent Name</label><input id="naName" placeholder="e.g. web_crawler"></div>
    <div class="md-f"><label>Research Focus</label><input id="naFocus" placeholder="e.g. Competitive Analysis"></div>
    <div class="md-f"><label>Provider</label>
      <select id="naProv"><option>Google Gemini</option><option>Groq Llama</option><option>OpenRouter DeepSeek</option><option>Cerebras</option><option>Custom</option></select>
    </div>
    <div class="md-f"><label>API Key</label><input type="password" id="naKey" placeholder="sk-..."></div>
    <div class="md-f"><label>Color</label><div class="sw-row" id="swRow"></div></div>
    <div class="md-acts">
      <button class="md-cancel" onclick="closeModal()">Cancel</button>
      <button class="md-save" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  AGENT DEFINITIONS  — matched exactly to the repo
// ═══════════════════════════════════════════════════════════
const AGENTS = {
  market_scout:  { name:'Scout',   icon:'🔍', color:'#3b82f6', model:'Gemini 2.0 Flash',       provider:'Google',     fallback:['Groq Llama 3.3','Cerebras Llama'] },
  trend_analyst: { name:'Analyst', icon:'📈', color:'#22c55e', model:'Groq Llama 3.3 70B',     provider:'Groq',       fallback:['Cerebras Llama','Gemini Flash'] },
  deep_diver:    { name:'Diver',   icon:'🧠', color:'#7c6fcd', model:'Nvidia Nemotron 120B',   provider:'OpenRouter', fallback:['Groq QwQ-32B','Cerebras','Gemini'] },
  critic:        { name:'Critic',  icon:'⚡', color:'#ef4444', model:'DeepSeek R1 (reasoning)', provider:'OpenRouter', fallback:['Qwen3-235B','Llama 3.3','Groq','Cerebras'] },
  memory:        { name:'Memory',  icon:'💾', color:'#f59e0b', model:'Gemini 2.0 Flash',       provider:'Google',     fallback:[] },
  synthesis:     { name:'Synth',   icon:'✨', color:'#ec4899', model:'Groq Llama 3.3 70B',     provider:'Groq',       fallback:[] },
};
// Manager orchestrates: Scout/Analyst/Diver → Critic scores → Memory synthesizes → Synth weekly
const PIPELINE = [
  ['market_scout','critic'],['trend_analyst','critic'],['deep_diver','critic'],
  ['critic','memory'],['memory','market_scout'],['memory','trend_analyst'],['memory','deep_diver'],
  ['critic','synthesis']
];
const SW_COLORS = ['#3b82f6','#22c55e','#7c6fcd','#ef4444','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#f97316','#14b8a6'];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const S = {
  stats:null, results:[], insights:[], view:'robots', filter:'all', tab:'agents',
  swColor:SW_COLORS[0], t0:Date.now(), customAgents:[]
};
let bubbles=[], robots={}, particles=[], packets=[];
let canvas,ctx,W,H;
let feed=[];
let prevResultCount=0;

// ═══════════════════════════════════════════════════════════
//  LOADING
// ═══════════════════════════════════════════════════════════
(function(){
  const bar=document.getElementById('ldBar'), txt=document.getElementById('ldTxt');
  const steps=[{p:20,t:'INITIALIZING',d:0},{p:45,t:'CONNECTING TO DATABASE',d:500},{p:75,t:'LOADING AGENT DATA',d:1100},{p:100,t:'ONLINE',d:1700}];
  steps.forEach(s=>setTimeout(()=>{bar.style.width=s.p+'%';txt.textContent=s.t},s.d));
  setTimeout(()=>{document.getElementById('loadScreen').classList.add('out');init()},2500);
})();

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
function init(){
  setupCanvas();
  buildFilterBtns();
  buildSwatches();
  initRobots();
  fetchAll();
  setInterval(fetchStats,5000);
  setInterval(fetchResults,10000);
  setInterval(fetchInsights,15000);
  setInterval(tickClock,1000);
  requestAnimationFrame(loop);
  renderSidebar();
  window.addEventListener('resize',()=>{resizeCanvas();if(S.view==='graph')rebuildGraph()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup();closeModal()}});
}

// ═══════════════════════════════════════════════════════════
//  API  — matches dashboard.py endpoints exactly
// ═══════════════════════════════════════════════════════════
async function fetchStats(){
  try{
    const r=await fetch('/api/stats');if(!r.ok)throw 0;
    S.stats=await r.json();
    updateTopbar();renderSidebar();
  }catch(e){}
}
async function fetchResults(){
  try{
    const r=await fetch('/api/results');if(!r.ok)throw 0;
    const d=await r.json();
    if(d.length!==prevResultCount){
      const prev=new Set(S.results.map(x=>x.id));
      d.filter(x=>!prev.has(x.id)).forEach(n=>{
        addFeed(n.agent,`researched: ${trunc(n.topic,40)}`,n.created_at);
      });
      S.results=d;
      prevResultCount=d.length;
      seedBubbles();
      if(S.view==='graph')rebuildGraph();
    }
  }catch(e){}
}
async function fetchInsights(){
  try{
    const r=await fetch('/api/insights');if(!r.ok)throw 0;
    S.insights=await r.json();
    if(S.tab==='insights')renderSidebar();
  }catch(e){}
}
function fetchAll(){fetchStats();fetchResults();fetchInsights()}

// ═══════════════════════════════════════════════════════════
//  TOPBAR
// ═══════════════════════════════════════════════════════════
function updateTopbar(){
  if(!S.stats)return;
  document.getElementById('sResults').textContent=S.stats.total_results||0;
  document.getElementById('sActive').textContent=S.stats.active_agents||0;
  document.getElementById('sTopics').textContent=new Set(S.results.map(r=>r.topic)).size;
}
function tickClock(){
  const d=Math.floor((Date.now()-S.t0)/1000);
  const h=String(Math.floor(d/3600)).padStart(2,'0');
  const m=String(Math.floor((d%3600)/60)).padStart(2,'0');
  const s=String(d%60).padStart(2,'0');
  document.getElementById('sClock').textContent=`${h}:${m}:${s}`;
}

function renderSidebar(){

function renderAgents(){
  let h='';
  const all={...AGENTS};
  S.customAgents.forEach(a=>{all[a.key]=a});
  for(const[key,ag]of Object.entries(all)){
    const st=S.stats?.agents?.[key];
    const status=st?.status||'offline';
    const cls=status==='active'?'live':(status==='rate_limited'?'limited':(status==='error'?'error':'offline'));
    const label=status==='active'?'LIVE':(status==='rate_limited'?'LIMITED':(status==='error'?'ERROR':'OFFLINE'));
    const tasks=st?.tasks_completed||0;
    const lastRun=st?.last_run?fmtTime(st.last_run):'never';
    const isAlive=status==='active';
    const rlu=st?.rate_limit_until;
    let rlInfo='';
    if(rlu){try{const d=new Date(rlu);const now=new Date();const mins=Math.max(0,Math.round((d-now)/60000));rlInfo=mins>0?`Resets in ${mins}m`:'Resetting...';}catch(e){}}
    h+=`<div class="ag-card ${isAlive?'alive':''}" style="--ac:${ag.color}" onclick="this.classList.toggle('open')">
      <div class="ag-hdr">
        <span class="ag-ico">${ag.icon}</span>
        <div class="ag-inf">
          <div class="ag-nm" style="color:${ag.color}">${ag.name}</div>
          <div class="ag-prov">${ag.model} / ${ag.provider}</div>
        </div>
        <span class="ag-badge ${cls}">${label}</span>
      </div>
      <div class="ag-exp"><div class="ag-exp-in">
        <div class="ag-row"><span>Tasks</span><span class="mono">${tasks}</span></div>
        <div class="ag-row"><span>Last run</span><span>${lastRun}</span></div>
        <div class="ag-row"><span>Key</span><span class="mono" style="font-size:8px">${key}</span></div>
        <div class="ag-row"><span>Fallback</span><span style="font-size:9px">${(ag.fallback||[]).join(' → ')||'none'}</span></div>
        ${rlInfo?`<div class="ag-row"><span>Rate limit</span><span style="color:var(--amber)">${rlInfo}</span></div>`:''}
      </div></div>
    </div>`;
  }
  return h;
}
function renderActivity(){
  if(!feed.length)return'<div class="empty-state">Waiting for agent activity...<br>Results will appear as agents complete research cycles.</div>';
  return feed.slice(-60).reverse().map(a=>{
    const ag=AGENTS[a.agent]||{color:'#888',name:a.agent};
    return`<div class="act-it"><div class="act-dot" style="background:${ag.color}"></div><div><div class="act-msg"><b style="color:${ag.color}">${ag.name}</b> ${esc(a.msg)}</div><div class="act-t">${fmtTime(a.time)}</div></div></div>`;
  }).join('');
}
function renderInsights(){
  if(!S.insights.length)return'<div class="empty-state">No insights yet.<br>Memory agent generates insights after analyzing research patterns.</div>';
  return S.insights.map((ins,i)=>{
    const ns=ins.novelty_score||0;
    const lvl=ns>=7?'hi':(ns>=4?'mi':'lo');
    const txt=ns>=7?'HIGH':(ns>=4?'MID':'LOW');
    return`<div class="ins-card" onclick="openInsight(${i})">
      <div class="ins-hd"><span class="nov-b nov-${lvl}">${txt} ${ns}/10</span><span class="ins-dt">${fmtTime(ins.created_at)}</span></div>
      <div class="ins-tx">${esc(ins.content||'')}</div>
    </div>`;
  }).join('');
}
function addFeed(agent,msg,time){
  feed.push({agent,msg,time:time||new Date().toISOString()});
  if(feed.length>120)feed.shift();
  if(S.tab==='activity')renderSidebar();
}
function openInsight(i){
  const ins=S.insights[i];if(!ins)return;
  showPopup({agent:'memory',topic:'Research Insight',content:ins.content,score:ins.novelty_score,created_at:ins.created_at,source_topics:ins.source_topics},window.innerWidth/2-200,window.innerHeight/2-220);
}

//  ROBOTS
// ═══════════════════════════════════════════════════════════
function initRobots(){
  const keys=Object.keys(AGENTS);
  // Organic placement around the canvas — pipeline-aware positioning
  const pos=[
    {xr:.14,yr:.38},{xr:.36,yr:.58},{xr:.58,yr:.30},  // Scout, Analyst, Diver
    {xr:.78,yr:.55},{xr:.50,yr:.72},{xr:.85,yr:.30}   // Critic, Memory, Synth
  ];
  keys.forEach((k,i)=>{
    const p=pos[i]||{xr:.15+Math.random()*.7,yr:.25+Math.random()*.5};
    robots[k]={key:k,def:AGENTS[k],xr:p.xr,yr:p.yr,x:0,y:0,ph:Math.random()*Math.PI*2,arm:Math.random()*Math.PI*2};
  });
  reposRobots();
}
function reposRobots(){Object.values(robots).forEach(r=>{r.x=r.xr*W;r.y=r.yr*H})}

// ═══════════════════════════════════════════════════════════
//  BUBBLES
// ═══════════════════════════════════════════════════════════
function seedBubbles(){
  bubbles=[];
  const grp={};
  S.results.forEach(r=>{if(!grp[r.agent])grp[r.agent]=[];grp[r.agent].push(r)});
  Object.entries(grp).forEach(([agent,res])=>{
    const cap=res.slice(0,22);
    const rob=robots[agent];
    cap.forEach(r=>{
      const a=Math.random()*Math.PI*2, d=55+Math.random()*110;
      const bx=rob?(rob.x+Math.cos(a)*d):(Math.random()*W);
      const by=rob?(rob.y+Math.sin(a)*d):(Math.random()*H);
      bubbles.push({
        result:r,agent:r.agent,
        x:clamp(bx,25,W-25),y:clamp(by,25,H-25),
        vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
        radius:Math.max(7,Math.min(20,(r.score||3)*2)),
        color:AGENTS[agent]?.color||'#888'
      });
    });
  });
  updBblCt();
}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}

// ═══════════════════════════════════════════════════════════
//  PARTICLES / PACKETS
// ═══════════════════════════════════════════════════════════
function maybeSpawnParticle(){
  if(Math.random()>.025)return;
  const active=PIPELINE.filter(([a])=>S.stats?.agents?.[a]?.status==='active');
  if(!active.length)return;
  const[a,b]=active[Math.floor(Math.random()*active.length)];
  const rA=robots[a],rB=robots[b];if(!rA||!rB)return;
  particles.push({ox:rA.x,oy:rA.y,tx:rB.x,ty:rB.y,t:0,sp:.006+Math.random()*.008,col:rA.def.color});
}
function maybeSpawnPacket(){
  if(Math.random()>.006)return;
  const active=PIPELINE.filter(([a])=>S.stats?.agents?.[a]?.status==='active');
  if(!active.length)return;
  const[a,b]=active[Math.floor(Math.random()*active.length)];
  const rA=robots[a],rB=robots[b];if(!rA||!rB)return;
  packets.push({ox:rA.x,oy:rA.y,tx:rB.x,ty:rB.y,t:0,sp:.01+Math.random()*.008,col:rA.def.color,trail:[]});
}

// ═══════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════
let lt=0;
function loop(ts){
  const dt=Math.min((ts-lt)/16.67,3);lt=ts;
  if(S.view==='robots')drawRobots(dt,ts);
  requestAnimationFrame(loop);
}

function drawRobots(dt,ts){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  drawPipes(ts);
  drawParticles(dt);
  drawPackets(dt);
  const vis=S.filter==='all'?bubbles:bubbles.filter(b=>b.agent===S.filter);
  drawConnections(vis);
  drawBubbles(vis,dt);
  drawAllRobots(ts);
}

function drawGrid(){
  ctx.fillStyle='rgba(30,30,46,.5)';
  for(let x=25;x<W;x+=28)for(let y=25;y<H;y+=28)ctx.fillRect(x,y,1,1);
}

function drawPipes(){
  PIPELINE.forEach(([a,b])=>{
    const rA=robots[a],rB=robots[b];if(!rA||!rB)return;
    const on=S.stats?.agents?.[a]?.status==='active';
    ctx.beginPath();ctx.moveTo(rA.x,rA.y);ctx.lineTo(rB.x,rB.y);
    ctx.strokeStyle=on?'rgba(124,111,205,.12)':'rgba(30,30,46,.4)';
    ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);
  });
}

function drawParticles(dt){
  maybeSpawnParticle();
  particles=particles.filter(p=>{
    p.t+=p.sp*dt;if(p.t>=1)return false;
    const x=lerp(p.ox,p.tx,p.t),y=lerp(p.oy,p.ty,p.t);
    ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.globalAlpha=.55*(1-p.t);ctx.fill();ctx.globalAlpha=1;
    return true;
  });
}

function drawPackets(dt){
  maybeSpawnPacket();
  packets=packets.filter(p=>{
    p.t+=p.sp*dt;if(p.t>=1)return false;
    const x=lerp(p.ox,p.tx,p.t),y=lerp(p.oy,p.ty,p.t);
    p.trail.push({x,y,a:1});if(p.trail.length>10)p.trail.shift();
    p.trail.forEach(tr=>{
      tr.a*=.85;
      ctx.fillStyle=p.col;ctx.globalAlpha=tr.a*.4;
      ctx.fillRect(tr.x-2.5,tr.y-1,5,2);
    });
    ctx.globalAlpha=.85;ctx.fillStyle=p.col;
    ctx.fillRect(x-3.5,y-1.5,7,3);
    ctx.globalAlpha=1;
    return true;
  });
}

function drawConnections(vis){
  // Same-agent: faint dashed
  const byAg={};vis.forEach(b=>{if(!byAg[b.agent])byAg[b.agent]=[];byAg[b.agent].push(b)});
  ctx.lineWidth=.5;ctx.setLineDash([2,4]);
  Object.values(byAg).forEach(g=>{
    for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){
      if(dst(g[i],g[j])<110){
        ctx.beginPath();ctx.moveTo(g[i].x,g[i].y);ctx.lineTo(g[j].x,g[j].y);
        ctx.strokeStyle='rgba(124,111,205,.05)';ctx.stroke();
      }
    }
  });
  ctx.setLineDash([]);
  // Cross-agent same topic: brighter with midpoint
  const byTp={};vis.forEach(b=>{const t=b.result.topic;if(!byTp[t])byTp[t]=[];byTp[t].push(b)});
  Object.values(byTp).forEach(g=>{
    if(g.length<2)return;
    for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){
      if(g[i].agent===g[j].agent)continue;
      const mx=(g[i].x+g[j].x)/2,my=(g[i].y+g[j].y)/2;
      ctx.beginPath();ctx.moveTo(g[i].x,g[i].y);ctx.lineTo(g[j].x,g[j].y);
      ctx.strokeStyle='rgba(124,111,205,.1)';ctx.lineWidth=.7;ctx.stroke();
      ctx.beginPath();ctx.arc(mx,my,2,0,Math.PI*2);
      ctx.fillStyle='rgba(124,111,205,.25)';ctx.fill();
    }
  });
}

function drawBubbles(vis,dt){
  vis.forEach(b=>{
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-b.radius<0){b.x=b.radius;b.vx=Math.abs(b.vx)}
    if(b.x+b.radius>W){b.x=W-b.radius;b.vx=-Math.abs(b.vx)}
    if(b.y-b.radius<0){b.y=b.radius;b.vy=Math.abs(b.vy)}
    if(b.y+b.radius>H){b.y=H-b.radius;b.vy=-Math.abs(b.vy)}
    // Outer glow
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.radius*2.8);
    g.addColorStop(0,rgba(b.color,.1));g.addColorStop(1,rgba(b.color,0));
    ctx.beginPath();ctx.arc(b.x,b.y,b.radius*2.8,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    // Body
    ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fillStyle=rgba(b.color,.2);ctx.strokeStyle=rgba(b.color,.55);ctx.lineWidth=1;ctx.fill();ctx.stroke();
    // Core
    ctx.beginPath();ctx.arc(b.x,b.y,1.8,0,Math.PI*2);ctx.fillStyle=rgba(b.color,.7);ctx.fill();
  });
}

function drawAllRobots(ts){
  Object.values(robots).forEach(r=>{
    const status=S.stats?.agents?.[r.key]?.status;
    const on=status==='active';
    const op=on?1:.3;
    const bob=on?Math.sin(ts/600+r.ph)*3:0;
    const armS=on?Math.sin(ts/280+r.arm)*9:0;
    const legS=on?Math.sin(ts/220+r.arm)*7:0;
    const cx=r.x,cy=r.y+bob,c=r.def.color;
    ctx.save();ctx.globalAlpha=op;

    // Halo
    if(on){
      const h=ctx.createRadialGradient(cx,cy-8,0,cx,cy-8,48);
      h.addColorStop(0,rgba(c,.07));h.addColorStop(1,rgba(c,0));
      ctx.beginPath();ctx.arc(cx,cy-8,48,0,Math.PI*2);ctx.fillStyle=h;ctx.fill();
    }
    // Platform
    ctx.fillStyle=rgba(c,.12);ctx.beginPath();ctx.ellipse(cx,cy+27,22,5,0,0,Math.PI*2);ctx.fill();
    // Legs
    ctx.strokeStyle=c;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-5,cy+14);ctx.lineTo(cx-5-legS*.25,cy+25);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+5,cy+14);ctx.lineTo(cx+5+legS*.25,cy+25);ctx.stroke();
    // Body
    ctx.fillStyle=rgba(c,.25);ctx.strokeStyle=c;ctx.lineWidth=1.5;
    rrect(cx-12,cy-4,24,20,4);ctx.fill();ctx.stroke();
    // Chest indicator
    if(on){
      ctx.fillStyle=rgba(c,.5+.3*Math.sin(ts/400));
      ctx.fillRect(cx-2,cy+3,4,3);
    }
    // Arms
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-12,cy+2);ctx.lineTo(cx-19,cy+2+armS*.4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+12,cy+2);ctx.lineTo(cx+19,cy+2-armS*.4);ctx.stroke();
    // Head
    ctx.fillStyle=rgba(c,.35);ctx.strokeStyle=c;ctx.lineWidth=1.5;
    rrect(cx-10,cy-20,20,17,4);ctx.fill();ctx.stroke();
    // Eyes
    const eg=on?.9:.25;
    ctx.shadowColor=c;ctx.shadowBlur=on?8:0;
    ctx.fillStyle=rgba('#ffffff',eg);
    ctx.beginPath();ctx.arc(cx-4,cy-12,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+4,cy-12,2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Antenna
    ctx.strokeStyle=c;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(cx,cy-29);ctx.stroke();
    const ap=on?.4+.6*Math.sin(ts/180+r.ph):.2;
    ctx.beginPath();ctx.arc(cx,cy-29,3,0,Math.PI*2);ctx.fillStyle=rgba(c,ap);ctx.fill();
    if(on){ctx.shadowColor=c;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(cx,cy-29,1.5,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.shadowBlur=0}
    // Label
    ctx.globalAlpha=op*.85;ctx.fillStyle=c;ctx.font='700 9px "JetBrains Mono"';ctx.textAlign='center';
    ctx.fillText(r.def.name.toUpperCase(),cx,cy+40);
    // Status indicator below name
    if(status==='rate_limited'){
      ctx.fillStyle=rgba('#f59e0b',.7);ctx.font='600 7px "JetBrains Mono"';
      ctx.fillText('RATE LIMITED',cx,cy+50);
    }
    ctx.restore();
  });
}

function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// Canvas click handler
document.getElementById('mainCanvas').addEventListener('click',e=>{

// ═══════════════════════════════════════════════════════════
//  D3 GRAPH VIEW
// ═══════════════════════════════════════════════════════════
function rebuildGraph(){
  const ctr=document.getElementById('graphView');
  ctr.querySelectorAll('svg').forEach(s=>s.remove());
  const w=ctr.clientWidth,h=ctr.clientHeight;
  const svg=d3.select(ctr).append('svg').attr('width',w).attr('height',h);

  // Grid background
  const defs=svg.append('defs');
  const pat=defs.append('pattern').attr('id','gd').attr('width',28).attr('height',28).attr('patternUnits','userSpaceOnUse');
  pat.append('circle').attr('cx',14).attr('cy',14).attr('r',.5).attr('fill','rgba(30,30,46,.6)');
  svg.append('rect').attr('width',w).attr('height',h).attr('fill','url(#gd)');

  let filtered=S.filter==='all'?S.results:S.results.filter(r=>r.agent===S.filter);
  const q=(document.getElementById('graphSearch').value||'').toLowerCase();
  if(q)filtered=filtered.filter(r=>(r.topic||'').toLowerCase().includes(q));

  if(!filtered.length){
    svg.append('text').attr('x',w/2).attr('y',h/2).attr('text-anchor','middle').attr('fill','#555570').attr('font-size','11px').attr('font-family','Inter').text('No results to display');
    return;
  }

  const topics=[...new Set(filtered.map(r=>r.topic))];
  const nodes=[],links=[];
  topics.forEach(t=>nodes.push({id:'t_'+t,type:'topic',label:t,r:16}));
  filtered.forEach(r=>{
    const ag=AGENTS[r.agent]||{color:'#888'};
    nodes.push({id:'r_'+r.id,type:'result',data:r,agent:r.agent,color:ag.color,r:Math.max(4,Math.min(13,(r.score||3)*1.3)),label:r.topic});
    links.push({source:'r_'+r.id,target:'t_'+r.topic,type:'topic'});
  });
  // Agent cluster links
  const byAg={};filtered.forEach(r=>{if(!byAg[r.agent])byAg[r.agent]=[];byAg[r.agent].push(r)});
  Object.values(byAg).forEach(g=>{for(let i=0;i<g.length-1;i++)links.push({source:'r_'+g[i].id,target:'r_'+g[i+1].id,type:'agent'})});

  const g=svg.append('g');
  svg.call(d3.zoom().scaleExtent([.25,5]).on('zoom',e=>g.attr('transform',e.transform)));

  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(55))
    .force('charge',d3.forceManyBody().strength(-70))
    .force('center',d3.forceCenter(w/2,h/2))
    .force('collision',d3.forceCollide(d=>d.r+3));

  const link=g.selectAll('.lk').data(links).enter().append('line')
    .attr('stroke',d=>d.type==='topic'?'rgba(124,111,205,.18)':'rgba(124,111,205,.06)')
    .attr('stroke-width',d=>d.type==='topic'?.8:.4)
    .attr('stroke-dasharray',d=>d.type==='agent'?'2,4':'none');

  const node=g.selectAll('.nd').data(nodes).enter().append('g').attr('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  // Glow for result nodes
  node.filter(d=>d.type==='result').append('circle').attr('r',d=>d.r*2)
    .attr('fill',d=>rgba(d.color,.06)).attr('stroke','none');

  node.append('circle').attr('r',d=>d.r)
    .attr('fill',d=>d.type==='topic'?'rgba(255,255,255,.06)':rgba(d.color,.25))
    .attr('stroke',d=>d.type==='topic'?'rgba(255,255,255,.15)':rgba(d.color,.6))
    .attr('stroke-width',d=>d.type==='topic'?1.2:.8);

  node.filter(d=>d.type==='topic').append('text')
    .text(d=>(d.label||'').substring(0,16)).attr('text-anchor','middle').attr('dy',d=>d.r+11)
    .attr('fill','#8888a8').attr('font-size','7px').attr('font-family','Inter');

  node.on('click',(e,d)=>{if(d.type==='result'&&d.data)showPopup(d.data,e.clientX,e.clientY)});

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

// ═══════════════════════════════════════════════════════════
//  POPUP
// ═══════════════════════════════════════════════════════════
function showPopup(result,mx,my){
  const pp=document.getElementById('popup');
  const ag=AGENTS[result.agent]||{icon:'❓',name:result.agent||'Unknown',color:'#888'};

  document.getElementById('ppBadge').innerHTML=`${ag.icon} ${ag.name}`;
  document.getElementById('ppBadge').style.cssText=`background:${rgba(ag.color,.12)};color:${ag.color}`;
  document.getElementById('ppTitle').textContent=result.topic||'Research Result';
  document.getElementById('ppDt').textContent=fmtTime(result.created_at);

  const sc=result.score||0;
  const scEl=document.getElementById('ppSc');
  scEl.textContent=`Score: ${sc}/10`;
  scEl.style.cssText=sc>=7?'background:rgba(34,197,94,.12);color:#22c55e':(sc>=4?'background:rgba(245,158,11,.12);color:#f59e0b':'background:rgba(85,85,112,.12);color:#555570');

  document.getElementById('ppBody').textContent=result.content||'No content available.';

  // Tags from source_topics or generate from topic
  const tags=result.source_topics?tryParse(result.source_topics):result.topic?[result.agent,result.topic.split(' ').slice(0,3).join(' ')]:[];
  document.getElementById('ppTags').innerHTML=tags.map(t=>`<span class="pp-tag">${esc(typeof t==='string'?t:JSON.stringify(t))}</span>`).join('');

  // Position
  let left=mx+14,top=my-60;
  if(left+420>window.innerWidth)left=mx-415;
  if(top+520>window.innerHeight)top=window.innerHeight-520;
  if(top<50)top=50;if(left<10)left=10;
  pp.style.left=left+'px';pp.style.top=top+'px';

  pp.classList.remove('cls');pp.style.display='flex';
  requestAnimationFrame(()=>pp.classList.add('vis'));
}
function closePopup(){
  const pp=document.getElementById('popup');
  pp.classList.add('cls');pp.classList.remove('vis');
  setTimeout(()=>{pp.style.display='none';pp.classList.remove('cls')},240);
}

// ═══════════════════════════════════════════════════════════
//  ADD AGENT MODAL
// ═══════════════════════════════════════════════════════════
function buildSwatches(){
  const row=document.getElementById('swRow');
  SW_COLORS.forEach(c=>{
    const d=document.createElement('div');
    d.className='sw'+(c===S.swColor?' sel':'');
    d.style.background=c;
    d.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');S.swColor=c};
    row.appendChild(d);
  });
}
function openModal(){
  const m=document.getElementById('modalOv');m.style.display='flex';
  requestAnimationFrame(()=>m.classList.add('vis'));
}
function closeModal(){
  const m=document.getElementById('modalOv');m.classList.remove('vis');
  setTimeout(()=>{m.style.display='none'},300);
}
function closeModalOv(e){if(e.target===document.getElementById('modalOv'))closeModal()}
function saveAgent(){
  const name=document.getElementById('naName').value.trim();
  if(!name)return;
  const key=name.toLowerCase().replace(/[^a-z0-9]/g,'_');
  const prov=document.getElementById('naProv').value;
  const def={name:name.charAt(0).toUpperCase()+name.slice(1),icon:'🤖',color:S.swColor,model:prov,provider:prov.split(' ')[0],fallback:[],key};
  S.customAgents.push({...def,key});
  AGENTS[key]=def;
  // Add robot
  const xr=.15+Math.random()*.7,yr=.25+Math.random()*.5;
  robots[key]={key,def,xr,yr,x:xr*W,y:yr*H,ph:Math.random()*Math.PI*2,arm:Math.random()*Math.PI*2};
  // Add filter
  const bar=document.getElementById('bottomBar');
  const b=document.createElement('button');b.className='fl-btn';b.dataset.f=key;b.textContent=def.name;
  b.onclick=()=>setFilter(key);bar.insertBefore(b,document.getElementById('bblCt'));
  addFeed(key,'agent added to pipeline');
  renderSidebar();closeModal();
  document.getElementById('naName').value='';document.getElementById('naFocus').value='';document.getElementById('naKey').value='';
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function lerp(a,b,t){return a+(b-a)*t}
function dst(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rgba(hex,a){
  if(hex.startsWith('rgba'))return hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}
function fmtTime(t){
  if(!t)return'--';
  try{const d=new Date(t);if(isNaN(d))return t;return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch(e){return t}
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function trunc(s,n){return s&&s.length>n?s.slice(0,n)+'...':s}
function tryParse(s){try{return typeof s==='string'?JSON.parse(s):Array.isArray(s)?s:[s]}catch(e){return[s]}}
</script>
