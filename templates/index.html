<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Research Hub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  background: #0a0a0f;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
 
/* ── HEADER ─────────────────────────────── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid #1a1a2e;
}
.logo { font-size: 13px; letter-spacing: 0.15em; color: #888; }
.logo span { color: #7f77dd; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: #1d9e75; letter-spacing: 0.08em;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #1d9e75;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
 
/* ── STATS BAR ───────────────────────────── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #1a1a2e;
  border-bottom: 1px solid #1a1a2e;
}
.stat-item {
  background: #0d0d1a;
  padding: 14px 20px;
  text-align: center;
}
.stat-num { font-size: 22px; font-weight: bold; }
.stat-num.purple { color: #7f77dd; }
.stat-num.teal { color: #1d9e75; }
.stat-num.amber { color: #ba7517; }
.stat-num.blue { color: #378add; }
.stat-lbl { font-size: 10px; color: #555; letter-spacing: 0.08em; margin-top: 2px; }
 
/* ── MAIN LAYOUT ─────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 1fr 320px;
  height: calc(100vh - 110px);
}
 
/* ── CANVAS ──────────────────────────────── */
.canvas-wrap {
  position: relative;
  overflow: hidden;
  background: #080810;
}
canvas { display: block; width: 100%; height: 100%; }
 
/* ── SIDEBAR ─────────────────────────────── */
.sidebar {
  background: #0d0d1a;
  border-left: 1px solid #1a1a2e;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section {
  padding: 14px 16px;
  border-bottom: 1px solid #1a1a2e;
}
.sidebar-title {
  font-size: 10px; color: #444; letter-spacing: 0.1em; margin-bottom: 10px;
}
.agent-list { display: flex; flex-direction: column; gap: 6px; }
.agent-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #1a1a2e;
  background: #0a0a14;
  cursor: pointer;
  transition: border-color 0.2s;
}
.agent-row:hover { border-color: #2a2a4e; }
.agent-row.active { border-color: #1d9e7540; background: #0d1a14; }
.agent-row.limited { border-color: #ba751740; }
.a-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.a-dot.active { background: #1d9e75; animation: blink 1.5s infinite; }
.a-dot.limited { background: #ba7517; }
.a-dot.unknown { background: #333; }
.a-info { flex: 1; min-width: 0; }
.a-name { font-size: 12px; color: #ccc; }
.a-model { font-size: 10px; color: #444; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-badge {
  font-size: 9px; padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
}
.a-badge.active { background: #0f3d2a; color: #1d9e75; }
.a-badge.limited { background: #3d2a0f; color: #ba7517; }
.a-badge.unknown { background: #1a1a2e; color: #555; }
 
.fallback-chain {
  font-size: 10px; color: #444; padding: 6px 10px 8px;
  display: none;
}
.fallback-chain.show { display: block; }
.fallback-chain span { color: #7f77dd; }
 
/* ── FEED ────────────────────────────────── */
.feed { flex: 1; overflow-y: auto; padding: 10px; }
.feed::-webkit-scrollbar { width: 3px; }
.feed::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
.feed-item {
  display: flex; gap: 8px; padding: 7px 8px; margin-bottom: 4px;
  border-radius: 5px; background: #0a0a14; border: 1px solid #12122a;
  font-size: 11px; line-height: 1.5;
}
.feed-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.feed-text { color: #888; }
.feed-text strong { color: #ccc; font-weight: normal; }
.feed-time { font-size: 10px; color: #333; margin-top: 2px; }
 
/* ── RESULTS PANEL ───────────────────────── */
.results-panel {
  background: #0d0d1a;
  border-top: 1px solid #1a1a2e;
  max-height: 280px;
  overflow-y: auto;
}
.results-panel::-webkit-scrollbar { width: 3px; }
.results-panel::-webkit-scrollbar-thumb { background: #222; }
.rp-header {
  position: sticky; top: 0;
  display: flex; gap: 8px; align-items: center;
  padding: 10px 16px; background: #0d0d1a;
  border-bottom: 1px solid #1a1a2e;
  z-index: 1;
}
.rp-title { font-size: 10px; color: #444; letter-spacing: 0.1em; }
.filter-btns { display: flex; gap: 4px; margin-left: auto; }
.fbtn {
  font-size: 9px; padding: 2px 8px; border-radius: 3px;
  border: 1px solid #1a1a2e; background: transparent;
  color: #555; cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.fbtn.on { background: #1a1a2e; color: #ccc; border-color: #2a2a4e; }
.result-item {
  padding: 10px 16px; border-bottom: 1px solid #0f0f1e;
  cursor: pointer; transition: background 0.15s;
}
.result-item:hover { background: #0f0f1e; }
.ri-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ri-agent { font-size: 9px; padding: 1px 6px; border-radius: 2px; }
.ri-agent.market_scout { background: #0d2040; color: #378add; }
.ri-agent.trend_analyst { background: #0d3020; color: #1d9e75; }
.ri-agent.deep_diver { background: #1a1040; color: #7f77dd; }
.ri-agent.critic { background: #301008; color: #d85a30; }
.ri-agent.memory { background: #2a1a00; color: #ba7517; }
.ri-agent.synthesis { background: #2a0818; color: #d4537e; }
.ri-topic { font-size: 11px; color: #aaa; }
.ri-score {
  margin-left: auto; font-size: 10px;
  padding: 1px 6px; border-radius: 3px;
}
.ri-score.high { background: #0f3d2a; color: #1d9e75; }
.ri-score.mid { background: #3d2a0f; color: #ba7517; }
.ri-score.low { background: #1a1a2e; color: #555; }
.ri-preview { font-size: 11px; color: #444; line-height: 1.5; }
 
/* ── EXPANDED RESULT ─────────────────────── */
.result-expanded {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: #080810ee; backdrop-filter: blur(4px);
  padding: 40px 20px; overflow-y: auto;
}
.result-expanded.show { display: flex; align-items: flex-start; justify-content: center; }
.result-modal {
  background: #0d0d1a; border: 1px solid #2a2a4e;
  border-radius: 10px; padding: 24px; max-width: 700px; width: 100%;
}
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.modal-close {
  background: none; border: 1px solid #1a1a2e; color: #666;
  padding: 4px 10px; border-radius: 4px; cursor: pointer;
  font-family: inherit; font-size: 12px;
}
.modal-close:hover { border-color: #2a2a4e; color: #ccc; }
.modal-content { font-size: 13px; color: #999; line-height: 1.8; white-space: pre-wrap; }
 
</style>
</head>
<body>
 
<div class="header">
  <div class="logo">// <span>AGENT</span> RESEARCH HUB <span style="font-size:10px;color:#333;margin-left:8px;">v6 · sequential pipeline</span></div>
  <div class="live-badge"><div class="live-dot"></div>LIVE <span id="tick" style="color:#1a3a2a;font-size:10px;margin-left:4px;"></span></div>
</div>
 
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num purple" id="s-total">—</div>
    <div class="stat-lbl">RESULTS SAVED</div>
  </div>
  <div class="stat-item">
    <div class="stat-num teal" id="s-active">—</div>
    <div class="stat-lbl">ACTIVE AGENTS</div>
  </div>
  <div class="stat-item">
    <div class="stat-num amber" id="s-topics">—</div>
    <div class="stat-lbl">TOPICS COVERED</div>
  </div>
  <div class="stat-item">
    <div class="stat-num blue" id="s-time">—</div>
    <div class="stat-lbl">LAST UPDATED</div>
  </div>
</div>
 
<div class="main">
  <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
    <div class="canvas-wrap" style="flex:1;">
      <canvas id="c"></canvas>
    </div>
    <div class="results-panel" id="results-panel">
      <div class="rp-header">
        <div class="rp-title">RESEARCH RESULTS</div>
        <div class="filter-btns" id="filter-btns">
          <button class="fbtn on" onclick="setFilter('all',this)">All</button>
          <button class="fbtn" onclick="setFilter('market_scout',this)">Scout</button>
          <button class="fbtn" onclick="setFilter('trend_analyst',this)">Analyst</button>
          <button class="fbtn" onclick="setFilter('deep_diver',this)">Diver</button>
          <button class="fbtn" onclick="setFilter('critic',this)">Critic</button>
        </div>
      </div>
      <div id="results-list"></div>
    </div>
  </div>
 
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">AGENTS</div>
      <div class="agent-list" id="agent-list"></div>
    </div>
    <div class="sidebar-title" style="padding:14px 16px 4px;font-size:10px;color:#444;letter-spacing:0.1em;">LIVE ACTIVITY</div>
    <div class="feed" id="feed"></div>
  </div>
</div>
 
<div class="result-expanded" id="expanded" onclick="closeExpanded(event)">
  <div class="result-modal" id="modal-inner">
    <div class="modal-header">
      <div>
        <div id="modal-agent" style="font-size:10px;margin-bottom:6px;"></div>
        <div id="modal-topic" style="font-size:14px;color:#ccc;"></div>
        <div id="modal-date" style="font-size:11px;color:#444;margin-top:4px;"></div>
      </div>
      <button class="modal-close" onclick="closeExpanded()">✕ close</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>
 
<script>
const AGENTS_DEF = [
  { key:'market_scout', name:'Market Scout', model:'gemini-2.0-flash · Gemini', color:'#378add', fallbacks:['Primary: Gemini','→ Fallback: Groq'] },
  { key:'trend_analyst', name:'Trend Analyst', model:'llama-3.3-70b · Groq', color:'#1d9e75', fallbacks:['Primary: Groq','→ Fallback: Gemini'] },
  { key:'deep_diver', name:'Deep Diver', model:'nemotron · OpenRouter', color:'#7f77dd', fallbacks:['Primary: Nemotron','→ Fallback 1: QwQ-32B','→ Fallback 2: Gemini'] },
  { key:'critic', name:'Critic', model:'llama-3.3-70b · Groq', color:'#d85a30', fallbacks:['Primary: Groq'] },
  { key:'memory', name:'Memory', model:'gemini-2.0-flash · Gemini', color:'#ba7517', fallbacks:['Primary: Gemini'] },
  { key:'synthesis', name:'Synthesis', model:'llama-3.3-70b · Groq · weekly', color:'#d4537e', fallbacks:['Runs every Sunday 09:00'] },
];
 
let agentStatuses = {};
let allResults = [];
let activeFilter = 'all';
let feedItems = [];
 
// ── SIDEBAR AGENTS ─────────────────────────
function renderAgents() {
  const el = document.getElementById('agent-list');
  el.innerHTML = AGENTS_DEF.map(a => {
    const st = agentStatuses[a.key];
    const status = st ? st.status : 'unknown';
    const cls = status === 'active' ? 'active' : status === 'rate_limited' ? 'limited' : 'unknown';
    const badge = status === 'active' ? 'ACTIVE' : status === 'rate_limited' ? 'LIMITED' : '—';
    return `
    <div class="agent-row ${cls}" onclick="toggleFallback('fb-${a.key}')">
      <div class="a-dot ${cls}"></div>
      <div class="a-info">
        <div class="a-name">${a.name}</div>
        <div class="a-model">${a.model}</div>
      </div>
      <div class="a-badge ${cls}">${badge}</div>
    </div>
    <div class="fallback-chain" id="fb-${a.key}">${a.fallbacks.map(f => `<span>${f}</span>`).join('<br>')}</div>`;
  }).join('');
}
 
function toggleFallback(id) {
  const el = document.getElementById(id);
  el.classList.toggle('show');
}
 
// ── RESULTS ───────────────────────────────
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderResults();
}
 
function renderResults() {
  const filtered = activeFilter === 'all' ? allResults : allResults.filter(r => r.agent === activeFilter);
  const el = document.getElementById('results-list');
  el.innerHTML = filtered.slice(0, 40).map((r, i) => {
    const score = r.score || 0;
    const sc = score >= 7 ? 'high' : score >= 4 ? 'mid' : 'low';
    const preview = (r.content || '').replace(/[#*\n]/g,' ').slice(0,120);
    return `<div class="result-item" onclick="openResult(${i})">
      <div class="ri-top">
        <span class="ri-agent ${r.agent}">${r.agent.replace('_',' ')}</span>
        <span class="ri-topic">${(r.topic||'').slice(0,55)}</span>
        ${score > 0 ? `<span class="ri-score ${sc}">${score}/10</span>` : ''}
      </div>
      <div class="ri-preview">${preview}…</div>
    </div>`;
  }).join('');
}
 
function openResult(idx) {
  const filtered = activeFilter === 'all' ? allResults : allResults.filter(r => r.agent === activeFilter);
  const r = filtered[idx];
  if (!r) return;
  document.getElementById('modal-agent').innerHTML = `<span class="ri-agent ${r.agent}" style="font-size:10px;">${r.agent}</span>`;
  document.getElementById('modal-topic').textContent = r.topic || '';
  document.getElementById('modal-date').textContent = r.created_at ? r.created_at.slice(0,16).replace('T',' ') : '';
  document.getElementById('modal-content').textContent = r.content || '';
  document.getElementById('expanded').classList.add('show');
}
 
function closeExpanded(e) {
  if (!e || e.target === document.getElementById('expanded')) {
    document.getElementById('expanded').classList.remove('show');
  }
}
 
// ── FEED ──────────────────────────────────
function addFeed(agent, msg, color) {
  const now = new Date().toTimeString().slice(0,5);
  feedItems.unshift({ agent, msg, color, time: now });
  if (feedItems.length > 30) feedItems.pop();
  const el = document.getElementById('feed');
  el.innerHTML = feedItems.map(f => `
    <div class="feed-item">
      <div class="feed-dot" style="background:${f.color}"></div>
      <div>
        <div class="feed-text"><strong>${f.agent}</strong> ${f.msg}</div>
        <div class="feed-time">${f.time}</div>
      </div>
    </div>`).join('');
}
 
// ── CANVAS ANIMATION ──────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
 
function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);
 
const NODE_COLORS = {
  market_scout: '#378add', trend_analyst: '#1d9e75',
  deep_diver: '#7f77dd', critic: '#d85a30',
  memory: '#ba7517', synthesis: '#d4537e', data: '#2a2a4e'
};
 
class Robot {
  constructor(name, x, y, color) {
    this.name = name; this.x = x; this.y = y; this.color = color;
    this.tx = x; this.ty = y;
    this.status = 'unknown';
    this.pulse = Math.random() * Math.PI * 2;
    this.carrying = false;
    this.carryProgress = 0;
    this.label = '';
    this.platform = { x, y: y + 28, w: 90, h: 10 };
  }
 
  setTarget(tx, ty) { this.tx = tx; this.ty = ty; }
 
  update() {
    this.pulse += 0.04;
    const dx = this.tx - this.x, dy = this.ty - this.y;
    const spd = 1.5;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
      this.x += Math.sign(dx) * Math.min(spd, Math.abs(dx));
      this.y += Math.sign(dy) * Math.min(spd, Math.abs(dy));
    }
    this.platform.x = this.x;
    this.platform.y = this.y + 28;
  }
 
  draw(ctx) {
    const { x, y, color, status, pulse } = this;
    const glow = status === 'active' ? 0.5 + 0.3 * Math.sin(pulse) : 0.15;
    const limited = status === 'rate_limited';
 
    ctx.save();
    ctx.globalAlpha = limited ? 0.35 : 0.95;
 
    // Platform
    ctx.fillStyle = '#12122a';
    ctx.strokeStyle = color + '40';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x - 45, y + 26, 90, 12, 3);
    ctx.fill(); ctx.stroke();
 
    // Body
    ctx.fillStyle = '#0d0d1a';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x - 16, y - 14, 32, 28, 5);
    ctx.fill(); ctx.stroke();
 
    // Head
    ctx.beginPath();
    ctx.roundRect(x - 12, y - 28, 24, 16, 4);
    ctx.fill(); ctx.stroke();
 
    // Eyes
    ctx.fillStyle = color;
    ctx.globalAlpha = glow + 0.3;
    ctx.beginPath(); ctx.arc(x - 5, y - 21, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 5, y - 21, 2.5, 0, Math.PI * 2); ctx.fill();
 
    // Legs
    ctx.globalAlpha = limited ? 0.2 : 0.7;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    const legSwing = status === 'active' ? Math.sin(pulse * 2) * 5 : 0;
    ctx.beginPath();
    ctx.moveTo(x - 6, y + 14); ctx.lineTo(x - 6 - legSwing, y + 26); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 14); ctx.lineTo(x + 6 + legSwing, y + 26); ctx.stroke();
 
    // Arms
    const armSwing = status === 'active' ? Math.sin(pulse * 2 + 1) * 8 : 0;
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 4); ctx.lineTo(x - 24 - armSwing, y + 4); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 16, y - 4); ctx.lineTo(x + 24 + armSwing, y + 4); ctx.stroke();
 
    // Status light
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = status === 'active' ? '#1d9e75' : status === 'rate_limited' ? '#ba7517' : '#333';
    ctx.beginPath(); ctx.arc(x + 10, y - 6, 3, 0, Math.PI * 2); ctx.fill();
 
    // Name label
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#888';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, x, y + 44);
 
    ctx.restore();
  }
}
 
class DataParticle {
  constructor(x, y, tx, ty, color) {
    this.x = x; this.y = y; this.sx = x; this.sy = y;
    this.tx = tx; this.ty = ty;
    this.color = color;
    this.progress = 0; this.speed = 0.008 + Math.random() * 0.006;
    this.done = false; this.size = 3 + Math.random() * 2;
  }
  update() {
    this.progress += this.speed;
    if (this.progress >= 1) { this.done = true; return; }
    this.x = this.sx + (this.tx - this.sx) * this.progress;
    this.y = this.sy + (this.ty - this.sy) * this.progress - Math.sin(this.progress * Math.PI) * 40;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = 1 - this.progress * 0.5;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
 
class KnowledgeNode {
  constructor(x, y, label, color) {
    this.x = x; this.y = y; this.label = label; this.color = color;
    this.r = 6 + Math.random() * 8;
    this.pulse = Math.random() * Math.PI * 2;
    this.connections = [];
    this.age = 0;
  }
  update() { this.pulse += 0.02; this.age++; }
  draw(ctx) {
    this.pulse += 0;
    const alpha = Math.min(1, this.age / 60);
    const glow = 0.4 + 0.15 * Math.sin(this.pulse);
    ctx.save();
 
    // Glow ring
    ctx.globalAlpha = alpha * 0.12;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 5, 0, Math.PI * 2);
    ctx.fill();
 
    // Main circle
    ctx.globalAlpha = alpha * glow;
    ctx.fillStyle = this.color + '25';
    ctx.strokeStyle = this.color + '90';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
 
    // Label background pill
    const label = this.label;
    const lw = label.length * 5.5 + 8;
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = '#0a0a14';
    ctx.strokeStyle = this.color + '40';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.roundRect(this.x - lw/2, this.y + this.r + 3, lw, 13, 3);
    ctx.fill(); ctx.stroke();
 
    // Label text
    ctx.fillStyle = this.color;
    ctx.font = '8px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(label, this.x, this.y + this.r + 12);
 
    ctx.restore();
  }
}
 
// Setup robots
let robots = [];
let particles = [];
let knowledgeNodes = [];
let frameCount = 0;
 
function initRobots() {
  const W = canvas.width, H = canvas.height;
  const positions = [
    { name: 'Scout', x: W * 0.15, y: H * 0.3, key: 'market_scout' },
    { name: 'Analyst', x: W * 0.35, y: H * 0.55, key: 'trend_analyst' },
    { name: 'Diver', x: W * 0.55, y: H * 0.3, key: 'deep_diver' },
    { name: 'Critic', x: W * 0.75, y: H * 0.55, key: 'critic' },
    { name: 'Memory', x: W * 0.85, y: H * 0.25, key: 'memory' },
    { name: 'Synth', x: W * 0.5, y: H * 0.75, key: 'synthesis' },
  ];
  robots = positions.map(p => {
    const r = new Robot(p.name, p.x, p.y, NODE_COLORS[p.key]);
    r.key = p.key;
    return r;
  });
}
 
function spawnParticle(fromKey, toKey) {
  const from = robots.find(r => r.key === fromKey);
  const to = robots.find(r => r.key === toKey);
  if (!from || !to) return;
  particles.push(new DataParticle(from.x, from.y - 10, to.x, to.y - 10, NODE_COLORS[fromKey]));
}
 
// Clean topic label — strip year/date clutter, keep core keywords
function cleanLabel(topic) {
  return (topic || '')
    .replace(/20\d\d[-–]\d{4}/g, '')
    .replace(/20\d\d/g, '')
    .replace(/apps?/gi, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 18);
}
 
function spawnKnowledgeNode(topic, agentKey) {
  const W = canvas.width, H = canvas.height;
  // Keep nodes away from sidebar and edges
  const x = 60 + Math.random() * (W - 200);
  const y = 60 + Math.random() * (H - 160);
  const label = cleanLabel(topic);
  const node = new KnowledgeNode(x, y, label, NODE_COLORS[agentKey] || '#2a2a4e');
 
  // Connect to nearby nodes — prefer same color (same agent)
  knowledgeNodes.forEach(n => {
    const dx = n.x - x, dy = n.y - y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const sameAgent = n.color === node.color;
    const threshold = sameAgent ? 160 : 100;
    const chance = sameAgent ? 0.6 : 0.25;
    if (dist < threshold && Math.random() < chance) {
      node.connections.push(n);
    }
  });
 
  knowledgeNodes.push(node);
  if (knowledgeNodes.length > 80) knowledgeNodes.shift();
}
 
function drawConnections() {
  knowledgeNodes.forEach(node => {
    node.connections.forEach(other => {
      ctx.save();
      ctx.strokeStyle = node.color + '18';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      ctx.moveTo(node.x, node.y);
      ctx.lineTo(other.x, other.y);
      ctx.stroke();
      ctx.restore();
    });
  });
}
 
function drawPipelineLines() {
  const pipeline = [
    ['market_scout', 'trend_analyst'],
    ['trend_analyst', 'deep_diver'],
    ['deep_diver', 'critic'],
    ['critic', 'memory'],
    ['critic', 'synthesis'],
  ];
  pipeline.forEach(([a, b]) => {
    const ra = robots.find(r => r.key === a);
    const rb = robots.find(r => r.key === b);
    if (!ra || !rb) return;
    ctx.save();
    ctx.strokeStyle = '#1a1a3a';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(ra.x, ra.y - 10);
    ctx.lineTo(rb.x, rb.y - 10);
    ctx.stroke();
    ctx.restore();
  });
}
 
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
 
  // Grid dots
  ctx.fillStyle = '#12122a';
  for (let x = 0; x < canvas.width; x += 30) {
    for (let y = 0; y < canvas.height; y += 30) {
      ctx.beginPath(); ctx.arc(x, y, 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }
 
  drawConnections();
  drawPipelineLines();
 
  knowledgeNodes.forEach(n => { n.update(); n.draw(ctx); });
  particles = particles.filter(p => !p.done);
  particles.forEach(p => { p.update(); p.draw(ctx); });
  robots.forEach(r => { r.update(); r.draw(ctx); });
 
  // Spawn particles — more frequent, smarter routing
  frameCount++;
  const pipeline = [
    ['market_scout','trend_analyst'],
    ['trend_analyst','deep_diver'],
    ['deep_diver','critic'],
    ['critic','memory'],
    ['critic','synthesis'],
    ['memory','market_scout'],
  ];
 
  // Fast particles when active (every 45 frames), slow when limited (every 180)
  pipeline.forEach(([a, b], i) => {
    const ra = robots.find(r => r.key === a);
    const rb = robots.find(r => r.key === b);
    if (!ra || !rb) return;
    const interval = ra.status === 'active' ? 45 : 180;
    const offset = i * 15; // stagger so they dont all fire at once
    if ((frameCount + offset) % interval === 0) {
      // Spawn 2 particles when active, 1 when limited
      const count = ra.status === 'active' ? 2 : 1;
      for (let c = 0; c < count; c++) {
        setTimeout(() => spawnParticle(a, b), c * 200);
      }
    }
  });
 
  // Random "memory recall" particles — memory fires back to any agent
  if (frameCount % 90 === 0) {
    const targets = ['market_scout', 'trend_analyst', 'deep_diver'];
    const target = targets[Math.floor(Math.random() * targets.length)];
    spawnParticle('memory', target);
  }
 
  requestAnimationFrame(loop);
}
 
// ── DATA FETCHING ─────────────────────────
async function fetchStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    document.getElementById('s-total').textContent = (d.total_results || 0).toLocaleString();
    document.getElementById('s-active').textContent = d.active_agents || 0;
    document.getElementById('s-time').textContent = d.last_updated || '—';
 
    agentStatuses = d.agents || {};
    AGENTS_DEF.forEach(a => {
      const robot = robots.find(r => r.key === a.key);
      const st = agentStatuses[a.key];
      if (robot && st) {
        const prev = robot.status;
        robot.status = st.status || 'unknown';
        if (prev !== 'active' && robot.status === 'active') {
          addFeed(a.name, 'back online ✓', a.color);
        }
        if (prev === 'active' && robot.status === 'rate_limited') {
          addFeed(a.name, 'hit rate limit — switching fallback', a.color);
        }
      }
    });
 
    const active = Object.values(agentStatuses).filter(s => s.status === 'active').length;
    document.getElementById('s-active').textContent = active;
    renderAgents();
  } catch(e) { console.log('stats error', e); }
 
  // Tick indicator so user knows it's live
  const tick = document.getElementById('tick');
  if (tick) {
    tick.textContent = '●';
    tick.style.color = '#1d9e75';
    setTimeout(() => { tick.textContent = ''; }, 500);
  }
}
 
async function fetchResults() {
  try {
    const r = await fetch('/api/results');
    const data = await r.json();
    const prev = allResults.length;
    allResults = data;
 
    // Count unique topics
    const topics = new Set(data.map(r => r.topic));
    document.getElementById('s-topics').textContent = topics.size;
 
    // New results → spawn knowledge nodes
    if (data.length > prev && prev > 0) {
      const newest = data[0];
      const agentKey = newest.agent || 'data';
      spawnKnowledgeNode(newest.topic || 'research', agentKey);
      addFeed(
        AGENTS_DEF.find(a => a.key === agentKey)?.name || newest.agent,
        `completed "${(newest.topic||'').slice(0,35)}"`,
        NODE_COLORS[agentKey] || '#7f77dd'
      );
    } else if (knowledgeNodes.length === 0 && data.length > 0) {
      // Seed initial nodes
      data.slice(0, 15).forEach((r, i) => {
        setTimeout(() => spawnKnowledgeNode(r.topic || 'research', r.agent || 'data'), i * 100);
      });
    }
 
    renderResults();
  } catch(e) { console.log('results error', e); }
}
 
// ── BOOT ──────────────────────────────────
initRobots();
loop();
 
fetchStats();
fetchResults();
addFeed('System', 'Agent Research Hub online', '#7f77dd');
addFeed('Manager', 'Sequential pipeline active: Scout→Analyst→Diver→Critic→Memory', '#1d9e75');
 
// Real-time feel — fast polling
setInterval(fetchStats, 5000);   // stats every 5 seconds
setInterval(fetchResults, 10000); // results every 10 seconds
 
// Live clock
setInterval(() => {
  const now = new Date();
  const t = now.toTimeString().slice(0,8);
  document.getElementById('s-time').textContent = t;
}, 1000);
window.addEventListener('resize', () => { resize(); initRobots(); });
</script>
