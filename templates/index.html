<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Research Hub — Command Center</title>
<meta name="description" content="Real-time AI agent research monitoring dashboard">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050510;--bg2:#0a0a1f;--bg3:#0f0f2a;--bg4:#141435;
  --border:#1a1a3a;--border2:#252555;--border3:#303068;
  --text:#e8e8f0;--text2:#8888aa;--text3:#555577;
  --purple:#8b7cf7;--purple-g:#6c5ce7;--teal:#00d2a0;--amber:#f0a030;
  --blue:#4ea8ff;--red:#ff6b4a;--pink:#f06;--cyan:#00e5ff;
  --green:#4caf50;
  --glass:rgba(10,10,35,0.7);--glass2:rgba(15,15,45,0.85);
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --glow-purple:0 0 20px rgba(139,124,247,0.15);
  --glow-teal:0 0 20px rgba(0,210,160,0.15);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

/* ─── TOPBAR ─── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:52px;display:flex;align-items:center;padding:0 20px;gap:16px;
  background:var(--glass2);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--glow-purple)}
.logo-text{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--text3)}
.logo-text b{color:var(--purple);font-weight:500}
.topbar-stats{display:flex;gap:2px;flex:1;max-width:520px;margin:0 auto}
.tstat{flex:1;text-align:center;padding:6px 10px;background:var(--bg2);border-radius:var(--radius-xs);border:1px solid var(--border);transition:all .3s}
.tstat:hover{border-color:var(--border2);background:var(--bg3)}
.tstat-n{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;line-height:1.2}
.tstat-n.pu{color:var(--purple)}.tstat-n.te{color:var(--teal)}.tstat-n.am{color:var(--amber)}.tstat-n.bl{color:var(--blue)}
.tstat-l{font-size:9px;color:var(--text3);letter-spacing:.1em;font-weight:500;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.live-badge{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--teal);font-weight:500;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:rgba(0,210,160,.08);border:1px solid rgba(0,210,160,.2)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:5px 12px;transition:all .3s}
.search-box:focus-within{border-color:var(--purple);box-shadow:var(--glow-purple)}
.search-box svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
.search-box input{background:none;border:none;color:var(--text);font-size:11px;font-family:'Inter',sans-serif;outline:none;width:120px}
.search-box input::placeholder{color:var(--text3)}
.add-btn{font-size:11px;padding:7px 16px;border-radius:var(--radius-xs);border:1px solid rgba(139,124,247,.3);
  background:linear-gradient(135deg,rgba(139,124,247,.12),rgba(139,124,247,.05));color:var(--purple);cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:500;transition:all .25s;letter-spacing:.03em}
.add-btn:hover{background:linear-gradient(135deg,rgba(139,124,247,.25),rgba(139,124,247,.1));border-color:var(--purple);box-shadow:var(--glow-purple);transform:translateY(-1px)}

/* ─── CANVAS ─── */
canvas#c{display:block;position:fixed;top:52px;left:0;bottom:36px}

/* ─── RIGHT SIDEBAR ─── */
.sb{position:fixed;right:0;top:52px;bottom:36px;width:280px;background:var(--glass2);backdrop-filter:blur(16px);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:50}
.sb-tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;padding:0 4px}
.sb-tab{flex:1;padding:10px 4px;font-size:10px;letter-spacing:.08em;font-weight:500;color:var(--text3);cursor:pointer;
  text-align:center;border-bottom:2px solid transparent;transition:all .2s}
.sb-tab:hover{color:var(--text2)}
.sb-tab.on{color:var(--purple);border-color:var(--purple)}
.sb-panel{display:none;flex:1;overflow-y:auto;flex-direction:column}
.sb-panel.on{display:flex}
.sb-panel::-webkit-scrollbar{width:3px}
.sb-panel::-webkit-scrollbar-track{background:transparent}
.sb-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ─── AGENT CARDS ─── */
.agent-card{margin:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);overflow:hidden;transition:all .3s}
.agent-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow)}
.agent-card.active{border-color:rgba(0,210,160,.25);box-shadow:0 0 20px rgba(0,210,160,.06)}
.agent-card.rate_limited{border-color:rgba(240,160,48,.2)}
.ac-top{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ac-icon{width:34px;height:34px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative}
.ac-icon::after{content:'';position:absolute;inset:0;border-radius:inherit;background:inherit;opacity:.15}
.ac-info{flex:1;min-width:0}
.ac-name{font-size:12px;font-weight:500;color:var(--text)}
.ac-model{font-size:10px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-badge{font-size:9px;padding:3px 8px;border-radius:99px;font-weight:500;flex-shrink:0;letter-spacing:.04em}
.ac-badge.active{background:rgba(0,210,160,.12);color:var(--teal);border:1px solid rgba(0,210,160,.2)}
.ac-badge.rate_limited{background:rgba(240,160,48,.1);color:var(--amber);border:1px solid rgba(240,160,48,.2)}
.ac-badge.unknown{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.ac-detail{border-top:1px solid var(--border);padding:10px 12px;display:none;font-size:10px;color:var(--text3);line-height:2}
.ac-detail.show{display:block}
.ac-detail span{color:var(--purple);font-weight:500}
.ac-stat-row{display:flex;gap:14px;margin-top:8px}
.ac-stat-l{font-size:9px;color:var(--text3);letter-spacing:.06em;font-weight:500}
.ac-stat-v{font-size:14px;font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace}
.ac-progress{height:3px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.ac-progress-bar{height:100%;border-radius:2px;transition:width .6s ease}

/* ─── FEED ─── */
.feed-item{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(26,26,58,.5);transition:background .2s;cursor:default}
.feed-item:hover{background:var(--bg3)}
.fi-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 6px currentColor}
.fi-body{flex:1;min-width:0}
.fi-text{font-size:11px;color:var(--text2);line-height:1.6}
.fi-text strong{color:var(--text);font-weight:500}
.fi-time{font-size:9px;color:var(--text3);margin-top:3px;font-family:'JetBrains Mono',monospace}

/* ─── INSIGHTS ─── */
.insight-card{margin:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);padding:12px;cursor:pointer;transition:all .3s}
.insight-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow)}
.insight-score{font-size:9px;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px;font-weight:600;font-family:'JetBrains Mono',monospace}
.insight-score.hi{background:rgba(0,210,160,.1);color:var(--teal);border:1px solid rgba(0,210,160,.2)}
.insight-score.mi{background:rgba(240,160,48,.1);color:var(--amber);border:1px solid rgba(240,160,48,.2)}
.insight-score.lo{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.insight-text{font-size:11px;color:var(--text2);line-height:1.7}

/* ─── BOTTOM BAR ─── */
.botbar{position:fixed;bottom:0;left:0;right:0;z-index:59;height:36px;display:flex;align-items:center;padding:0 16px;gap:8px;
  background:var(--glass2);backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.fl{font-size:10px;color:var(--text3);letter-spacing:.08em;font-weight:500;margin-right:4px}
.fbtn{font-size:10px;padding:3px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text3);
  cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;transition:all .2s}
.fbtn:hover{border-color:var(--border2);color:var(--text2)}
.fbtn.on{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 0 12px rgba(139,124,247,.3)}
.bc{margin-left:auto;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* ─── POPUP ─── */
.popup{position:fixed;z-index:200;background:var(--glass2);backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid var(--border2);border-radius:16px;width:520px;max-height:80vh;
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 1px rgba(139,124,247,.2),var(--glow-purple);
  display:none;flex-direction:column;opacity:0;transform:translateY(12px) scale(.95);transition:all .3s cubic-bezier(.16,1,.3,1)}
.popup.show{opacity:1;transform:none}
.popup-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.popup-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.popup-agent-badge{font-size:10px;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;font-weight:500}
.popup-topic{font-size:15px;color:var(--text);line-height:1.5;font-weight:600}
.popup-meta{font-size:10px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace}
.popup-score{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:600;font-family:'JetBrains Mono',monospace}
.popup-score.hi{background:rgba(0,210,160,.1);color:var(--teal)}.popup-score.mi{background:rgba(240,160,48,.1);color:var(--amber)}.popup-score.lo{background:var(--bg3);color:var(--text3)}
.popup-close{background:var(--bg2);border:1px solid var(--border);color:var(--text3);padding:6px 14px;border-radius:var(--radius-xs);
  cursor:pointer;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;flex-shrink:0;transition:all .2s}
.popup-close:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}
.popup-body{padding:16px 20px;overflow-y:auto;flex:1}
.popup-body::-webkit-scrollbar{width:3px}
.popup-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.popup-content{font-size:12px;color:var(--text2);line-height:2;white-space:pre-wrap;font-family:'Inter',sans-serif}
.popup-content .section-head{color:var(--purple);font-size:10px;letter-spacing:.1em;font-weight:600;display:block;margin:16px 0 6px;text-transform:uppercase}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:32px;width:500px;box-shadow:0 50px 120px rgba(0,0,0,.6),var(--glow-purple)}
.modal-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:28px;line-height:1.7}
.field{margin-bottom:18px}
.field label{display:block;font-size:10px;color:var(--text3);letter-spacing:.08em;font-weight:500;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);
  padding:10px 14px;border-radius:var(--radius-xs);font-family:'Inter',sans-serif;font-size:12px;outline:none;transition:all .25s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:var(--glow-purple)}
.field textarea{resize:vertical;min-height:76px}
.field select option{background:var(--bg2)}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.sel{border-color:#fff;box-shadow:0 0 12px currentColor}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:28px}
.modal-cancel,.modal-save{padding:9px 22px;border-radius:var(--radius-xs);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;transition:all .25s}
.modal-cancel{background:none;border:1px solid var(--border2);color:var(--text3)}
.modal-cancel:hover{color:var(--text);border-color:var(--border3)}
.modal-save{background:linear-gradient(135deg,var(--purple),var(--purple-g));border:none;color:#fff;box-shadow:0 4px 16px rgba(139,124,247,.3)}
.modal-save:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(139,124,247,.4)}

/* ─── VIEW TOGGLE ─── */
.view-toggle{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius-xs);border:1px solid var(--border);padding:2px}
.view-btn{padding:4px 10px;border-radius:var(--radius-xs);border:none;background:none;color:var(--text3);cursor:pointer;font-size:10px;font-family:'Inter',sans-serif;font-weight:500;transition:all .2s}
.view-btn.on{background:var(--purple);color:#fff}

/* ─── HINT ─── */
.hint{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);pointer-events:none;
  letter-spacing:.06em;transition:opacity 2s;z-index:58;background:var(--glass);backdrop-filter:blur(8px);
  padding:8px 20px;border-radius:99px;border:1px solid var(--border)}

/* ─── ANIMATIONS ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.agent-card{animation:fadeUp .4s ease both}
.agent-card:nth-child(2){animation-delay:.05s}
.agent-card:nth-child(3){animation-delay:.1s}
.agent-card:nth-child(4){animation-delay:.15s}
.agent-card:nth-child(5){animation-delay:.2s}
.agent-card:nth-child(6){animation-delay:.25s}

</style>
</head>
<body>
<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🧬</div>
    <div class="logo-text">// <b>AGENT</b> RESEARCH HUB</div>
  </div>
  <div class="topbar-stats">
    <div class="tstat"><div class="tstat-n pu" id="s-total">—</div><div class="tstat-l">RESULTS</div></div>
    <div class="tstat"><div class="tstat-n te" id="s-active">—</div><div class="tstat-l">ACTIVE</div></div>
    <div class="tstat"><div class="tstat-n am" id="s-topics">—</div><div class="tstat-l">TOPICS</div></div>
    <div class="tstat"><div class="tstat-n bl" id="s-time">—</div><div class="tstat-l">CLOCK</div></div>
  </div>
  <div class="topbar-right">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search topics..." id="search-input" oninput="onSearch(this.value)">
    </div>
    <div class="live-badge"><div class="ldot"></div><span id="tick">LIVE</span></div>
    <div class="view-toggle">
      <button class="view-btn on" onclick="setView('graph',this)" title="Graph View">⬡</button>
      <button class="view-btn" onclick="setView('timeline',this)" title="Timeline View">☰</button>
    </div>
    <button class="add-btn" onclick="openModal()">+ ADD AGENT</button>
  </div>
</div>

<!-- CANVAS -->
<canvas id="c"></canvas>

<!-- SIDEBAR -->
<div class="sb">
  <div class="sb-tab-bar">
    <div class="sb-tab on" onclick="showTab('agents',this)">AGENTS</div>
    <div class="sb-tab" onclick="showTab('feed',this)">ACTIVITY</div>
    <div class="sb-tab" onclick="showTab('insights',this)">INSIGHTS</div>
  </div>
  <div class="sb-panel on" id="tab-agents" style="padding-top:4px"></div>
  <div class="sb-panel" id="tab-feed"></div>
  <div class="sb-panel" id="tab-insights" style="padding-top:4px"></div>
</div>

<!-- BOTTOM BAR -->
<div class="botbar">
  <span class="fl">FILTER</span>
  <button class="fbtn on" onclick="setF('all',this)">All</button>
  <button class="fbtn" id="fb-market_scout" onclick="setF('market_scout',this)">Scout</button>
  <button class="fbtn" id="fb-trend_analyst" onclick="setF('trend_analyst',this)">Analyst</button>
  <button class="fbtn" id="fb-deep_diver" onclick="setF('deep_diver',this)">Diver</button>
  <button class="fbtn" id="fb-critic" onclick="setF('critic',this)">Critic</button>
  <button class="fbtn" id="fb-memory" onclick="setF('memory',this)">Memory</button>
  <span class="bc" id="bc"></span>
</div>

<!-- POPUP -->
<div class="popup" id="popup" style="display:none">
  <div class="popup-header">
    <div class="popup-top">
      <div style="flex:1;min-width:0">
        <div id="p-badge"></div>
        <div class="popup-topic" id="p-topic"></div>
        <div class="popup-meta">
          <span id="p-date"></span>
          <span id="p-score"></span>
        </div>
      </div>
      <button class="popup-close" id="popup-close-btn">✕ close</button>
    </div>
  </div>
  <div class="popup-body">
    <div class="popup-content" id="p-content"></div>
  </div>
</div>

<!-- ADD AGENT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Add New Agent</div>
    <div class="modal-sub">Add a new AI research agent. It will appear on the graph and start researching automatically.</div>
    <div class="field"><label>AGENT NAME</label><input id="m-name" placeholder="e.g. Competitor Analyst" maxlength="30"></div>
    <div class="field"><label>ROLE DESCRIPTION</label><textarea id="m-role" placeholder="e.g. Finds competitors, analyzes weaknesses and pricing strategies"></textarea></div>
    <div class="field"><label>AI PROVIDER</label>
      <select id="m-provider">
        <option value="groq">Groq (free — Llama 3.3 70B)</option>
        <option value="gemini">Google Gemini (free — 2.0 Flash)</option>
        <option value="openrouter">OpenRouter (free — Nemotron)</option>
      </select>
    </div>
    <div class="field"><label>API KEY</label><input id="m-key" placeholder="Paste your API key" type="password"></div>
    <div class="field"><label>AGENT COLOR</label>
      <div class="color-row" id="color-row">
        <div class="color-swatch sel" style="background:#8b7cf7" data-c="#8b7cf7" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#4ea8ff" data-c="#4ea8ff" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#00d2a0" data-c="#00d2a0" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#ff6b4a" data-c="#ff6b4a" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#f0a030" data-c="#f0a030" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#f06" data-c="#ff0066" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#00e5ff" data-c="#00e5ff" onclick="selColor(this)"></div>
        <div class="color-swatch" style="background:#a0c040" data-c="#a0c040" onclick="selColor(this)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" onclick="saveAgent()">Add Agent →</button>
    </div>
  </div>
</div>

<div class="hint" id="hint">click any glowing node to read the full research · press <b>/</b> to search</div>
<script>
// ── AGENT CONFIG (matches actual agent-system-v2 agents) ──
let AGENTS=[
  {key:'market_scout',name:'Market Scout',color:'#4ea8ff',icon:'🔍',
   fb:['Primary: Gemini 2.0 Flash','→ Fallback: Groq Llama 3.3 70B','→ Fallback: Cerebras Llama 3.3'],
   role:'Searches web + Reddit for specific market gaps, user complaints, and untapped opportunities'},
  {key:'trend_analyst',name:'Trend Analyst',color:'#00d2a0',icon:'📈',

// ── ROBOT ──
class Robot{
  constructor(d,x,y){
    this.key=d.key;this.name=d.name;this.color=d.color;this.icon=d.icon;this.role=d.role||'';
    this.x=x;this.y=y;this.tx=x;this.ty=y;
    this.status='unknown';this.p=Math.random()*6.28;this.w=Math.random()*6.28;
  }
  tick(){
    this.p+=.025;this.w+=.014;
    this.x+=(this.tx-this.x)*.06;this.y+=(this.ty-this.y)*.06;
  }
  draw(){
    const{x,y,color:c,status:s,p,w}=this;
    const on=s==='active',lim=s==='rate_limited';
    const a=lim?.35:1,g=on?.7+.25*Math.sin(p):.2;
    const bob=on?Math.sin(w)*3:0,Y=y+bob;
    ctx.save();ctx.globalAlpha=a;
    if(on){const gr=ctx.createRadialGradient(x,Y,0,x,Y,60);
      gr.addColorStop(0,c+'20');gr.addColorStop(1,'transparent');
      ctx.globalAlpha=.5+.2*Math.sin(p);ctx.fillStyle=gr;
      ctx.beginPath();ctx.arc(x,Y,60,0,6.28);ctx.fill();ctx.globalAlpha=a;
      // orbit ring
      ctx.globalAlpha=.08+.04*Math.sin(p);ctx.strokeStyle=c;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(x,Y,55,18,0,0,6.28);ctx.stroke();ctx.globalAlpha=a;
      const ox=x+Math.cos(p*1.5)*55,oy=Y+Math.sin(p*1.5)*18;
      ctx.fillStyle=c;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(ox,oy,2,0,6.28);ctx.fill();ctx.globalAlpha=a;}
    // shadow + platform
    ctx.globalAlpha=a*.25;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(x,Y+34,30,5,0,0,6.28);ctx.fill();ctx.globalAlpha=a;
    ctx.fillStyle='#0c0c20';ctx.strokeStyle=c+'40';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(x-32,Y+26,64,8,3);ctx.fill();ctx.stroke();
    // body + head
    ctx.fillStyle='#08081a';ctx.strokeStyle=c;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(x-14,Y-12,28,26,6);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(x-11,Y-27,22,17,5);ctx.fill();ctx.stroke();
    // antenna (active only)
    if(on){ctx.globalAlpha=.6+.3*Math.sin(p*1.8);ctx.strokeStyle=c;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,Y-27);ctx.lineTo(x,Y-37);ctx.stroke();
      ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(x,Y-39,3,0,6.28);ctx.fill();ctx.shadowBlur=0;}
    // eyes
    ctx.globalAlpha=g;ctx.fillStyle=c;
    [-4,4].forEach(dx=>{ctx.beginPath();ctx.arc(x+dx,Y-20,2.5,0,6.28);ctx.fill();
      ctx.globalAlpha=g*.4;ctx.beginPath();ctx.arc(x+dx,Y-20,5,0,6.28);ctx.fill();ctx.globalAlpha=g;});
    // limbs
    ctx.globalAlpha=on?.8:.2;ctx.strokeStyle=c;ctx.lineWidth=2;
    const sw=on?Math.sin(p*2)*5:0,aw=on?Math.sin(p*2+1)*8:0;
    ctx.beginPath();ctx.moveTo(x-5,Y+14);ctx.lineTo(x-5-sw,Y+26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+5,Y+14);ctx.lineTo(x+5+sw,Y+26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-14,Y);ctx.lineTo(x-22-aw,Y+8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+14,Y);ctx.lineTo(x+22+aw,Y+8);ctx.stroke();
    // status LED
    ctx.globalAlpha=1;const lc=on?'#00d2a0':lim?'#f0a030':'#1a1a30';
    ctx.fillStyle=lc;ctx.shadowColor=lc;ctx.shadowBlur=on?10:0;
    ctx.beginPath();ctx.arc(x+10,Y-4,3,0,6.28);ctx.fill();ctx.shadowBlur=0;
    // name
    ctx.globalAlpha=.6;ctx.fillStyle='#667';ctx.font='500 10px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText(this.name,x,Y+46);
    ctx.restore();
  }
}

function reposition(){
  const w=W(),h=H();
  // Pipeline layout: Scout → Analyst → Diver → Critic → Memory, with Synthesis below
  const slots=[
    {key:'market_scout',x:w*.12,y:h*.3},
    {key:'trend_analyst',x:w*.32,y:h*.55},
    {key:'deep_diver',x:w*.55,y:h*.25},
    {key:'critic',x:w*.75,y:h*.5},
    {key:'memory',x:w*.88,y:h*.22},
    {key:'synthesis',x:w*.48,y:h*.78},
  ];
  const extras=[{x:w*.2,y:h*.75},{x:w*.7,y:h*.8},{x:w*.05,y:h*.55},{x:w*.92,y:h*.65}];
  let ei=0;
  if(!robots.length){
    robots=AGENTS.map(d=>{const s=slots.find(s=>s.key===d.key)||extras[ei++]||{x:w*.5,y:h*.5};return new Robot(d,s.x,s.y);});
  } else {
    robots.forEach(r=>{const s=slots.find(s=>s.key===r.key)||extras[ei++];if(s){r.tx=s.x;r.ty=s.y;}});
  }
}

// ── BUBBLE (research result node) ──
class Bubble{
  constructor(res,x,y){
    this.res=res;this.x=x;this.y=y;this.vx=(Math.random()-.5)*.15;this.vy=(Math.random()-.5)*.15;
    this.color=C[res.agent]||'#8b7cf7';this.p=Math.random()*6.28;this.age=0;
    this.rad=8+Math.min(13,(res.score||0)*1.3);this.conn=[];
    this.label=(res.topic||'').replace(/20\d\d[-–]?\d{0,4}/g,'').replace(/\b(apps?|tool|platform|gaps?|market|people)\b/gi,'').replace(/\s+/g,' ').trim().slice(0,22);
  }
  tick(w,h){
    this.p+=.018;this.age++;
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<20)this.vx+=.04;if(this.x>w-20)this.vx-=.04;
    if(this.y<12)this.vy+=.04;if(this.y>h-12)this.vy-=.04;
    this.vx*=.998;this.vy*=.998;
    // gentle repulsion
    bubbles.forEach(o=>{if(o===this)return;
      const dx=this.x-o.x,dy=this.y-o.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<40&&d>0){const f=.03/d;this.vx+=dx*f;this.vy+=dy*f;}});
  }
  draw(hov){
    const{x,y,rad:r,color:c,p,age,label}=this;
    const fi=Math.min(1,age/40),g=hov?1:.35+.15*Math.sin(p);
    ctx.save();
    const gr=ctx.createRadialGradient(x,y,0,x,y,r+16);
    gr.addColorStop(0,c+'18');gr.addColorStop(1,'transparent');
    ctx.globalAlpha=fi*g*.8;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r+16,0,6.28);ctx.fill();
    ctx.globalAlpha=fi*(hov?.85:.45);
    const bg=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);
    bg.addColorStop(0,c+'30');bg.addColorStop(1,c+'08');
    ctx.fillStyle=bg;ctx.strokeStyle=c+(hov?'cc':'44');ctx.lineWidth=hov?2:1;
    ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();ctx.stroke();
    ctx.globalAlpha=fi*(hov?1:g);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=hov?14:6;
    ctx.beginPath();ctx.arc(x,y,r*.2,0,6.28);ctx.fill();ctx.shadowBlur=0;
    if(hov){ctx.globalAlpha=.15+.15*Math.sin(p*3);ctx.strokeStyle=c;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,r+22,0,6.28);ctx.stroke();}
    if(hov||r>10){
      ctx.globalAlpha=fi*(hov?1:.75);ctx.font=(hov?'500 10':'400 9')+'px Inter,sans-serif';
      const tw=ctx.measureText(label).width+12;
      ctx.fillStyle='#050510ee';ctx.strokeStyle=c+(hov?'60':'25');ctx.lineWidth=.8;
      ctx.beginPath();ctx.roundRect(x-tw/2,y+r+6,tw,16,4);ctx.fill();ctx.stroke();
      ctx.fillStyle=hov?c:c+'bb';ctx.textAlign='center';ctx.fillText(label,x,y+r+17);}
    ctx.restore();
  }
  hit(mx,my){const dx=mx-this.x,dy=my-this.y;return dx*dx+dy*dy<=(this.rad+14)**2;}
}

function addBubble(res){
  const w=W(),h=H(),rb=robots.find(r=>r.key===res.agent);
  let x,y;
  if(rb){x=rb.x+(Math.random()-.5)*160;y=rb.y+(Math.random()-.5)*140;}
  else{x=40+Math.random()*(w-80);y=20+Math.random()*(h-40);}
  x=Math.max(20,Math.min(w-20,x));y=Math.max(12,Math.min(h-12,y));
  const b=new Bubble(res,x,y);
  bubbles.filter(e=>e.res.agent===res.agent).slice(-6).forEach(e=>{
    const d=Math.hypot(e.x-x,e.y-y);if(d<180&&b.conn.length<2)b.conn.push({node:e,type:'cluster'});});
  bubbles.filter(e=>e.res.agent!==res.agent&&e.res.topic===res.topic).forEach(e=>{
    if(b.conn.length<5)b.conn.push({node:e,type:'relevant'});});
  bubbles.push(b);if(bubbles.length>160)bubbles.shift();
}

function seedBubbles(data){
  bubbles=[];const byA={};
  data.forEach(r=>{if(!byA[r.agent])byA[r.agent]=[];byA[r.agent].push(r);});
  let s=[];Object.values(byA).forEach(g=>s.push(...g.slice(0,24)));
  s.sort(()=>Math.random()-.5);
  s.forEach((r,i)=>setTimeout(()=>addBubble(r),i*12));
}

// ── PARTICLE ──
class Particle{
  constructor(x,y,tx,ty,c,type='data'){
    Object.assign(this,{x,y,sx:x,sy:y,tx,ty,c,type,p:0,spd:.006+Math.random()*.004,done:false});
    this.sz=type==='msg'?4:1.5+Math.random()*1.5;this.trail=[];
  }
  tick(){
    this.p+=this.spd;if(this.p>=1){this.done=true;return;}
    const t=this.p,arc=this.type==='msg'?75:50;
    const nx=this.sx+(this.tx-this.sx)*t,ny=this.sy+(this.ty-this.sy)*t-Math.sin(t*Math.PI)*arc;
    if(this.type==='msg'){this.trail.push({x:nx,y:ny});if(this.trail.length>12)this.trail.shift();}
    this.x=nx;this.y=ny;
  }
  draw(){
    ctx.save();
    if(this.type==='msg'){
      this.trail.forEach((t,i)=>{ctx.globalAlpha=(i/this.trail.length)*.2*(1-this.p);ctx.fillStyle=this.c;
        ctx.beginPath();ctx.arc(t.x,t.y,this.sz*.4,0,6.28);ctx.fill();});
      ctx.globalAlpha=(1-this.p)*.85;ctx.fillStyle=this.c+'18';ctx.strokeStyle=this.c;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.roundRect(this.x-5,this.y-4,10,8,2);ctx.fill();ctx.stroke();
      ctx.fillStyle=this.c;ctx.globalAlpha=1-this.p;ctx.beginPath();ctx.arc(this.x,this.y,1.5,0,6.28);ctx.fill();
    }else{
      ctx.globalAlpha=(1-this.p)*.8;ctx.fillStyle=this.c;ctx.shadowColor=this.c;ctx.shadowBlur=5;
      ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,6.28);ctx.fill();}
    ctx.restore();
  }
}
function spark(fk,tk,type='data'){
  const f=robots.find(r=>r.key===fk),t=robots.find(r=>r.key===tk);
  if(f&&t)parts.push(new Particle(f.x,f.y,t.x,t.y,C[fk]||f.color,type));
}

// ── PIPELINE (actual flow from manager.py) ──
const PIPE=[
  ['market_scout','trend_analyst'],  // Scout feeds Analyst
  ['trend_analyst','deep_diver'],    // Analyst feeds Diver
  ['deep_diver','critic'],           // Diver feeds Critic
  ['critic','memory'],               // Critic feeds Memory (score>=4)
  ['critic','synthesis'],            // Critic feeds Synthesis
  ['memory','market_scout'],         // Memory recalls back to Scout
];

function drawPipe(){
  PIPE.forEach(([a,b])=>{
    const ra=robots.find(r=>r.key===a),rb=robots.find(r=>r.key===b);if(!ra||!rb)return;
    const on=ra.status==='active';
    ctx.save();ctx.strokeStyle=on?C[a]+'28':'#0d0d20';ctx.lineWidth=on?1.2:.7;ctx.setLineDash([4,14]);
    const mx=(ra.x+rb.x)/2,my=(ra.y+rb.y)/2-30;
    ctx.beginPath();ctx.moveTo(ra.x,ra.y);ctx.quadraticCurveTo(mx,my,rb.x,rb.y);ctx.stroke();
    if(on){ctx.setLineDash([]);ctx.globalAlpha=.3;ctx.fillStyle=C[a];
      const angle=Math.atan2(rb.y-ra.y,rb.x-ra.x);
      ctx.translate(mx,my+15);ctx.rotate(angle);
      ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-3,-3);ctx.lineTo(-3,3);ctx.closePath();ctx.fill();}
    ctx.restore();
  });
}
function drawConn(){
  bubbles.forEach(b=>{b.conn.forEach(({node:o,type})=>{
    if(!bubbles.includes(o))return;ctx.save();
    if(type==='relevant'){ctx.strokeStyle=b.color+'40';ctx.lineWidth=1;ctx.setLineDash([2,6]);
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(o.x,o.y);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=.35;ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc((b.x+o.x)/2,(b.y+o.y)/2,2.5,0,6.28);ctx.fill();
    }else{ctx.strokeStyle=b.color+'12';ctx.lineWidth=.5;ctx.setLineDash([2,10]);
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(o.x,o.y);ctx.stroke();}
    ctx.restore();
  });});
}

// ── AMBIENT ──
let ambients=[];for(let i=0;i<35;i++)ambients.push({x:Math.random()*2000,y:Math.random()*1200,s:Math.random()*.5+.2,sp:Math.random()*.12+.04,a:Math.random()*6.28});
function drawAmbient(){
  const w=W(),h=H();ctx.fillStyle='#8b7cf7';
  ambients.forEach(p=>{p.y-=p.sp;p.x+=Math.sin(p.a+=.003)*.12;
    if(p.y<-5){p.y=h+5;p.x=Math.random()*w;}
    ctx.globalAlpha=.03+Math.sin(p.a)*.015;ctx.beginPath();ctx.arc(p.x%w,p.y,p.s,0,6.28);ctx.fill();});
  ctx.globalAlpha=1;
}
function drawGrid(){
  const w=W(),h=H();ctx.fillStyle='#15153a';
  for(let x=0;x<w;x+=36)for(let y=0;y<h;y+=36){ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(x,y,.5,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
}

// ── MOUSE ──
let mx=-999,my=-999;
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  hovered=[...bubbles].reverse().find(b=>b.hit(mx,my))||null;cv.style.cursor=hovered?'pointer':'default';});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();
  const hit=[...bubbles].reverse().find(b=>b.hit(e.clientX-r.left,e.clientY-r.top));
  if(hit){openPopup(hit.res,e.clientX,e.clientY);document.getElementById('hint').style.opacity='0';}});

// ── MAIN LOOP ──
function loop(){
  ctx.clearRect(0,0,W(),H());drawGrid();drawAmbient();drawPipe();drawConn();
  const w=W(),h=H();
  bubbles.forEach(b=>{b.tick(w,h);b.draw(b===hovered);});
  parts=parts.filter(p=>!p.done);parts.forEach(p=>{p.tick();p.draw();});
  robots.forEach(r=>{r.tick();r.draw();});
  fr++;
  // Pipeline particles
  PIPE.forEach(([a,b],i)=>{const ra=robots.find(r=>r.key===a);if(!ra)return;
    if(ra.status==='active'){if((fr+i*21)%48===0)spark(a,b,'data');if((fr+i*41)%130===0)spark(a,b,'msg');}
    else if((fr+i*21)%230===0)spark(a,b,'data');});
  // Memory recall
  if(fr%90===0){const t=['market_scout','trend_analyst','deep_diver'];spark('memory',t[fr/90%3|0],'msg');}
  // Active chatter
  if(fr%160===0){const act=robots.filter(r=>r.status==='active');
    if(act.length>=2){const a=act[fr/160%act.length|0],b=act.filter(r=>r.key!==a.key)[0];if(b)spark(a.key,b.key,'msg');}}
  requestAnimationFrame(loop);
}

function openPopup(r,cx,cy){
  const sc=r.score||0,cls=sc>=7?'hi':sc>=4?'mi':'lo',ac=C[r.agent]||'#8b7cf7';
  const ad=AGENTS.find(a=>a.key===r.agent);

  document.getElementById('p-score').innerHTML=sc>0?`<span class="popup-score ${cls}">${sc}/10</span>`:'';
  document.getElementById('p-content').innerHTML=(r.content||'')
    .replace(/^## (.+)$/gm,'<span class="section-head">$1</span>')
    .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#ccc">$1</strong>');
  const pop=document.getElementById('popup');pop.style.display='flex';
  requestAnimationFrame(()=>pop.classList.add('show'));
  let px=cx+20,py=cy-40;
  if(px+520>innerWidth-290)px=cx-540;
  if(py+500>innerHeight-10)py=innerHeight-510;
  pop.style.left=Math.max(10,px)+'px';pop.style.top=Math.max(10,py)+'px';
}
function closePopup(){const p=document.getElementById('popup');p.classList.remove('show');setTimeout(()=>p.style.display='none',250);}
document.getElementById('popup-close-btn').addEventListener('click',closePopup);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePopup();
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search-input').focus();}
});

// ── FILTER & SEARCH ──
function setF(f,btn){filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  const d=f==='all'?results:results.filter(r=>r.agent===f);seedBubbles(d);document.getElementById('bc').textContent=bubbles.length+' nodes';}
function onSearch(q){searchQ=q.toLowerCase();
  const d=results.filter(r=>(r.topic||'').toLowerCase().includes(searchQ)||(r.content||'').toLowerCase().includes(searchQ));
  if(searchQ.length>1)seedBubbles(d);else if(!searchQ)setF(filter,document.querySelector('.fbtn.on'));}
function setView(v,btn){currentView=v;document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

// ── MODAL ──
function openModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function selColor(el){document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');selectedColor=el.dataset.c;}
function saveAgent(){
  const name=document.getElementById('m-name').value.trim(),role=document.getElementById('m-role').value.trim();
  if(!name||!role){alert('Please fill in name and role.');return;}
  const provider=document.getElementById('m-provider').value,key=document.getElementById('m-key').value.trim();
  const pm={groq:'Groq Llama 3.3 70B',gemini:'Gemini 2.0 Flash',openrouter:'OpenRouter Nemotron'};
  const k2=name.toLowerCase().replace(/\s+/g,'_');
  const na={key:k2,name,color:selectedColor,fb:[`Primary: ${pm[provider]}`],icon:'🔬',role,custom:true,apiKey:key,provider};
  AGENTS.push(na);updateC();
  const w=W(),h=H(),extras=[{x:w*.2,y:h*.75},{x:w*.7,y:h*.8},{x:w*.05,y:h*.55}];
  const slot=extras[robots.filter(r=>r.custom).length]||{x:w*.5,y:h*.5};
  const rb=new Robot(na,slot.x,slot.y);rb.custom=true;robots.push(rb);
  const bar=document.querySelector('.botbar'),btn=document.createElement('button');
  btn.className='fbtn';btn.textContent=name.slice(0,8);btn.onclick=function(){setF(k2,this);};
  bar.insertBefore(btn,document.getElementById('bc'));
  renderAgents();addFeed(name,'joined the research team 🎉',selectedColor);closeModal();
  ['m-name','m-role','m-key'].forEach(id=>document.getElementById(id).value='');
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

// ── DATA FETCH (matches dashboard.py API) ──
async function fetchStats(){try{
  const d=await fetch('/api/stats').then(r=>r.json());
  document.getElementById('s-total').textContent=(d.total_results||0).toLocaleString();
  statuses=d.agents||{};
  robots.forEach(r=>{const st=statuses[r.key];if(!st)return;
    const prev=r.status;r.status=st.status||'unknown';
    if(prev!=='active'&&r.status==='active')addFeed(r.name,'back online ✓',r.color);
    if(prev==='active'&&r.status==='rate_limited')addFeed(r.name,'rate limited → switching fallback',r.color);});
  document.getElementById('s-active').textContent=Object.values(statuses).filter(s=>s.status==='active').length;
  renderAgents();
  const tk=document.getElementById('tick');tk.textContent='● LIVE';setTimeout(()=>tk.textContent='LIVE',600);
}catch(e){}}

async function fetchResults(){try{
  const data=await fetch('/api/results').then(r=>r.json());
  const prev=results.length;results=data;
  document.getElementById('s-topics').textContent=new Set(data.map(r=>r.topic)).size;
  if(data.length>prev&&prev>0){const n=data[0];addBubble(n);
    addFeed(AGENTS.find(a=>a.key===n.agent)?.name||n.agent,`researched "${(n.topic||'').slice(0,32)}"`,C[n.agent]||'#8b7cf7');
  }else if(!bubbles.length&&data.length){seedBubbles(filter==='all'?data:data.filter(r=>r.agent===filter));}
  document.getElementById('bc').textContent=bubbles.length+' nodes';
}catch(e){}}

async function fetchInsights(){try{insights=await fetch('/api/insights').then(r=>r.json());renderInsights();}catch(e){}}

// ── BOOT ──
reposition();loop();renderAgents();fetchStats();fetchResults();fetchInsights();
addFeed('System','Agent Research Hub v2 online','#8b7cf7');
addFeed('Pipeline','Scout → Analyst → Diver → Critic → Memory','#00d2a0');
addFeed('System',`6 agents with multi-provider fallback chains`,'#f0a030');
setInterval(fetchStats,5000);setInterval(fetchResults,10000);setInterval(fetchInsights,60000);
setInterval(()=>document.getElementById('s-time').textContent=new Date().toTimeString().slice(0,8),1000);
setTimeout(()=>document.getElementById('hint').style.opacity='0',8000);

</script>
