<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESEARCH HUB — Multi-Agent Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap');

:root {
  --bg: #0a0a0c;
  --surface: #111115;
  --surface2: #18181e;
  --border: #2a2a35;
  --border2: #1e1e28;
  --text: #e8e8f0;
  --text2: #8888a0;
  --text3: #55556a;
  --accent: #7f77dd;
  --accent2: #1d9e75;
  --accent3: #378add;
  --warn: #dd7744;
  --red: #cc4455;
  --col-scout:   #7f77dd;
  --col-analyst: #1d9e75;
  --col-diver:   #378add;
  --col-critic:  #dd7744;
  --col-memory:  #b06ecc;
  --col-synthesis:#1d9e75;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  overflow: hidden;
}

/* ── TOP BAR ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 0;
}
#logo {
  padding: 0 20px;
  font-family: 'Syne', sans-serif;
  font-size: 14px; font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--text);
  border-right: 1px solid var(--border);
  height: 100%; display: flex; align-items: center;
  white-space: nowrap;
}
#logo span { color: var(--accent); }
#tick {
  padding: 0 14px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--accent2);
  border-right: 1px solid var(--border);
  height: 100%; display: flex; align-items: center;
}
.stat-pill {
  padding: 0 14px;
  height: 100%; display: flex; align-items: center; gap: 6px;
  border-right: 1px solid var(--border);
  color: var(--text2); font-size: 11px;
}
.stat-pill b { color: var(--text); font-size: 13px; font-weight: 700; }

#view-toggle {
  margin-left: auto;
  display: flex; height: 100%;
}
.vbtn {
  padding: 0 18px;
  height: 100%;
  background: none; border: none; border-left: 1px solid var(--border);
  color: var(--text3); font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer; transition: all 0.15s;
}
.vbtn:hover { color: var(--text); background: var(--surface2); }
.vbtn.active { color: var(--accent); background: rgba(127,119,221,0.08); }

#export-btn {
  padding: 0 18px;
  height: 100%;
  background: none; border: none; border-left: 1px solid var(--border);
  color: var(--accent2); font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer; transition: all 0.15s;
}
#export-btn:hover { background: rgba(29,158,117,0.1); }

/* ── LAYOUT ── */
#layout {
  position: fixed;
  top: 48px; left: 0; right: 0; bottom: 0;
  display: flex;
}

/* ── LEFT PANEL ── */
#left {
  width: 220px; min-width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-head {
  padding: 10px 14px 8px;
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.2em; color: var(--text3);
  border-bottom: 1px solid var(--border2);
  text-transform: uppercase;
}
#agents-list { flex: 1; overflow-y: auto; }
.agent-row {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border2);
  cursor: pointer; transition: background 0.1s;
  display: flex; flex-direction: column; gap: 3px;
}
.agent-row:hover { background: var(--surface2); }
.agent-row.selected { background: rgba(127,119,221,0.07); }
.agent-name {
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.agent-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.agent-dot.active { box-shadow: 0 0 6px currentColor; }
.agent-meta { font-size: 10px; color: var(--text3); }
.agent-status {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  padding: 2px 6px; border-radius: 2px; display: inline-block; width: fit-content;
}
.status-active { background: rgba(29,158,117,0.15); color: var(--accent2); }
.status-rate_limited { background: rgba(221,119,68,0.15); color: var(--warn); }
.status-idle { background: rgba(136,136,160,0.1); color: var(--text3); }
.status-unknown { background: rgba(136,136,160,0.1); color: var(--text3); }

/* filter bar */
#filter-bar {
  padding: 8px 10px;
  border-top: 1px solid var(--border2);
  display: flex; gap: 4px; flex-wrap: wrap;
}
.fbtn {
  padding: 3px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em; border-radius: 2px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text3); cursor: pointer; transition: all 0.12s;
}
.fbtn:hover { color: var(--text); border-color: var(--border); }
.fbtn.active { background: rgba(127,119,221,0.15); color: var(--accent); border-color: var(--accent); }

/* ── MAIN ── */
#main {
  flex: 1; position: relative; overflow: hidden;
}

/* canvas area */
#canvas-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
#bubble-canvas, #graph-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}
#graph-canvas { display: none; }

/* loading overlay */
#load-overlay {
  position: absolute; inset: 0; z-index: 50;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
#load-ring {
  width: 48px; height: 48px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#load-txt { font-size: 11px; color: var(--text3); letter-spacing: 0.15em; }
#load-sub { font-size: 10px; color: var(--text3); }

/* bubbles */
.bubble {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
  color: rgba(255,255,255,0.85);
  text-align: center; padding: 6px;
  overflow: hidden;
  animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
  opacity: 0;
  user-select: none;
}
.bubble:hover {
  transform: scale(1.12) !important;
  z-index: 10 !important;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.3); }
  to   { opacity: 1; transform: scale(1); }
}

/* graph nodes */
.gnode {
  position: absolute;
  cursor: pointer;
  transition: transform 0.15s;
}
.gnode:hover { z-index: 20; }
.gnode-circle {
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.9);
  transition: transform 0.15s, box-shadow 0.15s;
}
.gnode:hover .gnode-circle {
  transform: scale(1.15);
  box-shadow: 0 0 20px rgba(127,119,221,0.5);
}
.gnode-label {
  position: absolute; top: calc(100% + 4px);
  left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--text3);
  white-space: nowrap; pointer-events: none;
}

/* ── RIGHT PANEL ── */
#right {
  width: 280px; min-width: 280px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#feed-list {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
}
.feed-item {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border2);
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(10px); }
  to   { opacity: 1; transform: translateX(0); }
}
.feed-who { font-size: 10px; font-weight: 700; }
.feed-what { font-size: 11px; color: var(--text2); margin-top: 1px; }
.feed-time { font-size: 9px; color: var(--text3); margin-top: 1px; }

#insights-panel {
  border-top: 1px solid var(--border);
  max-height: 42%;
  overflow-y: auto;
  flex-shrink: 0;
}
.insight-card {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border2);
  cursor: pointer; transition: background 0.1s;
}
.insight-card:hover { background: var(--surface2); }
.insight-score {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.insight-text {
  font-size: 10px; color: var(--text2);
  line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── DETAIL MODAL ── */
#modal-wrap {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
#modal-wrap.open { display: flex; }
#modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: min(700px, 92vw);
  max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.2s cubic-bezier(.34,1.2,.64,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
#modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
}
#modal-agent-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0; margin-top: 3px;
}
#modal-title { font-size: 14px; font-weight: 700; flex: 1; }
#modal-close {
  background: none; border: none; color: var(--text3);
  font-size: 18px; cursor: pointer; line-height: 1;
  transition: color 0.1s; flex-shrink: 0;
}
#modal-close:hover { color: var(--text); }
#modal-meta {
  padding: 8px 20px;
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.meta-tag {
  padding: 2px 8px; border-radius: 2px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  background: var(--surface2); color: var(--text3);
}
#modal-body {
  padding: 20px;
  overflow-y: auto;
  font-size: 12px; line-height: 1.7; color: var(--text2);
  white-space: pre-wrap;
}
#modal-score {
  padding: 10px 20px;
  border-top: 1px solid var(--border2);
  font-size: 10px; color: var(--text3);
  display: flex; align-items: center; gap: 10px;
}
.score-bar {
  flex: 1; height: 3px;
  background: var(--border);
  border-radius: 2px; overflow: hidden;
}
.score-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

/* scrollbars */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); filter: brightness(1.5); }

/* empty state */
#empty-state {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  color: var(--text3); font-size: 12px;
  pointer-events: none;
}
#empty-state.show { display: flex; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="logo">RESEARCH<span>HUB</span></div>
  <div id="tick">LIVE</div>
  <div class="stat-pill"><b id="s-total">—</b> results</div>
  <div class="stat-pill"><b id="s-active">—</b> active</div>
  <div class="stat-pill"><b id="s-topics">—</b> topics</div>
  <div id="view-toggle">
    <button class="vbtn active" id="btn-bubble" onclick="switchView('bubble')">◉ BUBBLE</button>
    <button class="vbtn" id="btn-graph" onclick="switchView('graph')">◈ GRAPH</button>
  </div>
  <button id="export-btn" onclick="exportData()">↓ EXPORT</button>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- LEFT: Agents -->
  <div id="left">
    <div class="panel-head">AGENTS</div>
    <div id="agents-list"></div>
    <div id="filter-bar">
      <button class="fbtn active" onclick="setFilter('all',this)">ALL</button>
    </div>
  </div>

  <!-- MAIN: Canvas -->
  <div id="main">
    <div id="canvas-wrap">
      <canvas id="graph-canvas"></canvas>
      <div id="bubble-canvas"></div>
    </div>
    <div id="empty-state">
      <div style="font-size:28px; opacity:0.3;">⬡</div>
      <div>No results match this filter</div>
    </div>
    <div id="load-overlay">
      <div id="load-ring"></div>
      <div id="load-txt">RESEARCH HUB</div>
      <div id="load-sub">CONNECTING…</div>
    </div>
  </div>

  <!-- RIGHT: Feed + Insights -->
  <div id="right">
    <div class="panel-head">LIVE FEED</div>
    <div id="feed-list"></div>
    <div id="insights-panel">
      <div class="panel-head">KEY INSIGHTS</div>
      <div id="insights-list"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div id="modal-wrap" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-head">
      <div id="modal-agent-dot"></div>
      <div id="modal-title"></div>
      <button id="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-meta" id="modal-meta"></div>
    <div id="modal-body"></div>
    <div id="modal-score">
      <span id="modal-score-label"></span>
      <div class="score-bar"><div class="score-fill" id="modal-score-fill"></div></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════════
const COL = {
  market_scout:   '#7f77dd',
  trend_analyst:  '#1d9e75',
  deep_diver:     '#378add',
  critic:         '#dd7744',
  memory:         '#b06ecc',
  synthesis:      '#1d9e75',
};

const agents = [
  { key:'market_scout',  name:'Market Scout',   desc:'Scans for gaps & opportunities', icon:'⬡' },
  { key:'trend_analyst', name:'Trend Analyst',  desc:'Tracks signals & momentum',       icon:'↗' },
  { key:'deep_diver',    name:'Deep Diver',     desc:'Investigates high-signal topics', icon:'⬇' },
  { key:'critic',        name:'Critic',         desc:'Validates & challenges findings',  icon:'⚡' },
  { key:'memory',        name:'Memory',         desc:'Cross-references past research',   icon:'◎' },
  { key:'synthesis',     name:'Synthesis',      desc:'Generates strategic insights',    icon:'✦' },
];

const statuses = {};
agents.forEach(a => { statuses[a.key] = { status:'unknown', tasks_completed:0 }; });

let allResults   = [];
let allInsights  = [];
let activeFilter = 'all';
let currentView  = 'bubble';
let bubbles      = [];
let graphNodes   = [];

// ═══════════════════════════════════════════════
// REAL DATA — loaded from your research API
// ═══════════════════════════════════════════════
async function loadRealData() {
  try {
    const [resultsRes, insightsRes, statsRes] = await Promise.all([
      fetch('/api/results').then(r => r.json()).catch(() => []),
      fetch('/api/insights').then(r => r.json()).catch(() => []),
      fetch('/api/stats').then(r => r.json()).catch(() => ({})),
    ]);
    allResults  = Array.isArray(resultsRes)  ? resultsRes  : [];
    allInsights = Array.isArray(insightsRes) ? insightsRes : [];
    const agents_status = statsRes.agents || {};
    Object.entries(agents_status).forEach(([key, val]) => {
      if (!statuses[key]) statuses[key] = {};
      statuses[key].status          = val.status          || 'unknown';
      statuses[key].tasks_completed = val.tasks_completed || 0;
    });
    updateStats(statsRes);
    return true;
  } catch(e) {
    console.log('API load failed:', e);
    return false;
  }
}

async function pollUpdates() {
  try {
    const [resultsRes, statsRes] = await Promise.all([
      fetch('/api/results').then(r => r.json()).catch(() => null),
      fetch('/api/stats').then(r => r.json()).catch(() => null),
    ]);
    if (resultsRes && Array.isArray(resultsRes)) {
      const prev = allResults.length;
      allResults = resultsRes;
      if (resultsRes.length > prev && prev > 0) {
        const n = resultsRes[0];
        if (activeFilter === 'all' || activeFilter === n.agent) addBubble(n);
        const def = agents.find(a => a.key === n.agent);
        addFeed(def?.name || n.agent, `"${(n.topic||'').slice(0,34)}"`, COL[n.agent]||'#7f77dd');
      }
    }
    if (statsRes) {
      const agents_status = statsRes.agents || {};
      Object.entries(agents_status).forEach(([key, val]) => {
        const prev = statuses[key]?.status;
        if (!statuses[key]) statuses[key] = {};
        statuses[key].status          = val.status          || 'unknown';
        statuses[key].tasks_completed = val.tasks_completed || 0;
        if (prev !== val.status) {
          const def = agents.find(a => a.key === key);
          if (val.status === 'active')       addFeed(def?.name||key, 'back online ✓',            COL[key]||'#555');
          if (val.status === 'rate_limited') addFeed(def?.name||key, 'rate limited → fallback',   COL[key]||'#555');
        }
      });
      updateStats(statsRes);
    }
    const tk = document.getElementById('tick');
    tk.textContent = '● LIVE';
    setTimeout(() => tk.textContent = 'LIVE', 500);
    renderAgents();
    if (currentView === 'graph') buildGraph(filteredResults());
  } catch(e) {}
}

function updateStats(statsRes) {
  document.getElementById('s-total').textContent  = (statsRes?.total_results || allResults.length).toLocaleString();
  document.getElementById('s-active').textContent = Object.values(statuses).filter(s => s.status === 'active').length;
  document.getElementById('s-topics').textContent = new Set(allResults.map(r => r.topic)).size;
}

// ═══════════════════════════════════════════════
// AGENT PANEL
// ═══════════════════════════════════════════════
function renderAgents() {
  const list = document.getElementById('agents-list');
  list.innerHTML = '';
  agents.forEach(a => {
    const st = statuses[a.key] || {};
    const col = COL[a.key] || '#888';
    const statusClass = `status-${st.status || 'unknown'}`;
    const isActive = st.status === 'active';
    const count = allResults.filter(r => r.agent === a.key).length;
    const div = document.createElement('div');
    div.className = 'agent-row' + (activeFilter === a.key ? ' selected' : '');
    div.onclick = () => setFilterKey(a.key);
    div.innerHTML = `
      <div class="agent-name">
        <div class="agent-dot ${isActive ? 'active' : ''}" style="background:${col};color:${col}"></div>
        ${a.icon} ${a.name}
      </div>
      <div class="agent-meta">${a.desc}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
        <span class="agent-status ${statusClass}">${(st.status||'unknown').replace('_',' ').toUpperCase()}</span>
        <span style="font-size:9px;color:var(--text3)">${count} results</span>
      </div>
    `;
    list.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════════
function setFilter(key, btn) {
  activeFilter = key;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderAgents();
  if (currentView === 'bubble') { clearBubbles(); seedBubbles(filteredResults()); }
  else buildGraph(filteredResults());
}

function setFilterKey(key) {
  activeFilter = key === activeFilter ? 'all' : key;
  document.querySelectorAll('.fbtn').forEach(b => {
    b.classList.toggle('active', b.textContent === 'ALL' && activeFilter === 'all');
  });
  renderAgents();
  if (currentView === 'bubble') { clearBubbles(); seedBubbles(filteredResults()); }
  else buildGraph(filteredResults());
}

function filteredResults() {
  if (activeFilter === 'all') return allResults;
  return allResults.filter(r => r.agent === activeFilter);
}

// ═══════════════════════════════════════════════
// BUBBLE VIEW
// ═══════════════════════════════════════════════
const bc = document.getElementById('bubble-canvas');

function clearBubbles() {
  bc.innerHTML = '';
  bubbles = [];
}

function addBubble(result) {
  const col = COL[result.agent] || '#888';
  const score = result.score || 5;
  const size = 40 + score * 5;
  const rect = bc.getBoundingClientRect();
  const x = 20 + Math.random() * (rect.width  - size - 40);
  const y = 20 + Math.random() * (rect.height - size - 40);

  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.cssText = `
    width:${size}px; height:${size}px;
    left:${x}px; top:${y}px;
    background: radial-gradient(circle at 35% 35%, ${col}cc, ${col}55);
    box-shadow: 0 0 ${score*3}px ${col}44, inset 0 1px 0 rgba(255,255,255,0.1);
    animation-delay: ${Math.random()*0.4}s;
    z-index: ${score};
  `;
  const label = (result.topic || '').slice(0, 18);
  el.textContent = label;
  el.title = result.topic;
  el.onclick = () => openModal(result);

  // Drift animation
  const dx = (Math.random() - 0.5) * 60;
  const dy = (Math.random() - 0.5) * 60;
  el.style.setProperty('--dx', dx + 'px');
  el.style.setProperty('--dy', dy + 'px');

  bc.appendChild(el);
  bubbles.push({ el, result, x, y, size, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3 });
}

function seedBubbles(results) {
  const MAX = 80;
  const slice = results.slice(0, MAX);
  slice.forEach((r, i) => {
    setTimeout(() => addBubble(r), i * 15);
  });
  const empty = document.getElementById('empty-state');
  empty.classList.toggle('show', results.length === 0);
}

// Gentle bubble drift
function driftBubbles() {
  const rect = bc.getBoundingClientRect();
  bubbles.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.x < 0 || b.x > rect.width  - b.size) b.vx *= -1;
    if (b.y < 0 || b.y > rect.height - b.size) b.vy *= -1;
    b.el.style.left = b.x + 'px';
    b.el.style.top  = b.y + 'px';
  });
  requestAnimationFrame(driftBubbles);
}
driftBubbles();

// ═══════════════════════════════════════════════
// GRAPH VIEW
// ═══════════════════════════════════════════════
const gc = document.getElementById('graph-canvas');
const gctx = gc.getContext('2d');

function buildGraph(results) {
  // Remove old nodes
  document.querySelectorAll('.gnode').forEach(n => n.remove());
  graphNodes = [];

  const wrap = document.getElementById('main');
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  gc.width = W; gc.height = H;

  gctx.clearRect(0, 0, W, H);

  const MAX = 60;
  const slice = results.slice(0, MAX);
  if (slice.length === 0) return;

  // Place nodes in force-like layout
  const nodes = slice.map((r, i) => {
    const angle = (i / slice.length) * Math.PI * 2;
    const radius = 80 + Math.random() * Math.min(W, H) * 0.3;
    return {
      x: W/2 + Math.cos(angle) * radius,
      y: H/2 + Math.sin(angle) * radius,
      r: result_radius(r),
      result: r,
    };
  });

  // Draw edges
  gctx.strokeStyle = 'rgba(127,119,221,0.08)';
  gctx.lineWidth = 1;
  nodes.forEach((n, i) => {
    nodes.forEach((m, j) => {
      if (j <= i) return;
      // Connect if same agent or shared tags
      const shared = (n.result.tags||[]).some(t => (m.result.tags||[]).includes(t));
      const sameAgent = n.result.agent === m.result.agent;
      if (shared || sameAgent) {
        gctx.beginPath();
        gctx.moveTo(n.x, n.y);
        gctx.lineTo(m.x, m.y);
        gctx.stroke();
      }
    });
  });

  // Draw nodes as DOM elements (for hover/click)
  nodes.forEach(n => {
    const col = COL[n.result.agent] || '#888';
    const el = document.createElement('div');
    el.className = 'gnode';
    el.style.cssText = `
      left:${n.x - n.r}px; top:${n.y - n.r}px;
      width:${n.r*2}px; height:${n.r*2}px;
    `;
    el.innerHTML = `
      <div class="gnode-circle" style="
        width:${n.r*2}px; height:${n.r*2}px;
        background: radial-gradient(circle at 35% 35%, ${col}aa, ${col}33);
        box-shadow: 0 0 ${n.r}px ${col}22;
      ">
        ${n.result.score||''}
      </div>
      <div class="gnode-label">${(n.result.topic||'').slice(0,22)}</div>
    `;
    el.onclick = () => openModal(n.result);
    document.getElementById('main').appendChild(el);
    graphNodes.push(el);
  });
}

function result_radius(r) {
  return 18 + (r.score||5) * 2.5;
}

// ═══════════════════════════════════════════════
// VIEW SWITCH
// ═══════════════════════════════════════════════
function switchView(v) {
  currentView = v;
  document.getElementById('btn-bubble').classList.toggle('active', v === 'bubble');
  document.getElementById('btn-graph').classList.toggle('active', v === 'graph');

  const bcanvas = document.getElementById('bubble-canvas');
  const gcanvas = document.getElementById('graph-canvas');

  if (v === 'bubble') {
    bcanvas.style.display = '';
    gcanvas.style.display = 'none';
    document.querySelectorAll('.gnode').forEach(n => n.remove());
    clearBubbles();
    seedBubbles(filteredResults());
  } else {
    bcanvas.style.display = 'none';
    gcanvas.style.display = '';
    clearBubbles();
    buildGraph(filteredResults());
  }
}

// ═══════════════════════════════════════════════
// LIVE FEED
// ═══════════════════════════════════════════════
const feedList = document.getElementById('feed-list');
const MAX_FEED = 60;

function addFeed(who, what, col) {
  const div = document.createElement('div');
  div.className = 'feed-item';
  const now = new Date();
  const t = now.toTimeString().slice(0,8);
  div.innerHTML = `
    <div class="feed-who" style="color:${col||'var(--text2)'}">${who}</div>
    <div class="feed-what">${what}</div>
    <div class="feed-time">${t}</div>
  `;
  feedList.prepend(div);
  while (feedList.children.length > MAX_FEED) feedList.removeChild(feedList.lastChild);
}

// ═══════════════════════════════════════════════
// INSIGHTS
// ═══════════════════════════════════════════════
function renderInsights() {
  const list = document.getElementById('insights-list');
  list.innerHTML = '';
  const sorted = [...allInsights].sort((a, b) => (b.novelty_score||0) - (a.novelty_score||0));
  sorted.forEach(ins => {
    const score = ins.novelty_score || 0;
    const col = score >= 8 ? '#dd7744' : score >= 6 ? '#1d9e75' : '#7f77dd';
    const div = document.createElement('div');
    div.className = 'insight-card';
    div.innerHTML = `
      <div class="insight-score" style="color:${col}">NOVELTY ${score}/10</div>
      <div class="insight-text">${(ins.content||'').replace(/#+\s/g,'')}</div>
    `;
    div.onclick = () => openInsightModal(ins);
    list.appendChild(div);
  });
}

function openInsightModal(ins) {
  const score = ins.novelty_score || 0;
  const col = score >= 8 ? '#dd7744' : score >= 6 ? '#1d9e75' : '#7f77dd';
  document.getElementById('modal-agent-dot').style.background = col;
  document.getElementById('modal-title').textContent = `INSIGHT — Novelty ${score}/10`;
  document.getElementById('modal-meta').innerHTML = `<span class="meta-tag">SYNTHESIZED</span><span class="meta-tag">NOVELTY ${score}</span>`;
  document.getElementById('modal-body').textContent = (ins.content||'').replace(/#+\s/g,'');
  document.getElementById('modal-score-label').textContent = `Novelty score: ${score}/10`;
  document.getElementById('modal-score-fill').style.cssText = `width:${score*10}%;background:${col}`;
  document.getElementById('modal-wrap').classList.add('open');
}

// ═══════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════
function openModal(result) {
  const col = COL[result.agent] || '#888';
  const def = agents.find(a => a.key === result.agent);
  document.getElementById('modal-agent-dot').style.background = col;
  document.getElementById('modal-title').textContent = result.topic || 'Result';
  const meta = document.getElementById('modal-meta');
  const tags = (result.tags || []).map(t => `<span class="meta-tag">${t}</span>`).join('');
  meta.innerHTML = `<span class="meta-tag" style="color:${col}">${def?.name||result.agent}</span>${tags}`;
  document.getElementById('modal-body').textContent = result.content || '';
  const score = result.score || 5;
  document.getElementById('modal-score-label').textContent = `Relevance score: ${score}/10`;
  document.getElementById('modal-score-fill').style.cssText = `width:${score*10}%;background:${col}`;
  document.getElementById('modal-wrap').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-wrap').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════
async function exportData() {
  try {
    const r = await fetch('/api/export');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'research_export.json'; a.click();
    URL.revokeObjectURL(url);
    addFeed('System', 'Research data exported ↓', '#1d9e75');
  } catch(e) {
    const payload = {
      exported_at: new Date().toISOString(),
      total: allResults.length,
      results: allResults,
      insights: allInsights,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'research_export.json'; a.click();
    URL.revokeObjectURL(url);
    addFeed('System', 'Local data exported ↓', '#1d9e75');
  }
}

// ═══════════════════════════════════════════════
// FILTER BUTTONS
// ═══════════════════════════════════════════════
function buildFilterBar() {
  const bar = document.getElementById('filter-bar');
  // Clear existing except ALL
  while (bar.children.length > 1) bar.removeChild(bar.lastChild);
  agents.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'fbtn';
    btn.textContent = a.icon;
    btn.title = a.name;
    btn.style.borderColor = COL[a.key];
    btn.onclick = () => setFilter(a.key, btn);
    bar.appendChild(btn);
  });
}

// BOOT
// ═══════════════════════════════════════════════
setTimeout(async () => {
  buildFilterBar();
  renderAgents();

  document.getElementById('load-sub').textContent = 'LOADING RESEARCH DATA…';

  await loadRealData();

  renderAgents();
  renderInsights();

  const d = filteredResults();
  seedBubbles(d);

  document.getElementById('s-total').textContent  = allResults.length.toLocaleString();

  document.getElementById('s-topics').textContent = new Set(allResults.map(r => r.topic)).size;

  addFeed('System',   'Hub online — click any bubble to read research', '#7f77dd');
  addFeed('Pipeline', 'Scout → Analyst → Diver → Critic → Memory',     '#1d9e75');
  addFeed('System',   'Switch to ◈ GRAPH view for knowledge graph',     '#378add');

  // Hide loader
  const overlay = document.getElementById('load-overlay');
  overlay.style.transition = 'opacity 0.5s';
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 500);

  // Poll for live updates
  setInterval(pollUpdates, 8000);

}, 600);
</script>
