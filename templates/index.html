<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Research Agent Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d14;
      color: #e5e7eb;
      overflow: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .panel { background: #13131f; border: 1px solid #1c1c2e; }
    .soft-border { border: 1px solid #1c1c2e; }
    .glow { box-shadow: 0 0 18px rgba(59,130,246,0.35); }
    .scrollbar::-webkit-scrollbar { width: 6px; }
    .scrollbar::-webkit-scrollbar-thumb { background: #2a2a3f; border-radius: 999px; }
    #mainCanvas { width: 100%; height: 100%; display: block; }
    .fade-enter { opacity: 0; transform: translateY(8px); }
    .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 220ms ease; }
    .popup { transition: opacity 200ms ease, transform 200ms ease; }
    .hidden-popup { opacity: 0; pointer-events: none; transform: translateY(10px); }
    .tab-active { background: #1c1c2e; color: #fff; }
    .pulse-dot { animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1;} 70% { transform: scale(1.6); opacity: 0;} 100% { opacity: 0;} }
    .loading-bar { animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { 0% { transform: translateX(-60%); } 50% { transform: translateX(0); } 100% { transform: translateX(60%); } }
  </style>
</head>
<body>
  <div id="loadingScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0d0d14]">
    <div class="text-xl font-semibold tracking-[0.4em] text-slate-200">NEURALFLOW</div>
    <div class="mt-4 w-64 h-1 bg-[#1c1c2e] overflow-hidden rounded-full">
      <div class="h-full w-1/2 bg-blue-500 loading-bar"></div>
    </div>
    <div id="loadingState" class="mt-4 text-xs text-slate-400 mono">INITIALIZING</div>
  </div>

  <header class="fixed top-0 left-0 right-0 h-[46px] flex items-center justify-between px-4 bg-[#0f0f18]/90 backdrop-blur border-b border-[#1c1c2e] z-40">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-blue-500 glow"></div>
      <div class="text-sm font-semibold tracking-wide">NEURALFLOW</div>
    </div>
    <div class="flex items-center gap-3">
      <div class="panel px-3 py-1 rounded-full text-xs flex items-center gap-2">
        <span class="text-slate-400">RESULTS</span>
        <span id="statResults" class="mono">0</span>
      </div>
      <div class="panel px-3 py-1 rounded-full text-xs flex items-center gap-2">
        <span class="text-slate-400">ACTIVE</span>
        <span id="statActive" class="mono">0</span>
      </div>
      <div class="panel px-3 py-1 rounded-full text-xs flex items-center gap-2">
        <span class="text-slate-400">TOPICS</span>
        <span id="statTopics" class="mono">0</span>
      </div>
      <div class="panel px-3 py-1 rounded-full text-xs flex items-center gap-2">
        <span class="text-slate-400">CLOCK</span>
        <span id="statClock" class="mono">--:--:--</span>
      </div>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <div class="flex items-center gap-2 panel px-3 py-1 rounded-full">
        <button id="viewRobots" class="px-2 py-0.5 rounded-full tab-active">ROBOTS</button>
        <button id="viewGraph" class="px-2 py-0.5 rounded-full">GRAPH</button>
      </div>
      <div class="flex items-center gap-2 panel px-3 py-1 rounded-full">
        <span class="text-emerald-400">LIVE</span>
        <span class="relative flex h-2 w-2">
          <span class="pulse-dot absolute inline-flex h-full w-full rounded-full bg-emerald-400"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
        </span>
      </div>
      <button class="panel px-3 py-1 rounded-full">EXPORT</button>
    </div>
  </header>

  <aside class="fixed top-[46px] right-0 bottom-[30px] w-[260px] panel z-30 flex flex-col">
    <div class="flex border-b border-[#1c1c2e] text-xs">
      <button data-tab="agents" class="flex-1 py-2 tab-active">AGENTS</button>
      <button data-tab="activity" class="flex-1 py-2">ACTIVITY</button>
      <button data-tab="insights" class="flex-1 py-2">INSIGHTS</button>
    </div>
    <div id="tabAgents" class="flex-1 overflow-y-auto scrollbar p-3 space-y-3"></div>
    <div id="tabActivity" class="flex-1 overflow-y-auto scrollbar p-3 space-y-3 hidden"></div>
    <div id="tabInsights" class="flex-1 overflow-y-auto scrollbar p-3 space-y-3 hidden"></div>
    <div class="p-3 border-t border-[#1c1c2e]">
      <button id="openAgentModal" class="w-full panel py-2 rounded-lg text-xs">ADD AGENT</button>
    </div>
  </aside>

  <div id="graphContainer" class="fixed top-[46px] left-0 right-[260px] bottom-[30px] hidden">
    <svg id="graphSvg" class="w-full h-full"></svg>
    <div id="graphSearch" class="absolute top-4 left-4 panel px-3 py-2 rounded-xl flex items-center gap-2 text-xs">
      <span class="text-slate-400">SEARCH</span>
      <input id="searchInput" class="bg-transparent outline-none text-slate-200 mono" placeholder="topic / agent" />
    </div>
  </div>

  <div id="canvasContainer" class="fixed top-[46px] left-0 right-[260px] bottom-[30px]">
    <canvas id="mainCanvas"></canvas>
  </div>

  <footer class="fixed left-0 right-[260px] bottom-0 h-[30px] bg-[#0f0f18]/90 border-t border-[#1c1c2e] flex items-center gap-2 px-3 text-xs">
    <div class="text-slate-400">FILTERS</div>
    <div id="filterBar" class="flex items-center gap-2"></div>
    <div class="ml-auto text-slate-400">BUBBLES</div>
    <div id="bubbleCount" class="mono">0</div>
  </footer>

  <div id="popup" class="popup hidden-popup fixed z-50 w-[320px] panel rounded-xl shadow-xl p-4">
    <div class="flex justify-between items-center">
      <div id="popupAgent" class="text-xs px-2 py-1 rounded-full"></div>
      <button id="closePopup" class="text-slate-400">✕</button>
    </div>
    <div id="popupTopic" class="mt-2 text-sm font-semibold"></div>
    <div class="flex items-center gap-2 mt-2 text-xs text-slate-400">
      <div id="popupDate"></div>
      <div id="popupScore" class="px-2 py-0.5 rounded-full panel"></div>
    </div>
    <div id="popupContent" class="mt-3 text-sm max-h-48 overflow-y-auto scrollbar"></div>
  </div>

  <div id="agentModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <div class="panel w-[420px] rounded-2xl p-5">
      <div class="text-sm font-semibold">Add Agent</div>
      <div class="mt-4 grid gap-3 text-xs">
        <input id="agentName" class="panel px-3 py-2 rounded-lg bg-transparent" placeholder="Name" />
        <input id="agentRole" class="panel px-3 py-2 rounded-lg bg-transparent" placeholder="Role" />
        <select id="agentProvider" class="panel px-3 py-2 rounded-lg bg-transparent">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="google">Google</option>
        </select>
        <input id="agentKey" class="panel px-3 py-2 rounded-lg bg-transparent" placeholder="API Key" />
        <div id="colorSwatches" class="flex gap-2"></div>
      </div>
      <div class="mt-4 flex justify-end gap-2 text-xs">
        <button id="closeAgentModal" class="panel px-3 py-1 rounded-lg">Cancel</button>
        <button id="saveAgentModal" class="panel px-3 py-1 rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <script>
    const agentConfig = {
      market_scout: { name: 'Scout', icon: '🔍', color: '#3b82f6', model: 'Navigator-1' },
      trend_analyst: { name: 'Analyst', icon: '📈', color: '#22c55e', model: 'Signal-7' },
      deep_diver: { name: 'Diver', icon: '🧠', color: '#7c6fcd', model: 'DeepCore' },
      critic: { name: 'Critic', icon: '⚡', color: '#ef4444', model: 'Guardrail' },
      memory: { name: 'Memory', icon: '💾', color: '#f59e0b', model: 'Archive-4' },
      synthesis: { name: 'Synth', icon: '✨', color: '#ec4899', model: 'Prism' }
    };

    const pipeline = ['market_scout','trend_analyst','deep_diver','critic','memory','market_scout'];
    const pipelineExtra = [['critic','synthesis']];

    const state = {
      stats: null,
      results: [],
      insights: [],
      robots: {},
      bubbles: [],
      activeView: 'robots',
      filters: new Set(['all']),
      activityFeed: [],
      userAgents: {},
      topics: new Set(),
      loadingStep: 0,
      graphReady: false
    };

    const loadingStates = ['INITIALIZING','LOADING DATA','STARTING PIPELINE','ONLINE'];

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const popup = document.getElementById('popup');
    const popupContent = {
      agent: document.getElementById('popupAgent'),
      topic: document.getElementById('popupTopic'),
      date: document.getElementById('popupDate'),
      score: document.getElementById('popupScore'),
      content: document.getElementById('popupContent')
    };

    function setLoadingState(step) {
      state.loadingStep = Math.min(step, loadingStates.length - 1);
      document.getElementById('loadingState').textContent = loadingStates[state.loadingStep];
    }

    function hideLoading() {
      const loading = document.getElementById('loadingScreen');
      loading.classList.add('opacity-0');
      loading.style.transition = 'opacity 400ms ease';
      setTimeout(() => loading.classList.add('hidden'), 420);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);

    function fetchJSON(url) {
      return fetch(url, { cache: 'no-store' }).then(res => res.ok ? res.json() : Promise.reject()).catch(() => null);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('statClock').textContent = now.toLocaleTimeString();
    }

    function computeTopics(results) {
      const topics = new Set();
      results.forEach(r => topics.add(r.topic));
      return topics;
    }

    function mergeAgentConfig(key) {
      return agentConfig[key] || { name: key.replace(/_/g,' '), icon: '🤖', color: '#94a3b8', model: 'Custom' };
    }

    function ensureRobot(agentKey) {
      if (!state.robots[agentKey]) {
        state.robots[agentKey] = {
          key: agentKey,
          x: Math.random(),
          y: Math.random(),
          t: Math.random() * 10,
          status: 'idle'
        };
      }
      return state.robots[agentKey];
    }

    function seedRobots() {
      const agents = { ...(state.stats?.agents || {}), ...state.userAgents };
      Object.keys(agents).forEach(key => ensureRobot(key));
      const keys = Object.keys(state.robots);
      keys.forEach(key => {
        const robot = state.robots[key];
        robot.x = 0.12 + (0.76 * Math.random());
        robot.y = 0.14 + (0.72 * Math.random());
      });
    }

    function updateStatsUI() {
      if (!state.stats) return;
      document.getElementById('statResults').textContent = state.stats.total_results ?? 0;
      document.getElementById('statActive').textContent = state.stats.active_agents ?? 0;
      state.topics = computeTopics(state.results);
      document.getElementById('statTopics').textContent = state.topics.size;
    }

    function updateFilterBar() {
      const filterBar = document.getElementById('filterBar');
      filterBar.innerHTML = '';
      const agents = Object.keys({ ...(state.stats?.agents || {}), ...state.userAgents });
      const allBtn = createFilterButton('all', 'All', '#1f2937');
      filterBar.appendChild(allBtn);
      agents.forEach(key => {
        const cfg = mergeAgentConfig(key);
        const btn = createFilterButton(key, cfg.name, cfg.color);
        filterBar.appendChild(btn);
      });
      document.getElementById('bubbleCount').textContent = state.bubbles.length;
    }

    function createFilterButton(key, label, color) {
      const btn = document.createElement('button');
      btn.className = `px-2 py-0.5 rounded-full soft-border ${state.filters.has(key) ? 'bg-[#1c1c2e]' : ''}`;
      btn.style.color = color;
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (key === 'all') {
          state.filters = new Set(['all']);
        } else {
          if (state.filters.has('all')) state.filters.delete('all');
          if (state.filters.has(key)) state.filters.delete(key); else state.filters.add(key);
          if (state.filters.size === 0) state.filters.add('all');
        }
        updateFilterBar();
      });
      return btn;
    }

    function syncAgentsPanel() {
      const container = document.getElementById('tabAgents');
      container.innerHTML = '';
      const agents = { ...(state.stats?.agents || {}), ...state.userAgents };
      Object.entries(agents).forEach(([key, info]) => {
        const cfg = mergeAgentConfig(key);
        const card = document.createElement('div');
        card.className = 'panel rounded-xl p-3 text-xs space-y-2';
        const status = info.status || info.state || 'idle';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:${cfg.color}20;color:${cfg.color}">${cfg.icon}</div>
              <div>
                <div class="font-semibold">${cfg.name}</div>
                <div class="text-slate-400">${cfg.model}</div>
              </div>
            </div>
            <div class="w-2.5 h-2.5 rounded-full" style="background:${status === 'active' ? '#22c55e' : '#64748b'}"></div>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>Status</span>
            <span class="mono">${status}</span>
          </div>
          <details class="text-slate-400">
            <summary class="cursor-pointer">Details</summary>
            <div class="mt-2 flex justify-between"><span>Tasks</span><span class="mono">${info.tasks_completed ?? 0}</span></div>
            <div class="mt-1 flex justify-between"><span>Fallback</span><span class="mono">${cfg.name} → Synth</span></div>
          </details>
        `;
        container.appendChild(card);
      });
    }

    function pushActivity(item) {
      const entry = {
        id: item.id,
        agent: item.agent,
        topic: item.topic,
        created_at: item.created_at
      };
      state.activityFeed.unshift(entry);
      state.activityFeed = state.activityFeed.slice(0, 80);
      const list = document.getElementById('tabActivity');
      list.innerHTML = '';
      state.activityFeed.forEach(ev => {
        const cfg = mergeAgentConfig(ev.agent);
        const el = document.createElement('div');
        el.className = 'panel rounded-lg p-2 text-xs flex items-center gap-2';
        el.innerHTML = `
          <div class="w-2 h-2 rounded-full" style="background:${cfg.color}"></div>
          <div class="flex-1">
            <div class="font-semibold">${cfg.name}</div>
            <div class="text-slate-400">${ev.topic}</div>
          </div>
          <div class="mono text-slate-400">${new Date(ev.created_at).toLocaleTimeString()}</div>
        `;
        list.appendChild(el);
      });
    }

    function updateInsights() {
      const list = document.getElementById('tabInsights');
      list.innerHTML = '';
      state.insights.forEach(insight => {
        const el = document.createElement('div');
        el.className = 'panel rounded-xl p-3 text-xs space-y-2';
        el.innerHTML = `
          <div class="flex justify-between">
            <div class="text-slate-400">Novelty</div>
            <div class="px-2 py-0.5 rounded-full" style="background:#1c1c2e">${(insight.novelty_score ?? 0).toFixed(2)}</div>
          </div>
          <div class="text-sm">${insight.content}</div>
          <div class="mono text-slate-500">${new Date(insight.created_at).toLocaleString()}</div>
        `;
        list.appendChild(el);
      });
    }

    function updateBubblesFromResults() {
      const bubbleMap = new Map(state.bubbles.map(b => [b.id, b]));
      const perAgentCount = {};
      const newBubbles = [];
      state.results.forEach(result => {
        const existing = bubbleMap.get(result.id);
        if (existing) {
          existing.score = result.score;
          existing.topic = result.topic;
          existing.content = result.content;
          newBubbles.push(existing);
          perAgentCount[result.agent] = (perAgentCount[result.agent] || 0) + 1;
          return;
        }
        perAgentCount[result.agent] = (perAgentCount[result.agent] || 0) + 1;
        if (perAgentCount[result.agent] > 22) return;
        const robot = ensureRobot(result.agent);
        newBubbles.push({
          id: result.id,
          agent: result.agent,
          topic: result.topic,
          content: result.content,
          score: result.score,
          created_at: result.created_at,
          x: robot.x + (Math.random() - 0.5) * 0.2,
          y: robot.y + (Math.random() - 0.5) * 0.2,
          vx: (Math.random() - 0.5) * 0.0006,
          vy: (Math.random() - 0.5) * 0.0006,
          r: 6 + Math.min(20, (result.score || 0) * 6)
        });
      });
      state.bubbles = newBubbles;
      document.getElementById('bubbleCount').textContent = state.bubbles.length;
    }

    function drawRobot(robot, info, active) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const x = robot.x * w;
      const y = robot.y * h;
      const scale = 1.1 + Math.sin(robot.t) * 0.03;
      const opacity = active ? 1 : 0.35;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = '#1f2937';
      ctx.strokeStyle = info.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-18, -20, 36, 36, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111827';
      ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = active ? info.color : '#4b5563';
      ctx.fillRect(-10, -4, 6, 4);
      ctx.fillRect(4, -4, 6, 4);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(-16, 18, 8, 10);
      ctx.fillRect(8, 18, 8, 10);
      ctx.strokeStyle = info.color;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(0, -30 - (active ? 4 * Math.sin(robot.t * 2) : 0));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -32, 3, 0, Math.PI * 2);
      ctx.fillStyle = active ? info.color : '#334155';
      ctx.fill();
      if (active) {
        ctx.shadowColor = info.color;
        ctx.shadowBlur = 12;
        ctx.strokeStyle = info.color;
        ctx.strokeRect(-20, -22, 40, 40);
      }
      ctx.restore();
    }

    function drawPipeline() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.save();
      ctx.strokeStyle = '#1c1c2e';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      const path = pipeline.map(key => state.robots[key]).filter(Boolean);
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i];
        const b = path[i + 1];
        ctx.beginPath();
        ctx.moveTo(a.x * w, a.y * h);
        ctx.lineTo(b.x * w, b.y * h);
        ctx.stroke();
        drawArrow(a, b);
      }
      pipelineExtra.forEach(([from, to]) => {
        const a = state.robots[from];
        const b = state.robots[to];
        if (!a || !b) return;
        ctx.beginPath();
        ctx.moveTo(a.x * w, a.y * h);
        ctx.lineTo(b.x * w, b.y * h);
        ctx.stroke();
        drawArrow(a, b);
      });
      ctx.restore();
    }

    function drawArrow(a, b) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const ax = a.x * w, ay = a.y * h, bx = b.x * w, by = b.y * h;
      const angle = Math.atan2(by - ay, bx - ax);
      const size = 6;
      ctx.save();
      ctx.setLineDash([]);
      ctx.strokeStyle = '#2a2a3f';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx - size * Math.cos(angle - 0.4), by - size * Math.sin(angle - 0.4));
      ctx.lineTo(bx - size * Math.cos(angle + 0.4), by - size * Math.sin(angle + 0.4));
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.restore();
    }

    function drawParticles() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const activeAgents = Object.keys(state.stats?.agents || {}).filter(k => state.stats.agents[k]?.status === 'active');
      const segments = [];
      for (let i = 0; i < pipeline.length - 1; i++) {
        if (activeAgents.includes(pipeline[i])) segments.push([pipeline[i], pipeline[i+1]]);
      }
      pipelineExtra.forEach(seg => segments.push(seg));
      ctx.save();
      segments.forEach(seg => {
        const a = state.robots[seg[0]]; const b = state.robots[seg[1]];
        if (!a || !b) return;
        for (let i = 0; i < 6; i++) {
          const t = (Date.now() / 1000 + i * 0.18) % 1;
          const x = (a.x + (b.x - a.x) * t) * w;
          const y = (a.y + (b.y - a.y) * t) * h;
          ctx.fillStyle = '#3b82f6';
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();
    }

    function drawBubbles() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const filtered = state.bubbles.filter(b => state.filters.has('all') || state.filters.has(b.agent));
      ctx.save();
      filtered.forEach(b => {
        const cfg = mergeAgentConfig(b.agent);
        ctx.fillStyle = cfg.color + '66';
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x * w, b.y * h, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = cfg.color;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
      });
      ctx.restore();
    }

    function drawConnections() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const filtered = state.bubbles.filter(b => state.filters.has('all') || state.filters.has(b.agent));
      ctx.save();
      filtered.forEach((b, i) => {
        for (let j = i + 1; j < filtered.length; j++) {
          const other = filtered[j];
          if (b.agent === other.agent) {
            ctx.setLineDash([4, 6]);
            ctx.strokeStyle = '#2a2a3f';
          } else if (b.topic === other.topic) {
            ctx.setLineDash([]);
            ctx.strokeStyle = '#e2e8f0';
          } else {
            continue;
          }
          ctx.lineWidth = b.topic === other.topic && b.agent !== other.agent ? 1.6 : 1;
          ctx.beginPath();
          ctx.moveTo(b.x * w, b.y * h);
          ctx.lineTo(other.x * w, other.y * h);
          ctx.stroke();
          if (b.topic === other.topic && b.agent !== other.agent) {
            const mx = (b.x + other.x) / 2 * w;
            const my = (b.y + other.y) / 2 * h;
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(mx, my, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
      ctx.restore();
    }

    function updateBubblesPhysics() {
      const w = 1; const h = 1;
      state.bubbles.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0.05 || b.x > 0.95) b.vx *= -1;
        if (b.y < 0.08 || b.y > 0.92) b.vy *= -1;
        b.x = Math.max(0.05, Math.min(0.95, b.x));
        b.y = Math.max(0.08, Math.min(0.92, b.y));
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.fillStyle = '#0d0d14';
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      drawPipeline();
      drawConnections();
      drawParticles();
      drawBubbles();
      Object.values(state.robots).forEach(robot => {
        robot.t += 0.02;
        const status = state.stats?.agents?.[robot.key]?.status || 'idle';
        drawRobot(robot, mergeAgentConfig(robot.key), status === 'active');
      });
      updateBubblesPhysics();
      requestAnimationFrame(render);
    }

    function handleCanvasClick(evt) {
      const rect = canvas.getBoundingClientRect();
      const x = (evt.clientX - rect.left) / rect.width;
      const y = (evt.clientY - rect.top) / rect.height;
      const hit = state.bubbles.find(b => {
        const dx = x * rect.width - b.x * rect.width;
        const dy = y * rect.height - b.y * rect.height;
        return Math.sqrt(dx*dx + dy*dy) < b.r + 6;
      });
      if (hit) {
        showPopup(hit, evt.clientX, evt.clientY);
      }
    }

    function showPopup(item, x, y) {
      const cfg = mergeAgentConfig(item.agent);
      popupContent.agent.textContent = cfg.name;
      popupContent.agent.style.background = cfg.color + '33';
      popupContent.agent.style.color = cfg.color;
      popupContent.topic.textContent = item.topic;
      popupContent.date.textContent = new Date(item.created_at).toLocaleString();
      popupContent.score.textContent = `Score ${item.score ?? 0}`;
      popupContent.content.textContent = item.content;
      popup.style.left = Math.min(window.innerWidth - 340, x + 16) + 'px';
      popup.style.top = Math.min(window.innerHeight - 300, y + 16) + 'px';
      popup.classList.remove('hidden-popup');
    }

    function closePopup() {
      popup.classList.add('hidden-popup');
    }

    document.getElementById('closePopup').addEventListener('click', closePopup);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
    canvas.addEventListener('click', handleCanvasClick);

    function updateView(view) {
      state.activeView = view;
      document.getElementById('canvasContainer').classList.toggle('hidden', view !== 'robots');
      document.getElementById('graphContainer').classList.toggle('hidden', view !== 'graph');
      document.getElementById('viewRobots').classList.toggle('tab-active', view === 'robots');
      document.getElementById('viewGraph').classList.toggle('tab-active', view === 'graph');
      if (view === 'graph' && !state.graphReady) {
        setupGraph();
        state.graphReady = true;
      }
      if (view === 'graph') updateGraph();
    }

    document.getElementById('viewRobots').addEventListener('click', () => updateView('robots'));
    document.getElementById('viewGraph').addEventListener('click', () => updateView('graph'));

    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('tab-active'));
        btn.classList.add('tab-active');
        document.getElementById('tabAgents').classList.toggle('hidden', tab !== 'agents');
        document.getElementById('tabActivity').classList.toggle('hidden', tab !== 'activity');
        document.getElementById('tabInsights').classList.toggle('hidden', tab !== 'insights');
      });
    });

    function updateData() {
      setLoadingState(1);
      Promise.all([fetchJSON('/api/stats'), fetchJSON('/api/results'), fetchJSON('/api/insights')])
        .then(([stats, results, insights]) => {
          if (stats) state.stats = stats;
          if (results) state.results = results;
          if (insights) state.insights = insights;
          if (state.stats) {
            seedRobots();
            updateStatsUI();
            updateFilterBar();
            syncAgentsPanel();
          }
          if (state.results) {
            updateBubblesFromResults();
            if (state.results[0]) pushActivity(state.results[0]);
          }
          if (state.insights) updateInsights();
          if (state.loadingStep < 3) {
            setLoadingState(2);
            setTimeout(() => { setLoadingState(3); hideLoading(); }, 600);
          }
          if (state.activeView === 'graph' && state.graphReady) updateGraph();
        });
    }

    function pollStats() {
      fetchJSON('/api/stats').then(stats => {
        if (!stats) return;
        state.stats = stats;
        updateStatsUI();
        syncAgentsPanel();
        updateFilterBar();
      });
    }

    function pollResults() {
      fetchJSON('/api/results').then(results => {
        if (!results) return;
        const prevIds = new Set(state.results.map(r => r.id));
        state.results = results;
        results.forEach(r => { if (!prevIds.has(r.id)) pushActivity(r); });
        updateBubblesFromResults();
        updateStatsUI();
        if (state.activeView === 'graph' && state.graphReady) updateGraph();
      });
    }

    function pollInsights() {
      fetchJSON('/api/insights').then(insights => {
        if (!insights) return;
        state.insights = insights;
        updateInsights();
      });
    }

    let simulation, zoom;

    function setupGraph() {
      const svg = d3.select('#graphSvg');
      svg.selectAll('*').remove();
      const width = document.getElementById('graphContainer').clientWidth;
      const height = document.getElementById('graphContainer').clientHeight;
      const g = svg.append('g');
      zoom = d3.zoom().scaleExtent([0.4, 2.5]).on('zoom', (event) => g.attr('transform', event.transform));
      svg.call(zoom);
      simulation = d3.forceSimulation().force('link', d3.forceLink().id(d => d.id).distance(120))
        .force('charge', d3.forceManyBody().strength(-220))
        .force('center', d3.forceCenter(width / 2, height / 2));
    }

    function updateGraph() {
      const svg = d3.select('#graphSvg');
      const g = svg.select('g');
      if (g.empty()) return;
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const topics = Array.from(new Set(state.results.map(r => r.topic)));
      const topicNodes = topics.map(t => ({ id: `topic-${t}`, topic: t, type: 'topic' }));
      const resultNodes = state.results.map(r => ({ ...r, id: `result-${r.id}`, type: 'result' }));
      const nodes = [...topicNodes, ...resultNodes];
      const links = resultNodes.map(r => ({ source: `topic-${r.topic}`, target: r.id }));
      const filteredNodes = searchTerm ? nodes.filter(n => (n.topic || n.agent || '').toLowerCase().includes(searchTerm)) : nodes;
      const filteredIds = new Set(filteredNodes.map(n => n.id));
      const filteredLinks = links.filter(l => filteredIds.has(l.source) && filteredIds.has(l.target));

      const link = g.selectAll('.link').data(filteredLinks, d => `${d.source}-${d.target}`);
      link.exit().remove();
      link.enter().append('line').attr('class', 'link').attr('stroke', '#1c1c2e').attr('stroke-width', 1);

      const node = g.selectAll('.node').data(filteredNodes, d => d.id);
      node.exit().remove();
      const nodeEnter = node.enter().append('g').attr('class', 'node').call(d3.drag()
        .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

      nodeEnter.append('circle')
        .attr('r', d => d.type === 'topic' ? 18 : 6 + Math.min(18, (d.score || 0) * 4))
        .attr('fill', d => d.type === 'topic' ? 'transparent' : mergeAgentConfig(d.agent).color)
        .attr('stroke', d => d.type === 'topic' ? '#e2e8f0' : '#0f172a')
        .attr('stroke-width', d => d.type === 'topic' ? 2 : 1.2);

      nodeEnter.append('text')
        .attr('dy', 4)
        .attr('text-anchor', 'middle')
        .attr('fill', '#e2e8f0')
        .attr('font-size', '10px')
        .text(d => d.type === 'topic' ? d.topic.slice(0, 8) : '');

      nodeEnter.on('click', (event, d) => {
        if (d.type === 'result') showPopup(d, event.clientX, event.clientY);
      });

      simulation.nodes(filteredNodes).on('tick', () => {
        g.selectAll('.link')
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        g.selectAll('.node')
          .attr('transform', d => `translate(${d.x},${d.y})`);
      });
      simulation.force('link').links(filteredLinks);
      simulation.alpha(0.9).restart();
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      if (state.activeView === 'graph') updateGraph();
    });

    const colorOptions = ['#3b82f6','#22c55e','#7c6fcd','#ef4444','#f59e0b','#ec4899','#38bdf8','#f97316'];
    const colorSwatches = document.getElementById('colorSwatches');
    let selectedColor = colorOptions[0];
    colorOptions.forEach(color => {
      const swatch = document.createElement('button');
      swatch.className = 'w-6 h-6 rounded-full';
      swatch.style.background = color;
      swatch.addEventListener('click', () => { selectedColor = color; });
      colorSwatches.appendChild(swatch);
    });

    document.getElementById('openAgentModal').addEventListener('click', () => {
      document.getElementById('agentModal').classList.remove('hidden');
      document.getElementById('agentModal').classList.add('flex');
    });
    document.getElementById('closeAgentModal').addEventListener('click', () => {
      document.getElementById('agentModal').classList.add('hidden');
      document.getElementById('agentModal').classList.remove('flex');
    });
    document.getElementById('saveAgentModal').addEventListener('click', () => {
      const name = document.getElementById('agentName').value.trim();
      const role = document.getElementById('agentRole').value.trim();
      if (!name) return;
      const key = name.toLowerCase().replace(/\s+/g, '_');
      state.userAgents[key] = { status: 'active', tasks_completed: 0, role };
      agentConfig[key] = { name, icon: '🤖', color: selectedColor, model: role || 'Custom' };
      ensureRobot(key);
      syncAgentsPanel();
      updateFilterBar();
      document.getElementById('agentModal').classList.add('hidden');
      document.getElementById('agentModal').classList.remove('flex');
    });

    updateClock();
    setInterval(updateClock, 1000);
    resizeCanvas();
    updateData();
    setInterval(pollStats, 5000);
    setInterval(pollResults, 10000);
    setInterval(pollInsights, 12000);
    render();
  </script>
</body>
</html>
