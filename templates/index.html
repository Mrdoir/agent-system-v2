<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f17;--panel:#161622;--panel2:#1a1a2a;--border:#1e1e2e;--border2:#282840;--purple:#7c6fcd;--teal:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--pink:#ec4899;--red:#ef4444;--cyan:#06b6d4;--text:#e2e2ef;--text2:#8888a8;--text3:#555570;--text4:#3a3a52}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

#loadScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#loadScreen.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-logo{font-size:26px;font-weight:900;letter-spacing:4px;margin-bottom:36px}.ld-logo i{font-style:normal;color:var(--purple);text-shadow:0 0 30px rgba(124,111,205,.4)}
.ld-bar-o{width:260px;height:3px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px}
.ld-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--blue));border-radius:6px;transition:width .5s ease}
.ld-txt{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase}

#topbar{position:fixed;top:0;left:0;right:0;height:46px;background:var(--panel);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;padding:0 14px;gap:10px}
.tb-logo{font-weight:900;font-size:12px;letter-spacing:2.5px;color:var(--text3);white-space:nowrap;flex-shrink:0}.tb-logo i{font-style:normal;color:var(--purple)}
.tb-center{display:flex;gap:6px;flex:1;justify-content:center}
.st-card{display:flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:6px}
.st-v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;line-height:1}
.st-l{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;line-height:1;margin-top:1px}
.tb-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.vt{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.vt button{padding:4px 9px;font-size:9px;font-weight:700;letter-spacing:1px;background:transparent;color:var(--text3);border:none;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}.vt button.on{background:var(--purple);color:#fff}
.live-i{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--teal);font-weight:700;letter-spacing:.5px}.live-i::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pls 2s infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.3}}
.tb-btn{padding:4px 10px;font-size:9px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px}.tb-btn:hover{border-color:var(--purple);color:var(--text);background:rgba(124,111,205,.08)}.tb-btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}.tb-btn.pri:hover{background:#6b5ebc}

#sidebar{position:fixed;top:46px;right:0;width:280px;bottom:30px;background:var(--panel);border-left:1px solid var(--border);z-index:90;display:flex;flex-direction:column}
.sb-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-tab{flex:1;padding:8px 0;text-align:center;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}.sb-tab.on{color:var(--purple);border-bottom-color:var(--purple)}
.sb-body{flex:1;overflow-y:auto;padding:8px}

.sb-search{margin-bottom:8px;position:relative}
.sb-search input{width:100%;padding:8px 12px 8px 32px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;outline:none;transition:border-color .2s}
.sb-search input:focus{border-color:var(--purple)}
.sb-search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}

.ag-card{padding:10px;margin-bottom:5px;background:rgba(255,255,255,.018);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .25s}.ag-card:hover{background:rgba(255,255,255,.035)}.ag-card.alive{border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
.ag-hdr{display:flex;align-items:center;gap:7px}
.ag-ico{font-size:17px;line-height:1}
.ag-inf{flex:1;min-width:0}
.ag-nm{font-size:11px;font-weight:700;line-height:1.2}
.ag-prov{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-badge{font-size:7px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;text-transform:uppercase;flex-shrink:0}
.ag-badge.live{background:rgba(34,197,94,.12);color:var(--teal)}.ag-badge.limited{background:rgba(245,158,11,.12);color:var(--amber)}.ag-badge.offline{background:rgba(85,85,112,.12);color:var(--text3)}.ag-badge.error{background:rgba(239,68,68,.12);color:var(--red)}
.ag-exp{max-height:0;overflow:hidden;transition:max-height .3s ease}.ag-card.open .ag-exp{max-height:140px}
.ag-exp-in{padding-top:8px;margin-top:8px;border-top:1px solid var(--border);font-size:10px;color:var(--text2)}
.ag-row{display:flex;justify-content:space-between;margin-bottom:2px}.ag-row span:first-child{color:var(--text3)}
.ag-score{display:flex;gap:2px;margin-top:4px}.ag-score-bar{height:4px;border-radius:2px;flex:1}.ag-score-bar.on{background:var(--purple)}.ag-score-bar.off{background:var(--border)}

.act-it{display:flex;gap:7px;padding:7px 3px;border-bottom:1px solid rgba(30,30,46,.4);align-items:flex-start}
.act-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.act-msg{font-size:10px;line-height:1.45;flex:1}.act-msg b{font-weight:600}
.act-t{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px}

.ins-card{padding:10px;margin-bottom:5px;background:rgba(255,255,255,.018);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}.ins-card:hover{background:rgba(255,255,255,.035)}
.ins-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.nov-b{font-size:7px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.nov-hi{background:rgba(34,197,94,.12);color:var(--teal)}.nov-mi{background:rgba(245,158,11,.12);color:var(--amber)}.nov-lo{background:rgba(85,85,112,.12);color:var(--text3)}
.ins-dt{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.ins-tx{font-size:10px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

#canvasWrap{position:fixed;top:46px;left:0;right:280px;bottom:30px;background:var(--bg);overflow:hidden}
#mainCanvas{display:block;width:100%;height:100%}
#graphView{position:absolute;inset:0;display:none}
#graphView svg{width:100%;height:100%}
#graphSearch{position:absolute;top:12px;left:12px;padding:6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;font-family:'Inter',sans-serif;outline:none;width:200px;transition:border-color .2s}
#graphSearch:focus{border-color:var(--purple)}

#bottomBar{position:fixed;bottom:0;left:0;right:0;height:30px;background:var(--panel);border-top:1px solid var(--border);z-index:100;display:flex;align-items:center;padding:0 12px;gap:5px}
.fl-lbl{font-size:8px;color:var(--text3);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-right:3px}
.fl-btn{padding:2px 8px;font-size:8px;font-weight:600;letter-spacing:.4px;background:transparent;color:var(--text3);border:1px solid transparent;border-radius:4px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}.fl-btn:hover{color:var(--text)}.fl-btn.on{background:rgba(124,111,205,.12);color:var(--purple);border-color:rgba(124,111,205,.25)}
.bbl-ct{margin-left:auto;font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace}

#popup{position:fixed;z-index:200;width:420px;max-height:520px;background:var(--panel);border:1px solid var(--border2);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 40px rgba(124,111,205,.06);display:none;opacity:0;transform:scale(.9) translateY(8px);transition:opacity .22s,transform .22s;overflow:hidden;flex-direction:column}
#popup.vis{display:flex;opacity:1;transform:scale(1) translateY(0)}
#popup.cls{opacity:0;transform:scale(.92) translateY(4px)}
.pp-hdr{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.pp-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.pp-x{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;flex-shrink:0}.pp-x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.pp-title{padding:0 16px 6px;font-size:15px;font-weight:700;line-height:1.35}
.pp-meta{padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.pp-dt{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.pp-sc{font-size:8px;font-weight:800;padding:2px 8px;border-radius:4px}
.pp-body{padding:0 16px 14px;flex:1;overflow-y:auto;font-size:11px;line-height:1.75;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.pp-tags{padding:8px 16px 14px;display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0;border-top:1px solid var(--border)}
.pp-tag{font-size:8px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.04);color:var(--text2)}

.empty-state{text-align:center;color:var(--text3);padding:30px 16px;font-size:10px;line-height:1.6}
</style>
</head>
<body>
<div id="loadScreen">
  <div class="ld-logo">// <i>AGENT RESEARCH HUB</i></div>
  <div class="ld-bar-o"><div class="ld-bar" id="ldBar"></div></div>
  <div class="ld-txt" id="ldTxt">INITIALIZING</div>
</div>

<div id="topbar">
  <div class="tb-logo">// <i>AGENT RESEARCH HUB</i></div>
  <div class="tb-center">
    <div class="st-card"><div><div class="st-v" id="sResults" style="color:var(--purple)">—</div><div class="st-l">Results</div></div></div>
    <div class="st-card"><div><div class="st-v" id="sActive" style="color:var(--teal)">—</div><div class="st-l">Active</div></div></div>
    <div class="st-card"><div><div class="st-v" id="sHQ" style="color:var(--amber)">—</div><div class="st-l">High Quality</div></div></div>
    <div class="st-card"><div><div class="st-v mono" id="sClock" style="color:var(--blue)">00:00:00</div><div class="st-l">Uptime</div></div></div>
  </div>
  <div class="tb-right">
    <div class="vt">
      <button class="on" data-v="robots" onclick="setView('robots')">ROBOTS</button>
      <button data-v="graph" onclick="setView('graph')">GRAPH</button>
    </div>
    <div class="live-i">LIVE</div>
    <button class="tb-btn" onclick="window.open('/api/export','_blank')">↓ EXPORT</button>
  </div>
</div>

<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
  <div id="graphView">
    <input id="graphSearch" type="text" placeholder="Search topics..." oninput="rebuildGraph()">
  </div>
</div>

<div id="sidebar">
  <div class="sb-tabs">
    <div class="sb-tab on" data-t="agents" onclick="setTab('agents')">Agents</div>
    <div class="sb-tab" data-t="activity" onclick="setTab('activity')">Activity</div>
    <div class="sb-tab" data-t="insights" onclick="setTab('insights')">Insights</div>
  </div>
  <div class="sb-body" id="sbBody"></div>
</div>

<div id="bottomBar">
  <span class="fl-lbl">Filter</span>
  <button class="fl-btn on" data-f="all" onclick="setFilter('all')">All</button>
  <span class="bbl-ct" id="bblCt">0 bubbles</span>
</div>

<div id="popup">
  <div class="pp-hdr">
    <div class="pp-badge" id="ppBadge"></div>
    <button class="pp-x" onclick="closePopup()">✕</button>
  </div>
  <div class="pp-title" id="ppTitle"></div>
  <div class="pp-meta"><span class="pp-dt" id="ppDt"></span><span class="pp-sc" id="ppSc"></span></div>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-tags" id="ppTags"></div>
</div>

<script>
const AGENTS={market_scout:{name:'Scout',icon:'🔍',color:'#3b82f6',model:'Gemini Flash',provider:'Google'},trend_analyst:{name:'Analyst',icon:'📈',color:'#22c55e',model:'Groq Llama',provider:'Groq'},deep_diver:{name:'Diver',icon:'🧠',color:'#7c6fcd',model:'Nemotron',provider:'OpenRouter'},critic:{name:'Critic',icon:'⚡',color:'#ef4444',model:'DeepSeek R1',provider:'OpenRouter'},memory:{name:'Memory',icon:'💾',color:'#f59e0b',model:'Gemini Flash',provider:'Google'},synthesis:{name:'Synth',icon:'✨',color:'#ec4899',model:'Groq Llama',provider:'Groq'}};
const S={stats:null,results:[],insights:[],view:'robots',filter:'all',tab:'agents',t0:Date.now()};
let bubbles=[],robots={},canvas,ctx,W,H,feed=[],prevRC=0;

(function(){const bar=document.getElementById('ldBar'),txt=document.getElementById('ldTxt');const steps=[{p:20,t:'INITIALIZING',d:0},{p:50,t:'CONNECTING',d:500},{p:80,t:'LOADING DATA',d:1000},{p:100,t:'ONLINE',d:1500}];steps.forEach(s=>setTimeout(()=>{bar.style.width=s.p+'%';txt.textContent=s.t},s.d));setTimeout(()=>{document.getElementById('loadScreen').classList.add('out');init()},2200)})();

function init(){setupCanvas();buildFilters();initRobots();fetchAll();setInterval(fetchStats,5000);setInterval(fetchResults,10000);setInterval(fetchInsights,15000);setInterval(tickClock,1000);requestAnimationFrame(loop);renderSidebar();window.addEventListener('resize',()=>{resizeCanvas();if(S.view==='graph')rebuildGraph()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()})}

async function fetchStats(){try{const r=await fetch('/api/stats');if(!r.ok)throw 0;S.stats=await r.json();updateTopbar();renderSidebar()}catch(e){}}
async function fetchResults(){try{const r=await fetch('/api/results');if(!r.ok)throw 0;const d=await r.json();if(d.length!==prevRC){const prev=new Set(S.results.map(x=>x.id));d.filter(x=>!prev.has(x.id)).forEach(n=>{addFeed(n.agent,`researched: ${(n.topic||'').substring(0,35)}...`,n.created_at)});S.results=d;prevRC=d.length;seedBubbles();if(S.view==='graph')rebuildGraph()}}catch(e){}}
async function fetchInsights(){try{const r=await fetch('/api/insights');if(!r.ok)throw 0;S.insights=await r.json();if(S.tab==='insights')renderSidebar()}catch(e){}}
function fetchAll(){fetchStats();fetchResults();fetchInsights()}

function updateTopbar(){if(!S.stats)return;document.getElementById('sResults').textContent=S.stats.total_results||0;document.getElementById('sActive').textContent=S.stats.active_agents||0;document.getElementById('sHQ').textContent=S.stats.high_quality_results||0}
function tickClock(){const d=Math.floor((Date.now()-S.t0)/1000);document.getElementById('sClock').textContent=`${String(Math.floor(d/3600)).padStart(2,'0')}:${String(Math.floor((d%3600)/60)).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`}

function setView(v){S.view=v;document.querySelectorAll('.vt button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.getElementById('graphView').style.display=v==='graph'?'block':'none';document.getElementById('mainCanvas').style.display=v==='robots'?'block':'none';if(v==='graph')rebuildGraph()}
function setTab(t){S.tab=t;document.querySelectorAll('.sb-tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));renderSidebar()}

function renderSidebar(){const el=document.getElementById('sbBody');if(S.tab==='agents')el.innerHTML=renderAgents();else if(S.tab==='activity')el.innerHTML=renderActivity();else el.innerHTML=renderInsights()}

function renderAgents(){let h='';for(const[key,ag]of Object.entries(AGENTS)){const st=S.stats?.agents?.[key];const status=st?.status||'offline';const cls=status==='active'?'live':(status==='rate_limited'?'limited':(status==='error'?'error':'offline'));const label=status==='active'?'LIVE':(status==='rate_limited'?'LIMITED':(status==='error'?'ERROR':'OFFLINE'));const tasks=st?.tasks_completed||0;const lastRun=st?.last_run?fmtTime(st.last_run):'never';const isAlive=status==='active';const rlu=st?.rate_limit_until;let rlInfo='';if(rlu){try{const mins=Math.max(0,Math.round((new Date(rlu)-new Date())/60000));if(mins>0)rlInfo=`Resets in ${mins}m`}catch(e){}}
const avgScore=st?.total_score&&tasks?(st.total_score/tasks).toFixed(1):'—';
h+=`<div class="ag-card ${isAlive?'alive':''}" style="--ac:${ag.color}" onclick="this.classList.toggle('open')"><div class="ag-hdr"><span class="ag-ico">${ag.icon}</span><div class="ag-inf"><div class="ag-nm" style="color:${ag.color}">${ag.name}</div><div class="ag-prov">${ag.model} / ${ag.provider}</div></div><span class="ag-badge ${cls}">${label}</span></div><div class="ag-exp"><div class="ag-exp-in"><div class="ag-row"><span>Tasks</span><span class="mono">${tasks}</span></div><div class="ag-row"><span>Avg Score</span><span class="mono">${avgScore}</span></div><div class="ag-row"><span>Last run</span><span>${lastRun}</span></div>${rlInfo?`<div class="ag-row"><span>Rate limit</span><span style="color:var(--amber)">${rlInfo}</span></div>`:''}<div class="ag-row"><span>Key</span><span class="mono" style="font-size:8px">${key}</span></div></div></div></div>`}
return h}

function renderActivity(){if(!feed.length)return'<div class="empty-state">Waiting for activity...<br>Results appear as agents complete research.</div>';return feed.slice(-60).reverse().map(a=>{const ag=AGENTS[a.agent]||{color:'#888',name:a.agent};return`<div class="act-it"><div class="act-dot" style="background:${ag.color}"></div><div><div class="act-msg"><b style="color:${ag.color}">${ag.name}</b> ${esc(a.msg)}</div><div class="act-t">${fmtTime(a.time)}</div></div></div>`}).join('')}

function renderInsights(){if(!S.insights.length)return'<div class="empty-state">No insights yet.<br>Memory agent synthesizes research patterns.</div>';return S.insights.map((ins,i)=>{const ns=ins.novelty_score||0;const lvl=ns>=7?'hi':(ns>=4?'mi':'lo');const txt=ns>=7?'HIGH':(ns>=4?'MID':'LOW');return`<div class="ins-card" onclick="openInsight(${i})"><div class="ins-hd"><span class="nov-b nov-${lvl}">${txt} ${ns}/10</span><span class="ins-dt">${fmtTime(ins.created_at)}</span></div><div class="ins-tx">${esc(ins.content||'')}</div></div>`}).join('')}

function addFeed(agent,msg,time){feed.push({agent,msg,time:time||new Date().toISOString()});if(feed.length>100)feed.shift();if(S.tab==='activity')renderSidebar()}
function openInsight(i){const ins=S.insights[i];if(!ins)return;showPopup({agent:'memory',topic:'Research Insight',content:ins.content,score:ins.novelty_score,created_at:ins.created_at},window.innerWidth/2-210,window.innerHeight/2-220)}

function buildFilters(){const bar=document.getElementById('bottomBar');Object.entries(AGENTS).forEach(([k,ag])=>{const b=document.createElement('button');b.className='fl-btn';b.dataset.f=k;b.textContent=ag.name;b.onclick=()=>setFilter(k);bar.insertBefore(b,document.getElementById('bblCt'))})}
function setFilter(f){S.filter=f;document.querySelectorAll('.fl-btn').forEach(b=>b.classList.toggle('on',b.dataset.f===f));updBblCt();if(S.view==='graph')rebuildGraph()}
function updBblCt(){const n=S.filter==='all'?bubbles.length:bubbles.filter(b=>b.agent===S.filter).length;document.getElementById('bblCt').textContent=`${n} bubbles`}

function setupCanvas(){canvas=document.getElementById('mainCanvas');ctx=canvas.getContext('2d');resizeCanvas()}
function resizeCanvas(){const wr=document.getElementById('canvasWrap');W=wr.clientWidth;H=wr.clientHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);reposRobots()}

function initRobots(){const keys=Object.keys(AGENTS);const pos=[{xr:.14,yr:.38},{xr:.36,yr:.58},{xr:.58,yr:.30},{xr:.78,yr:.55},{xr:.50,yr:.72},{xr:.85,yr:.30}];keys.forEach((k,i)=>{const p=pos[i]||{xr:.2+Math.random()*.6,yr:.25+Math.random()*.5};robots[k]={key:k,def:AGENTS[k],xr:p.xr,yr:p.yr,x:0,y:0,ph:Math.random()*Math.PI*2,arm:Math.random()*Math.PI*2}});reposRobots()}
function reposRobots(){Object.values(robots).forEach(r=>{r.x=r.xr*W;r.y=r.yr*H})}

function seedBubbles(){bubbles=[];const grp={};S.results.forEach(r=>{if(!grp[r.agent])grp[r.agent]=[];grp[r.agent].push(r)});Object.entries(grp).forEach(([agent,res])=>{res.slice(0,22).forEach(r=>{const a=Math.random()*Math.PI*2,d=55+Math.random()*110;const rob=robots[agent];const bx=rob?(rob.x+Math.cos(a)*d):(Math.random()*W);const by=rob?(rob.y+Math.sin(a)*d):(Math.random()*H);bubbles.push({result:r,agent:r.agent,x:Math.max(25,Math.min(W-25,bx)),y:Math.max(25,Math.min(H-25,by)),vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,radius:Math.max(6,Math.min(18,(r.score||3)*1.8)),color:AGENTS[agent]?.color||'#888'})})});updBblCt()}

let lt=0;function loop(ts){const dt=Math.min((ts-lt)/16.67,3);lt=ts;if(S.view==='robots')drawRobots(dt,ts);requestAnimationFrame(loop)}

function drawRobots(dt,ts){ctx.clearRect(0,0,W,H);drawGrid();drawBubbles(S.filter==='all'?bubbles:bubbles.filter(b=>b.agent===S.filter),dt);drawAllRobots(ts)}
function drawGrid(){ctx.fillStyle='rgba(30,30,46,.5)';for(let x=25;x<W;x+=28)for(let y=25;y<H;y+=28)ctx.fillRect(x,y,1,1)}
function drawBubbles(vis,dt){vis.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x-b.radius<0){b.x=b.radius;b.vx=Math.abs(b.vx)}if(b.x+b.radius>W){b.x=W-b.radius;b.vx=-Math.abs(b.vx)}if(b.y-b.radius<0){b.y=b.radius;b.vy=Math.abs(b.vy)}if(b.y+b.radius>H){b.y=H-b.radius;b.vy=-Math.abs(b.vy)}const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.radius*2.5);g.addColorStop(0,rgba(b.color,.1));g.addColorStop(1,rgba(b.color,0));ctx.beginPath();ctx.arc(b.x,b.y,b.radius*2.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fillStyle=rgba(b.color,.2);ctx.strokeStyle=rgba(b.color,.5);ctx.lineWidth=1;ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,1.5,0,Math.PI*2);ctx.fillStyle=rgba(b.color,.7);ctx.fill()})}
function drawAllRobots(ts){Object.values(robots).forEach(r=>{const status=S.stats?.agents?.[r.key]?.status;const on=status==='active';const op=on?1:.3;const bob=on?Math.sin(ts/600+r.ph)*3:0;const cx=r.x,cy=r.y+bob,c=r.def.color;ctx.save();ctx.globalAlpha=op;if(on){const h=ctx.createRadialGradient(cx,cy-8,0,cx,cy-8,45);h.addColorStop(0,rgba(c,.06));h.addColorStop(1,rgba(c,0));ctx.beginPath();ctx.arc(cx,cy-8,45,0,Math.PI*2);ctx.fillStyle=h;ctx.fill()}ctx.fillStyle=rgba(c,.1);ctx.beginPath();ctx.ellipse(cx,cy+27,22,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-5,cy+14);ctx.lineTo(cx-5,cy+25);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+5,cy+14);ctx.lineTo(cx+5,cy+25);ctx.stroke();ctx.fillStyle=rgba(c,.25);ctx.strokeStyle=c;ctx.lineWidth=1.5;rrect(cx-12,cy-4,24,20,4);ctx.fill();ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-12,cy+2);ctx.lineTo(cx-18,cy+2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+12,cy+2);ctx.lineTo(cx+18,cy+2);ctx.stroke();ctx.fillStyle=rgba(c,.35);ctx.strokeStyle=c;ctx.lineWidth=1.5;rrect(cx-10,cy-20,20,17,4);ctx.fill();ctx.stroke();const eg=on?.9:.25;ctx.fillStyle=rgba('#ffffff',eg);ctx.beginPath();ctx.arc(cx-4,cy-12,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+4,cy-12,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(cx,cy-29);ctx.stroke();const ap=on?.4+.6*Math.sin(ts/180+r.ph):.2;ctx.beginPath();ctx.arc(cx,cy-29,3,0,Math.PI*2);ctx.fillStyle=rgba(c,ap);ctx.fill();ctx.globalAlpha=op*.85;ctx.fillStyle=c;ctx.font='700 9px "JetBrains Mono"';ctx.textAlign='center';ctx.fillText(r.def.name.toUpperCase(),cx,cy+40);if(status==='rate_limited'){ctx.fillStyle=rgba('#f59e0b',.7);ctx.font='600 7px "JetBrains Mono"';ctx.fillText('LIMITED',cx,cy+50)}ctx.restore()})}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
document.getElementById('mainCanvas').addEventListener('click',e=>{const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;const vis=S.filter==='all'?bubbles:bubbles.filter(b=>b.agent===S.filter);for(let i=vis.length-1;i>=0;i--){if(Math.hypot(mx-vis[i].x,my-vis[i].y)<vis[i].radius+6){showPopup(vis[i].result,e.clientX,e.clientY);return}}})

function rebuildGraph(){const ctr=document.getElementById('graphView');ctr.querySelectorAll('svg').forEach(s=>s.remove());const w=ctr.clientWidth,h=ctr.clientHeight;const svg=d3.select(ctr).append('svg').attr('width',w).attr('height',h);const defs=svg.append('defs');const pat=defs.append('pattern').attr('id','gd').attr('width',28).attr('height',28).attr('patternUnits','userSpaceOnUse');pat.append('circle').attr('cx',14).attr('cy',14).attr('r',.5).attr('fill','rgba(30,30,46,.6)');svg.append('rect').attr('width',w).attr('height',h).attr('fill','url(#gd)');let filtered=S.filter==='all'?S.results:S.results.filter(r=>r.agent===S.filter);const q=(document.getElementById('graphSearch').value||'').toLowerCase();if(q)filtered=filtered.filter(r=>(r.topic||'').toLowerCase().includes(q));if(!filtered.length){svg.append('text').attr('x',w/2).attr('y',h/2).attr('text-anchor','middle').attr('fill','#555570').attr('font-size','11px').text('No results');return}const topics=[...new Set(filtered.map(r=>r.topic))];const nodes=[],links=[];topics.forEach(t=>nodes.push({id:'t_'+t,type:'topic',label:t,r:14}));filtered.forEach(r=>{const ag=AGENTS[r.agent]||{color:'#888'};nodes.push({id:'r_'+r.id,type:'result',data:r,agent:r.agent,color:ag.color,r:Math.max(4,Math.min(12,(r.score||3)*1.2)),label:r.topic});links.push({source:'r_'+r.id,target:'t_'+r.topic,type:'topic'})});const g=svg.append('g');svg.call(d3.zoom().scaleExtent([.3,5]).on('zoom',e=>g.attr('transform',e.transform)));const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(50)).force('charge',d3.forceManyBody().strength(-60)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide(d=>d.r+2));const link=g.selectAll('.lk').data(links).enter().append('line').attr('stroke','rgba(124,111,205,.15)').attr('stroke-width',.6);const node=g.selectAll('.nd').data(nodes).enter().append('g').attr('cursor','pointer').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));node.append('circle').attr('r',d=>d.r).attr('fill',d=>d.type==='topic'?'rgba(255,255,255,.06)':rgba(d.color,.25)).attr('stroke',d=>d.type==='topic'?'rgba(255,255,255,.15)':rgba(d.color,.5)).attr('stroke-width',d=>d.type==='topic'?1:.6);node.filter(d=>d.type==='topic').append('text').text(d=>(d.label||'').substring(0,14)).attr('text-anchor','middle').attr('dy',d=>d.r+10).attr('fill','#8888a8').attr('font-size','7px');node.on('click',(e,d)=>{if(d.type==='result'&&d.data)showPopup(d.data,e.clientX,e.clientY)});sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`)})}

function showPopup(result,mx,my){const pp=document.getElementById('popup');const ag=AGENTS[result.agent]||{icon:'❓',name:result.agent||'Unknown',color:'#888'};document.getElementById('ppBadge').innerHTML=`${ag.icon} ${ag.name}`;document.getElementById('ppBadge').style.cssText=`background:${rgba(ag.color,.12)};color:${ag.color}`;document.getElementById('ppTitle').textContent=result.topic||'Research Result';document.getElementById('ppDt').textContent=fmtTime(result.created_at);const sc=result.score||0;const scEl=document.getElementById('ppSc');scEl.textContent=`Score: ${sc}/10`;scEl.style.cssText=sc>=7?'background:rgba(34,197,94,.12);color:#22c55e':(sc>=4?'background:rgba(245,158,11,.12);color:#f59e0b':'background:rgba(85,85,112,.12);color:#555570');document.getElementById('ppBody').textContent=result.content||'No content.';document.getElementById('ppTags').innerHTML='';let left=mx+14,top=my-60;if(left+440>window.innerWidth)left=mx-435;if(top+540>window.innerHeight)top=window.innerHeight-540;if(top<50)top=50;if(left<10)left=10;pp.style.left=left+'px';pp.style.top=top+'px';pp.classList.remove('cls');pp.style.display='flex';requestAnimationFrame(()=>pp.classList.add('vis'))}
function closePopup(){const pp=document.getElementById('popup');pp.classList.add('cls');pp.classList.remove('vis');setTimeout(()=>{pp.style.display='none';pp.classList.remove('cls')},220)}

function rgba(hex,a){if(!hex||hex.startsWith('rgba'))return hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function fmtTime(t){if(!t)return'--';try{const d=new Date(t);if(isNaN(d))return t;return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch(e){return t}}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>
