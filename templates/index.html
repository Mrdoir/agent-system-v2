<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f0f17; --panel: #161622; --border: #1e1e2e;
  --purple: #7c6fcd; --teal: #22c55e; --amber: #f59e0b;
  --blue: #3b82f6; --pink: #ec4899; --red: #ef4444;
  --text: #e2e2ef; --text2: #8888a8; --text3: #555570;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; width:100vw; }
.mono { font-family:'JetBrains Mono',monospace; }

/* LOADING SCREEN */
#loadingScreen {
  position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#loadingScreen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.loading-logo { font-size:28px; font-weight:800; letter-spacing:3px; color:var(--text);
  text-shadow:0 0 30px rgba(124,111,205,0.5); margin-bottom:32px; }
.loading-logo span { color:var(--purple); }
.loading-bar-wrap { width:280px; height:3px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:16px; }
.loading-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--purple),var(--pink));
  border-radius:4px; transition:width 0.6s ease; }
.loading-status { font-size:11px; color:var(--text3); letter-spacing:2px; text-transform:uppercase; }

/* TOPBAR */
#topbar {
  position:fixed; top:0; left:0; right:0; height:46px; background:var(--panel);
  border-bottom:1px solid var(--border); z-index:100;
  display:flex; align-items:center; padding:0 16px; gap:12px;
}
.topbar-logo { font-weight:800; font-size:13px; letter-spacing:2px; color:var(--text3); white-space:nowrap; flex-shrink:0; }
.topbar-logo span { color:var(--purple); }
.topbar-center { display:flex; gap:8px; flex:1; justify-content:center; }
.stat-card {
  display:flex; align-items:center; gap:6px; padding:4px 12px;
  background:rgba(255,255,255,0.03); border:1px solid var(--border);
  border-radius:6px; font-size:11px; white-space:nowrap;
}
.stat-card .stat-val { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; }
.stat-card .stat-lbl { color:var(--text3); font-size:9px; text-transform:uppercase; letter-spacing:1px; }
.topbar-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.view-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.view-btn {
  padding:4px 10px; font-size:10px; font-weight:600; letter-spacing:1px;
  background:transparent; color:var(--text3); border:none; cursor:pointer;
  transition:all .2s;
}
.view-btn.active { background:var(--purple); color:#fff; }
.live-dot { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--teal); font-weight:600; }
.live-dot::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--teal);
  box-shadow:0 0 8px var(--teal); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.topbar-btn {
  padding:4px 10px; font-size:10px; font-weight:600; letter-spacing:0.5px;
  background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--border);
  border-radius:6px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:4px;
}
.topbar-btn:hover { background:rgba(124,111,205,0.15); border-color:var(--purple); }
.topbar-btn.primary { background:var(--purple); border-color:var(--purple); color:#fff; }
.topbar-btn.primary:hover { background:#6b5ebc; }

/* SIDEBAR */
#sidebar {
  position:fixed; top:46px; right:0; width:260px; bottom:30px;
  background:var(--panel); border-left:1px solid var(--border); z-index:90;
  display:flex; flex-direction:column;
}
.sidebar-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
.sidebar-tab {
  flex:1; padding:8px 0; text-align:center; font-size:10px; font-weight:600;
  letter-spacing:1px; text-transform:uppercase; color:var(--text3);
  cursor:pointer; border-bottom:2px solid transparent; transition:all .2s;
}
.sidebar-tab.active { color:var(--purple); border-bottom-color:var(--purple); }
.sidebar-content { flex:1; overflow-y:auto; padding:8px; }
.sidebar-content::-webkit-scrollbar { width:4px; }
.sidebar-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* Agent Cards */
.agent-card {
  padding:10px; margin-bottom:6px; background:rgba(255,255,255,0.02);
  border:1px solid var(--border); border-radius:8px; cursor:pointer;
  transition:all .25s;
}
.agent-card:hover { background:rgba(255,255,255,0.04); }
.agent-card.active-agent { border-color:color-mix(in srgb, var(--agent-color) 40%, transparent); }
.agent-card-header { display:flex; align-items:center; gap:8px; }
.agent-icon { font-size:18px; }
.agent-info { flex:1; }
.agent-name { font-size:12px; font-weight:700; }
.agent-model { font-size:9px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.agent-status {
  font-size:8px; font-weight:700; letter-spacing:1px; padding:2px 6px;
  border-radius:4px; text-transform:uppercase;
}
.agent-status.live { background:rgba(34,197,94,0.15); color:var(--teal); }
.agent-status.limited { background:rgba(245,158,11,0.15); color:var(--amber); }
.agent-status.offline { background:rgba(85,85,112,0.15); color:var(--text3); }
.agent-expand {
  max-height:0; overflow:hidden; transition:max-height .3s ease;
}
.agent-card.expanded .agent-expand { max-height:120px; }
.agent-expand-inner { padding-top:8px; margin-top:8px; border-top:1px solid var(--border); font-size:10px; color:var(--text2); }
.agent-expand-inner .detail-row { display:flex; justify-content:space-between; margin-bottom:3px; }
.agent-expand-inner .detail-label { color:var(--text3); }

/* Activity Feed */
.activity-item { display:flex; gap:8px; padding:8px 4px; border-bottom:1px solid rgba(30,30,46,0.5); align-items:flex-start; }
.activity-dot { width:6px; height:6px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.activity-text { font-size:11px; line-height:1.4; flex:1; }
.activity-text strong { font-weight:600; }
.activity-time { font-size:9px; color:var(--text3); font-family:'JetBrains Mono',monospace; margin-top:2px; }

/* Insight Cards */
.insight-card {
  padding:10px; margin-bottom:6px; background:rgba(255,255,255,0.02);
  border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all .2s;
}
.insight-card:hover { background:rgba(255,255,255,0.04); }
.insight-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.novelty-badge {
  font-size:8px; font-weight:700; padding:2px 6px; border-radius:4px;
  letter-spacing:0.5px; text-transform:uppercase;
}
.novelty-hi { background:rgba(34,197,94,0.15); color:var(--teal); }
.novelty-mi { background:rgba(245,158,11,0.15); color:var(--amber); }
.novelty-lo { background:rgba(85,85,112,0.15); color:var(--text3); }
.insight-date { font-size:9px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.insight-text { font-size:11px; color:var(--text2); line-height:1.5; display:-webkit-box;
  -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

/* CANVAS / GRAPH AREA */
#canvasWrap {
  position:fixed; top:46px; left:0; right:260px; bottom:30px;
  background:var(--bg); overflow:hidden;
}
#mainCanvas { display:block; width:100%; height:100%; }
#graphView { position:absolute; inset:0; display:none; }
#graphView svg { width:100%; height:100%; }
#graphSearch {
  position:absolute; top:12px; left:12px; padding:6px 12px;
  background:var(--panel); border:1px solid var(--border); border-radius:6px;
  color:var(--text); font-size:11px; font-family:'Inter',sans-serif;
  outline:none; width:200px; transition:border-color .2s;
}
#graphSearch:focus { border-color:var(--purple); }

/* BOTTOM BAR */
#bottomBar {
  position:fixed; bottom:0; left:0; right:0; height:30px;
  background:var(--panel); border-top:1px solid var(--border); z-index:100;
  display:flex; align-items:center; padding:0 12px; gap:6px;
}
.filter-label { font-size:9px; color:var(--text3); font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-right:4px; }
.filter-btn {
  padding:2px 8px; font-size:9px; font-weight:600; letter-spacing:0.5px;
  background:transparent; color:var(--text3); border:1px solid transparent;
  border-radius:4px; cursor:pointer; transition:all .2s;
}
.filter-btn:hover { color:var(--text); }
.filter-btn.active { background:rgba(124,111,205,0.15); color:var(--purple); border-color:rgba(124,111,205,0.3); }
.bubble-count { margin-left:auto; font-size:9px; color:var(--text3); font-family:'JetBrains Mono',monospace; }

/* POPUP */
#popup {
  position:fixed; z-index:200; width:380px; max-height:480px;
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(124,111,205,0.1);
  display:none; opacity:0; transform:scale(0.92);
  transition:opacity .25s ease, transform .25s ease;
  overflow:hidden; flex-direction:column;
}
#popup.visible { display:flex; opacity:1; transform:scale(1); }
#popup.closing { opacity:0; transform:scale(0.92); }
.popup-header { padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
.popup-agent-badge {
  display:inline-flex; align-items:center; gap:4px; padding:3px 10px;
  border-radius:20px; font-size:10px; font-weight:700;
}
.popup-close {
  width:26px; height:26px; border-radius:6px; border:1px solid var(--border);
  background:rgba(255,255,255,0.05); color:var(--text2); font-size:14px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .2s; line-height:1; flex-shrink:0;
}
.popup-close:hover { background:var(--red); color:#fff; border-color:var(--red); }
.popup-title { padding:0 16px 8px; font-size:16px; font-weight:700; line-height:1.3; }
.popup-meta { padding:0 16px 10px; display:flex; gap:8px; align-items:center; }
.popup-date { font-size:10px; color:var(--text3); font-family:'JetBrains Mono',monospace; }
.popup-score {
  font-size:9px; font-weight:700; padding:2px 8px; border-radius:4px;
  background:rgba(124,111,205,0.15); color:var(--purple);
}
.popup-content {
  padding:0 16px 12px; flex:1; overflow-y:auto; font-size:12px;
  line-height:1.7; color:var(--text2);
}
.popup-content::-webkit-scrollbar { width:3px; }
.popup-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.popup-tags { padding:8px 16px 14px; display:flex; flex-wrap:wrap; gap:4px; flex-shrink:0; border-top:1px solid var(--border); }
.popup-tag {
  font-size:9px; padding:2px 8px; border-radius:4px;
  background:rgba(255,255,255,0.05); color:var(--text2);
}

/* MODAL */
#modalOverlay {
  position:fixed; inset:0; z-index:300; background:rgba(15,15,23,0.8);
  backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center;
  opacity:0; transition:opacity .3s;
}
#modalOverlay.visible { display:flex; opacity:1; }
#addAgentModal {
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:24px; width:400px; max-width:90vw;
  transform:translateY(20px); transition:transform .3s;
}
#modalOverlay.visible #addAgentModal { transform:translateY(0); }
.modal-title { font-size:16px; font-weight:700; margin-bottom:16px; }
.modal-field { margin-bottom:12px; }
.modal-field label { display:block; font-size:10px; font-weight:600; letter-spacing:1px;
  text-transform:uppercase; color:var(--text3); margin-bottom:4px; }
.modal-field input, .modal-field select {
  width:100%; padding:8px 12px; background:rgba(255,255,255,0.04);
  border:1px solid var(--border); border-radius:8px; color:var(--text);
  font-size:12px; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s;
}
.modal-field input:focus, .modal-field select:focus { border-color:var(--purple); }
.modal-field select option { background:var(--panel); }
.color-swatches { display:flex; gap:8px; }
.color-swatch {
  width:28px; height:28px; border-radius:8px; cursor:pointer;
  border:2px solid transparent; transition:all .2s;
}
.color-swatch.selected { border-color:#fff; transform:scale(1.15); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal-actions button {
  padding:8px 20px; border-radius:8px; font-size:12px; font-weight:600;
  cursor:pointer; transition:all .2s; border:1px solid var(--border);
}
.modal-cancel { background:transparent; color:var(--text2); }
.modal-cancel:hover { color:var(--text); }
.modal-save { background:var(--purple); color:#fff; border-color:var(--purple); }
.modal-save:hover { background:#6b5ebc; }

/* Animations */
@keyframes fadeInUp { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }
@keyframes glow { 0%,100%{box-shadow:0 0 5px currentColor}50%{box-shadow:0 0 15px currentColor} }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <div class="loading-logo">// <span>AGENT RESEARCH HUB</span></div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar"></div></div>
  <div class="loading-status" id="loadingStatus">INITIALIZING</div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="topbar-logo">// <span>AGENT RESEARCH HUB</span></div>
  <div class="topbar-center">
    <div class="stat-card">
      <div><div class="stat-val mono" id="statResults" style="color:var(--purple)">—</div><div class="stat-lbl">Results</div></div>
    </div>
    <div class="stat-card">
      <div><div class="stat-val mono" id="statActive" style="color:var(--teal)">—</div><div class="stat-lbl">Active</div></div>
    </div>
    <div class="stat-card">
      <div><div class="stat-val mono" id="statTopics" style="color:var(--amber)">—</div><div class="stat-lbl">Topics</div></div>
    </div>
    <div class="stat-card">
      <div><div class="stat-val mono" id="statClock" style="color:var(--blue)">00:00:00</div><div class="stat-lbl">Uptime</div></div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-btn active" data-view="robots" onclick="switchView('robots')">ROBOTS</button>
      <button class="view-btn" data-view="graph" onclick="switchView('graph')">GRAPH</button>
    </div>
    <div class="live-dot">LIVE</div>
    <button class="topbar-btn" onclick="exportData()">↓ EXPORT</button>
    <button class="topbar-btn primary" onclick="openAddAgent()">+ ADD AGENT</button>
  </div>
</div>

<!-- MAIN CANVAS AREA -->
<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
  <div id="graphView">
    <input id="graphSearch" type="text" placeholder="Search topics..." oninput="filterGraph(this.value)">
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-tabs">
    <div class="sidebar-tab active" data-tab="agents" onclick="switchTab('agents')">Agents</div>
    <div class="sidebar-tab" data-tab="activity" onclick="switchTab('activity')">Activity</div>
    <div class="sidebar-tab" data-tab="insights" onclick="switchTab('insights')">Insights</div>
  </div>
  <div class="sidebar-content" id="sidebarContent"></div>
</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <span class="filter-label">Filter</span>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
  <span class="bubble-count" id="bubbleCount">0 bubbles</span>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-header">
    <div class="popup-agent-badge" id="popupBadge"></div>
    <button class="popup-close" id="popupCloseBtn" onclick="closePopup()">✕</button>
  </div>
  <div class="popup-title" id="popupTitle"></div>
  <div class="popup-meta">
    <span class="popup-date" id="popupDate"></span>
    <span class="popup-score" id="popupScore"></span>
  </div>
  <div class="popup-content" id="popupContent"></div>
  <div class="popup-tags" id="popupTags"></div>
</div>

<!-- ADD AGENT MODAL -->
<div id="modalOverlay" onclick="closeModal(event)">
  <div id="addAgentModal" onclick="event.stopPropagation()">
    <div class="modal-title">+ Add New Agent</div>
    <div class="modal-field">
      <label>Agent Name</label>
      <input type="text" id="newAgentName" placeholder="e.g. web_crawler">
    </div>
    <div class="modal-field">
      <label>Research Focus</label>
      <input type="text" id="newAgentFocus" placeholder="e.g. Competitive Analysis">
    </div>
    <div class="modal-field">
      <label>Provider</label>
      <select id="newAgentProvider">
        <option>OpenAI GPT-4</option><option>Anthropic Claude</option>
        <option>Google Gemini</option><option>Mistral</option><option>Local LLM</option>
      </select>
    </div>
    <div class="modal-field">
      <label>API Key</label>
      <input type="password" id="newAgentKey" placeholder="sk-...">
    </div>
    <div class="modal-field">
      <label>Color</label>
      <div class="color-swatches" id="colorSwatches"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>

<script>
// ====================== CONSTANTS & STATE ======================
const AGENTS_DEF = {
  market_scout:  { name:'Scout',   icon:'🔍', color:'#3b82f6', model:'GPT-4 Turbo', provider:'OpenAI', fallback:['Claude 3','Gemini Pro'] },
  trend_analyst: { name:'Analyst', icon:'📈', color:'#22c55e', model:'Claude 3 Opus', provider:'Anthropic', fallback:['GPT-4','Gemini Pro'] },
  deep_diver:    { name:'Diver',   icon:'🧠', color:'#7c6fcd', model:'GPT-4 Turbo', provider:'OpenAI', fallback:['Claude 3','Mistral'] },
  critic:        { name:'Critic',  icon:'⚡', color:'#ef4444', model:'Claude 3 Opus', provider:'Anthropic', fallback:['GPT-4','Gemini Pro'] },
  memory:        { name:'Memory',  icon:'💾', color:'#f59e0b', model:'Gemini 1.5 Pro', provider:'Google', fallback:['GPT-4','Claude 3'] },
  synthesis:     { name:'Synth',   icon:'✨', color:'#ec4899', model:'GPT-4 Turbo', provider:'OpenAI', fallback:['Claude 3','Gemini Pro'] },
};
const PIPELINE = [
  ['market_scout','trend_analyst'],['trend_analyst','deep_diver'],
  ['deep_diver','critic'],['critic','memory'],['memory','market_scout'],['critic','synthesis']
];
const SWATCH_COLORS = ['#3b82f6','#22c55e','#7c6fcd','#ef4444','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#f97316','#14b8a6'];

let state = {
  stats: null, results: [], insights: [], currentView: 'robots',
  activeFilter: 'all', activeTab: 'agents', customAgents: [],
  selectedSwatchColor: SWATCH_COLORS[0], clockStart: Date.now(),
};
let bubbles = [], robots = {}, particles = [], messagePackets = [];
let canvas, ctx, canvasW, canvasH;
let graphSvg, graphSim;
let activityFeed = [];

// ====================== LOADING SEQUENCE ======================
(function runLoading(){
  const bar = document.getElementById('loadingBar');
  const status = document.getElementById('loadingStatus');
  const steps = [
    {pct:15, text:'INITIALIZING', delay:0},
    {pct:40, text:'LOADING DATA', delay:600},
    {pct:70, text:'STARTING PIPELINE', delay:1200},
    {pct:100, text:'ONLINE', delay:1800},
  ];
  steps.forEach(s=>{
    setTimeout(()=>{ bar.style.width=s.pct+'%'; status.textContent=s.text; }, s.delay);
  });
  setTimeout(()=>{
    document.getElementById('loadingScreen').classList.add('hidden');
    init();
  }, 2600);
})();

// ====================== INIT ======================
function init(){
  setupCanvas();
  setupFilterButtons();
  setupColorSwatches();
  initRobots();
  fetchAll();
  setInterval(fetchStats, 5000);
  setInterval(fetchResults, 10000);
  setInterval(fetchInsights, 15000);
  setInterval(updateClock, 1000);
  requestAnimationFrame(renderLoop);
  renderSidebar();
  window.addEventListener('resize', ()=>{ resizeCanvas(); if(state.currentView==='graph') rebuildGraph(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closePopup(); closeModal(); }});
}

// ====================== API FETCHING ======================
async function fetchStats(){
  try {
    const r = await fetch('/api/stats');
    if(!r.ok) throw new Error();
    state.stats = await r.json();
    updateTopbar();
    renderSidebar();
  } catch(e){ /* endpoint unavailable */ }
}
async function fetchResults(){
  try {
    const r = await fetch('/api/results');
    if(!r.ok) throw new Error();
    const data = await r.json();
    if(data.length !== state.results.length){
      const newOnes = data.filter(d => !state.results.find(x=>x.id===d.id));
      newOnes.forEach(n=>addActivity(n.agent, `completed research: ${n.topic}`, n.created_at));
      state.results = data;
      seedBubbles();
      if(state.currentView==='graph') rebuildGraph();
    }
  } catch(e){ /* endpoint unavailable */ }
}
async function fetchInsights(){
  try {
    const r = await fetch('/api/insights');

function renderActivityTab(){

  return activityFeed.slice(-50).reverse().map(a=>{

// ====================== CANVAS SETUP ======================
function setupCanvas(){
  canvas = document.getElementById('mainCanvas');

  resizeCanvas();
}
function resizeCanvas(){
  const wrap = document.getElementById('canvasWrap');
  canvasW = wrap.clientWidth; canvasH = wrap.clientHeight;
  canvas.width = canvasW * devicePixelRatio;
  canvas.height = canvasH * devicePixelRatio;
  canvas.style.width = canvasW+'px';
  canvas.style.height = canvasH+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  repositionRobots();
}

// ====================== ROBOTS ======================
function initRobots(){
  const keys = Object.keys(AGENTS_DEF);
  const positions = [
    {xr:0.12,yr:0.35},{xr:0.30,yr:0.55},{xr:0.50,yr:0.30},
    {xr:0.68,yr:0.60},{xr:0.85,yr:0.40},{xr:0.50,yr:0.72}
  ];
  keys.forEach((key,i)=>{
    const pos = positions[i] || {xr:0.15+Math.random()*0.7, yr:0.25+Math.random()*0.5};
    robots[key] = {
      key, def:AGENTS_DEF[key], xr:pos.xr, yr:pos.yr,
      x:0, y:0, phase:Math.random()*Math.PI*2, armPhase:Math.random()*Math.PI*2,
    };
  });
  repositionRobots();
}
function repositionRobots(){
  Object.values(robots).forEach(r=>{
    r.x = r.xr * canvasW; r.y = r.yr * canvasH;
  });
}
function addCustomRobot(key, def){
  const xr = 0.15+Math.random()*0.7, yr = 0.25+Math.random()*0.5;
  robots[key] = {key, def, xr, yr, x:xr*canvasW, y:yr*canvasH, phase:Math.random()*Math.PI*2, armPhase:Math.random()*Math.PI*2};
}

// ====================== BUBBLES ======================
function seedBubbles(){
  bubbles = [];
  const grouped = {};
  state.results.forEach(r=>{
    if(!grouped[r.agent]) grouped[r.agent]=[];
    grouped[r.agent].push(r);
  });
  Object.entries(grouped).forEach(([agent, results])=>{
    const capped = results.slice(0, 22);
    const rob = robots[agent];
    capped.forEach(r=>{
      const angle = Math.random()*Math.PI*2;
      const dist = 60+Math.random()*100;
      const bx = rob?(rob.x+Math.cos(angle)*dist):(Math.random()*canvasW);
      const by = rob?(rob.y+Math.sin(angle)*dist):(Math.random()*canvasH);
      bubbles.push({
        result:r, agent:r.agent, x:clampX(bx), y:clampY(by),
        vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
        radius: Math.max(7, Math.min(20, (r.score||5)*2)),
        color: AGENTS_DEF[agent]?.color || '#888',
      });
    });
  });
  updateBubbleCount();
}
function clampX(x){ return Math.max(25, Math.min(canvasW-25, x)); }
function clampY(y){ return Math.max(25, Math.min(canvasH-25, y)); }

// ====================== PARTICLES & MESSAGE PACKETS ======================
function spawnParticles(){
  if(Math.random()>0.03) return;
  const activeLinks = PIPELINE.filter(([a])=>{
    const s = state.stats?.agents?.[a]; return s && s.status==='active';
  });
  if(!activeLinks.length) return;
  const link = activeLinks[Math.floor(Math.random()*activeLinks.length)];
  const rA=robots[link[0]], rB=robots[link[1]];
  if(!rA||!rB) return;
  particles.push({ox:rA.x, oy:rA.y, tx:rB.x, ty:rB.y, t:0, speed:0.008+Math.random()*0.008,
    color:rA.def.color });
}
function spawnMessagePacket(){
  if(Math.random()>0.008) return;
  const activeLinks = PIPELINE.filter(([a])=>{
    const s = state.stats?.agents?.[a]; return s && s.status==='active';
  });
  if(!activeLinks.length) return;
  const link = activeLinks[Math.floor(Math.random()*activeLinks.length)];
  const rA=robots[link[0]], rB=robots[link[1]];
  if(!rA||!rB) return;
  messagePackets.push({ox:rA.x,oy:rA.y,tx:rB.x,ty:rB.y,t:0,speed:0.012+Math.random()*0.006,
    color:rA.def.color,trail:[]});
}

// ====================== CANVAS RENDER LOOP ======================
let lastTime = 0;
function renderLoop(ts){
  const dt = Math.min((ts-lastTime)/16.67, 3); lastTime=ts;
  if(state.currentView==='robots') drawRobotsView(dt, ts);
  requestAnimationFrame(renderLoop);
}

function drawRobotsView(dt, ts){
  ctx.clearRect(0,0,canvasW,canvasH);
  drawGridDots();
  drawPipelineLines(ts);
  updateAndDrawParticles(dt);
  updateAndDrawPackets(dt);
  drawConnectionLines();
  const filtered = state.activeFilter==='all'?bubbles:bubbles.filter(b=>b.agent===state.activeFilter);
  updateAndDrawBubbles(filtered, dt);
  drawRobots(ts);
}

function drawGridDots(){
  ctx.fillStyle='rgba(30,30,46,0.6)';
  const sp=30;
  for(let x=sp;x<canvasW;x+=sp) for(let y=sp;y<canvasH;y+=sp){
    ctx.fillRect(x,y,1,1);
  }
}

function drawPipelineLines(ts){
  PIPELINE.forEach(([a,b])=>{
    const rA=robots[a], rB=robots[b];
    if(!rA||!rB) return;
    const isActive = state.stats?.agents?.[a]?.status==='active';
    ctx.beginPath();
    ctx.moveTo(rA.x, rA.y); ctx.lineTo(rB.x, rB.y);
    ctx.strokeStyle = isActive ? 'rgba(124,111,205,0.15)' : 'rgba(30,30,46,0.5)';
    ctx.lineWidth = 1; ctx.setLineDash([4,6]); ctx.stroke(); ctx.setLineDash([]);
  });
}

function updateAndDrawParticles(dt){
  spawnParticles();
  particles = particles.filter(p=>{
    p.t += p.speed*dt;
    if(p.t>=1) return false;
    const px = lerp(p.ox, p.tx, p.t);
    const py = lerp(p.oy, p.ty, p.t);
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.globalAlpha=0.6*(1-p.t); ctx.fill(); ctx.globalAlpha=1;
    return true;
  });
}

function updateAndDrawPackets(dt){
  spawnMessagePacket();
  messagePackets = messagePackets.filter(p=>{
    p.t += p.speed*dt;
    if(p.t>=1) return false;
    const px = lerp(p.ox, p.tx, p.t);
    const py = lerp(p.oy, p.ty, p.t);
    p.trail.push({x:px,y:py,a:1});
    if(p.trail.length>12) p.trail.shift();
    p.trail.forEach((tr,i)=>{
      tr.a *= 0.88;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = tr.a*0.5;
      ctx.fillRect(tr.x-3, tr.y-1.5, 6, 3);
    });
    ctx.globalAlpha=0.9;
    ctx.fillStyle = p.color;
    ctx.fillRect(px-4, py-2, 8, 4);
    ctx.globalAlpha=1;
    return true;
  });
}

function drawConnectionLines(){
  const filtered = state.activeFilter==='all'?bubbles:bubbles.filter(b=>b.agent===state.activeFilter);
  // Same-agent clusters
  const byAgent = {};
  filtered.forEach(b=>{ if(!byAgent[b.agent]) byAgent[b.agent]=[]; byAgent[b.agent].push(b); });
  Object.values(byAgent).forEach(group=>{
    for(let i=0;i<group.length;i++) for(let j=i+1;j<group.length;j++){
      const d = dist(group[i],group[j]);
      if(d<120){
        ctx.beginPath(); ctx.moveTo(group[i].x,group[i].y); ctx.lineTo(group[j].x,group[j].y);
        ctx.strokeStyle='rgba(124,111,205,0.06)'; ctx.lineWidth=0.5;
        ctx.setLineDash([2,4]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  });
  // Cross-agent same topic
  const byTopic = {};
  filtered.forEach(b=>{ const t=b.result.topic; if(!byTopic[t]) byTopic[t]=[]; byTopic[t].push(b); });
  Object.values(byTopic).forEach(group=>{
    if(group.length<2) return;
    for(let i=0;i<group.length;i++) for(let j=i+1;j<group.length;j++){
      if(group[i].agent===group[j].agent) continue;
      const mx=(group[i].x+group[j].x)/2, my=(group[i].y+group[j].y)/2;
      ctx.beginPath(); ctx.moveTo(group[i].x,group[i].y); ctx.lineTo(group[j].x,group[j].y);
      ctx.strokeStyle='rgba(124,111,205,0.12)'; ctx.lineWidth=0.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(mx,my,2,0,Math.PI*2);
      ctx.fillStyle='rgba(124,111,205,0.3)'; ctx.fill();
    }
  });
}

function updateAndDrawBubbles(filtered, dt){
  filtered.forEach(b=>{
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x-b.radius<0){ b.x=b.radius; b.vx=Math.abs(b.vx); }
    if(b.x+b.radius>canvasW){ b.x=canvasW-b.radius; b.vx=-Math.abs(b.vx); }
    if(b.y-b.radius<0){ b.y=b.radius; b.vy=Math.abs(b.vy); }
    if(b.y+b.radius>canvasH){ b.y=canvasH-b.radius; b.vy=-Math.abs(b.vy); }
    // glow
    const grd = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.radius*2.5);
    grd.addColorStop(0, hexToRgba(b.color,0.12));
    grd.addColorStop(1, hexToRgba(b.color,0));
    ctx.beginPath(); ctx.arc(b.x,b.y,b.radius*2.5,0,Math.PI*2);
    ctx.fillStyle=grd; ctx.fill();
    // main
    ctx.beginPath(); ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
    ctx.fillStyle=hexToRgba(b.color,0.25);
    ctx.strokeStyle=hexToRgba(b.color,0.6); ctx.lineWidth=1;
    ctx.fill(); ctx.stroke();
    // inner dot
    ctx.beginPath(); ctx.arc(b.x,b.y,2,0,Math.PI*2);
    ctx.fillStyle=hexToRgba(b.color,0.8); ctx.fill();
  });
}

function drawRobots(ts){
  Object.values(robots).forEach(r=>{
    const agentStatus = state.stats?.agents?.[r.key]?.status;
    const isActive = agentStatus==='active';
    const opacity = isActive ? 1 : 0.35;
    const bob = isActive ? Math.sin(ts/600+r.phase)*3 : 0;
    const armSwing = isActive ? Math.sin(ts/300+r.armPhase)*8 : 0;
    const legSwing = isActive ? Math.sin(ts/250+r.armPhase)*6 : 0;
    const cx=r.x, cy=r.y+bob;
    const col = r.def.color;

    ctx.save();
    ctx.globalAlpha = opacity;

    // Halo glow for active
    if(isActive){
      const halo = ctx.createRadialGradient(cx,cy-10,0,cx,cy-10,45);
      halo.addColorStop(0, hexToRgba(col,0.08));
      halo.addColorStop(1, hexToRgba(col,0));
      ctx.beginPath(); ctx.arc(cx,cy-10,45,0,Math.PI*2);
      ctx.fillStyle=halo; ctx.fill();
    }

    // Platform
    ctx.fillStyle = hexToRgba(col, 0.15);
    ctx.beginPath();
    ctx.ellipse(cx, cy+26, 22, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // Legs
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx-5, cy+14); ctx.lineTo(cx-5-legSwing*0.3, cy+24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+5, cy+14); ctx.lineTo(cx+5+legSwing*0.3, cy+24); ctx.stroke();

    // Body
    ctx.fillStyle = hexToRgba(col, 0.3);
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    roundRect(ctx, cx-12, cy-4, 24, 20, 4);
    ctx.fill(); ctx.stroke();

    // Arms
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-12, cy+2);
    ctx.lineTo(cx-18, cy+2+armSwing*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+12, cy+2);
    ctx.lineTo(cx+18, cy+2-armSwing*0.5); ctx.stroke();

    // Head
    ctx.fillStyle = hexToRgba(col, 0.4);
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    roundRect(ctx, cx-10, cy-20, 20, 17, 4);
    ctx.fill(); ctx.stroke();

    // Eyes
    const eyeGlow = isActive ? 0.9 : 0.3;
    ctx.fillStyle = hexToRgba('#ffffff', eyeGlow);
    ctx.shadowColor = col; ctx.shadowBlur = isActive?8:0;
    ctx.beginPath(); ctx.arc(cx-4, cy-12, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4, cy-12, 2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // Antenna
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy-20); ctx.lineTo(cx, cy-28); ctx.stroke();
    const antPulse = isActive ? 0.5+0.5*Math.sin(ts/200+r.phase) : 0.3;
    ctx.beginPath(); ctx.arc(cx, cy-28, 3, 0, Math.PI*2);
    ctx.fillStyle = hexToRgba(col, antPulse); ctx.fill();
    if(isActive){ ctx.shadowColor=col; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(cx,cy-28,2,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
      ctx.shadowBlur=0; }

    // Name label
    ctx.globalAlpha = opacity*0.9;
    ctx.fillStyle = col;
    ctx.font = '600 10px "JetBrains Mono"';
    ctx.textAlign = 'center';
    ctx.fillText(r.def.name.toUpperCase(), cx, cy+38);

    ctx.restore();
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Canvas click

// ====================== D3 GRAPH VIEW ======================
function rebuildGraph(){
  const container = document.getElementById('graphView');
  container.querySelectorAll('svg').forEach(s=>s.remove());
  const width = container.clientWidth, height = container.clientHeight;
  const svg = d3.select(container).append('svg').attr('width',width).attr('height',height);
  graphSvg = svg;

  // Grid dots background
  const defs = svg.append('defs');
  const pat = defs.append('pattern').attr('id','gridDots').attr('width',30).attr('height',30).attr('patternUnits','userSpaceOnUse');
  pat.append('circle').attr('cx',15).attr('cy',15).attr('r',0.5).attr('fill','rgba(30,30,46,0.8)');
  svg.append('rect').attr('width',width).attr('height',height).attr('fill','url(#gridDots)');

  const filtered = state.activeFilter==='all' ? state.results : state.results.filter(r=>r.agent===state.activeFilter);
  const searchVal = document.getElementById('graphSearch').value.toLowerCase();
  const visible = searchVal ? filtered.filter(r=>(r.topic||'').toLowerCase().includes(searchVal)) : filtered;

  if(!visible.length){
    svg.append('text').attr('x',width/2).attr('y',height/2)
      .attr('text-anchor','middle').attr('fill','#555570').attr('font-size','12px')
      .text('No results to display');
    return;
  }

  // Build nodes & links
  const topics = [...new Set(visible.map(r=>r.topic))];
  const nodes = [];
  const links = [];

  topics.forEach(t=>{
    nodes.push({id:'topic_'+t, type:'topic', label:t, r:18});
  });
  visible.forEach(r=>{
    const agDef = AGENTS_DEF[r.agent]||{color:'#888'};
    const radius = Math.max(5, Math.min(14, (r.score||5)*1.5));
    nodes.push({id:'res_'+r.id, type:'result', data:r, agent:r.agent,
      color:agDef.color, r:radius, label:r.topic});
    links.push({source:'res_'+r.id, target:'topic_'+r.topic, type:'topic'});
  });

  // Agent cluster links
  const byAgent = {};
  visible.forEach(r=>{ if(!byAgent[r.agent]) byAgent[r.agent]=[]; byAgent[r.agent].push(r); });
  Object.values(byAgent).forEach(group=>{
    for(let i=0;i<group.length-1;i++){
      links.push({source:'res_'+group[i].id, target:'res_'+group[i+1].id, type:'agent'});
    }
  });

  const g = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.3,4]).on('zoom', e=>g.attr('transform',e.transform));
  svg.call(zoom);

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(60))
    .force('charge', d3.forceManyBody().strength(-80))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide(d=>d.r+4));
  graphSim = sim;

  const link = g.selectAll('.link').data(links).enter().append('line')
    .attr('stroke', d=>d.type==='topic'?'rgba(124,111,205,0.2)':'rgba(124,111,205,0.08)')
    .attr('stroke-width', d=>d.type==='topic'?1:0.5)
    .attr('stroke-dasharray', d=>d.type==='agent'?'2,4':'none');

  const node = g.selectAll('.node').data(nodes).enter().append('g')
    .attr('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

  node.append('circle')
    .attr('r', d=>d.r)
    .attr('fill', d=>d.type==='topic'?'rgba(255,255,255,0.08)':(hexToRgba(d.color,0.3)))
    .attr('stroke', d=>d.type==='topic'?'rgba(255,255,255,0.2)':hexToRgba(d.color,0.7))
    .attr('stroke-width', d=>d.type==='topic'?1.5:1);

  // Topic labels
  node.filter(d=>d.type==='topic').append('text')
    .text(d=>d.label?.substring(0,12)|| '')
    .attr('text-anchor','middle').attr('dy',d=>d.r+12)
    .attr('fill','#8888a8').attr('font-size','8px').attr('font-family','Inter');

  node.on('click', (e,d)=>{
    if(d.type==='result' && d.data){
      showPopup(d.data, e.clientX, e.clientY);
    }
  });

  sim.on('tick', ()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform', d=>`translate(${d.x},${d.y})`);
  });
}

function filterGraph(val){
  rebuildGraph();
}

// ====================== POPUP ======================
function showPopup(result, mx, my){
  const popup = document.getElementById('popup');
  const agDef = AGENTS_DEF[result.agent]||{icon:'❓',name:result.agent,color:'#888'};

  document.getElementById('popupBadge').innerHTML = `${agDef.icon} ${agDef.name}`;
  document.getElementById('popupBadge').style.background = hexToRgba(agDef.color, 0.15);
  document.getElementById('popupBadge').style.color = agDef.color;
  document.getElementById('popupTitle').textContent = result.topic || 'Research Result';
  document.getElementById('popupDate').textContent = formatTime(result.created_at);
  document.getElementById('popupScore').textContent = `Score: ${typeof result.score==='number' ? result.score.toFixed(1) : (result.score||'N/A')}`;
  document.getElementById('popupContent').textContent = result.content || 'No content available.';

  const tagsEl = document.getElementById('popupTags');
  tagsEl.innerHTML = (result.tags||[]).map(t=>`<span class="popup-tag">${escHtml(t)}</span>`).join('');

  // Position near click, keep on screen
  let left = mx + 15, top = my - 60;
  if(left + 400 > window.innerWidth) left = mx - 395;
  if(top + 500 > window.innerHeight) top = window.innerHeight - 500;
  if(top < 50) top = 50;
  if(left < 10) left = 10;
  popup.style.left = left+'px';
  popup.style.top = top+'px';

  popup.classList.remove('closing');
  popup.style.display = 'flex';
  requestAnimationFrame(()=>{ popup.classList.add('visible'); });
}

function closePopup(){
  const popup = document.getElementById('popup');
  popup.classList.add('closing');
  popup.classList.remove('visible');
  setTimeout(()=>{
    popup.style.display = 'none';
    popup.classList.remove('closing');
  }, 260);
}

// ====================== ADD AGENT MODAL ======================
function setupColorSwatches(){
  const wrap = document.getElementById('colorSwatches');
  SWATCH_COLORS.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c===state.selectedSwatchColor?' selected':'');
    s.style.background = c;
    s.onclick = ()=>{
      document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('selected'));
      s.classList.add('selected');
      state.selectedSwatchColor = c;
    };
    wrap.appendChild(s);
  });
}
function openAddAgent(){
  const modal = document.getElementById('modalOverlay');
  modal.style.display = 'flex';
  requestAnimationFrame(()=>modal.classList.add('visible'));
}
function closeModal(e){
  if(e && e.target && e.target!==document.getElementById('modalOverlay')) return;
  const modal = document.getElementById('modalOverlay');
  modal.classList.remove('visible');
  setTimeout(()=>{ modal.style.display='none'; }, 300);
}
function saveAgent(){
  const name = document.getElementById('newAgentName').value.trim();
  const focus = document.getElementById('newAgentFocus').value.trim();
  const provider = document.getElementById('newAgentProvider').value;
  if(!name) return;
  const key = name.toLowerCase().replace(/[^a-z0-9]/g,'_');
  const def = {
    name: name.charAt(0).toUpperCase()+name.slice(1),
    icon: '🤖', color: state.selectedSwatchColor,
    model: provider, provider: provider.split(' ')[0],
    fallback: [], key
  };
  state.customAgents.push({...def, key});
  AGENTS_DEF[key] = def;
  addCustomRobot(key, def);

  // Add filter button
  const bar = document.getElementById('bottomBar');
  const btn = document.createElement('button');
  btn.className='filter-btn'; btn.dataset.filter=key;
  btn.textContent=def.name; btn.onclick=()=>setFilter(key);
  bar.insertBefore(btn, document.getElementById('bubbleCount'));

  addActivity(key, 'agent added to pipeline');
  renderSidebar();
  closeModal();

  // Clear fields
  document.getElementById('newAgentName').value='';
  document.getElementById('newAgentFocus').value='';
  document.getElementById('newAgentKey').value='';
}

// ====================== UTILITIES ======================
function lerp(a,b,t){ return a+(b-a)*t; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function hexToRgba(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function formatTime(t){
  if(!t) return '--';
  try{
    const d=new Date(t);
    return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  }catch(e){ return t; }
}
function escHtml(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}
